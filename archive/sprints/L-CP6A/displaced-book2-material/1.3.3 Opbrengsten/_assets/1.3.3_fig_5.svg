<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="450" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">Opbrengsten en kosten &#8212; overzicht</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#718096"/>
    </marker>
  </defs>

  <!-- Row 1: TO = P x Q -->
  <rect x="60" y="60" width="200" height="50" rx="8" fill="#1A5276" fill-opacity="0.12" stroke="#1A5276" stroke-width="1.5"/>
  <text x="160" y="82" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1A5276">Totale opbrengst (TO)</text>
  <text x="160" y="100" text-anchor="middle" font-family="Arial" font-size="12" fill="#1A5276">TO = P &#215; Q</text>

  <!-- Row 1: TK = TCK + TVK -->
  <rect x="340" y="60" width="200" height="50" rx="8" fill="#E67E22" fill-opacity="0.12" stroke="#E67E22" stroke-width="1.5"/>
  <text x="440" y="82" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#E67E22">Totale kosten (TK)</text>
  <text x="440" y="100" text-anchor="middle" font-family="Arial" font-size="12" fill="#E67E22">TK = TCK + TVK</text>

  <!-- Arrows down from TO and TK to Winst box -->
  <line x1="160" y1="110" x2="240" y2="170" stroke="#718096" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="110" x2="360" y2="170" stroke="#718096" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Row 2: Winst = TO - TK -->
  <rect x="200" y="170" width="200" height="50" rx="8" fill="#27AE60" fill-opacity="0.12" stroke="#27AE60" stroke-width="1.5"/>
  <text x="300" y="192" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#27AE60">Winst</text>
  <text x="300" y="210" text-anchor="middle" font-family="Arial" font-size="12" fill="#27AE60">Winst = TO &#8722; TK</text>

  <!-- Arrow down to decision -->
  <line x1="300" y1="220" x2="300" y2="260" stroke="#718096" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Row 3: Three outcome boxes -->
  <!-- Verlies -->
  <rect x="40" y="265" width="155" height="65" rx="8" fill="#E74C3C" fill-opacity="0.10" stroke="#E74C3C" stroke-width="1.5"/>
  <text x="117.5" y="288" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#E74C3C">Verlies</text>
  <text x="117.5" y="306" text-anchor="middle" font-family="Arial" font-size="11" fill="#E74C3C">TO &lt; TK</text>
  <text x="117.5" y="322" text-anchor="middle" font-family="Arial" font-size="11" fill="#E74C3C">winst &lt; 0</text>

  <!-- Break-even -->
  <rect x="222" y="265" width="155" height="65" rx="8" fill="#2D3748" fill-opacity="0.08" stroke="#2D3748" stroke-width="1.5"/>
  <text x="299.5" y="288" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2D3748">Break-even</text>
  <text x="299.5" y="306" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">TO = TK</text>
  <text x="299.5" y="322" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">winst = 0</text>

  <!-- Winst -->
  <rect x="405" y="265" width="155" height="65" rx="8" fill="#27AE60" fill-opacity="0.10" stroke="#27AE60" stroke-width="1.5"/>
  <text x="482.5" y="288" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60">Winst</text>
  <text x="482.5" y="306" text-anchor="middle" font-family="Arial" font-size="11" fill="#27AE60">TO &gt; TK</text>
  <text x="482.5" y="322" text-anchor="middle" font-family="Arial" font-size="11" fill="#27AE60">winst &gt; 0</text>

  <!-- Arrows from Winst box to three outcomes -->
  <line x1="240" y1="220" x2="117.5" y2="260" stroke="#718096" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="220" x2="299.5" y2="260" stroke="#718096" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="220" x2="482.5" y2="260" stroke="#718096" stroke-width="1.2" marker-end="url(#arrowhead)"/>

  <!-- Row 4: Break-even formula -->
  <rect x="130" y="365" width="340" height="55" rx="8" fill="#1E2761" fill-opacity="0.06" stroke="#1E2761" stroke-width="1"/>
  <text x="300" y="388" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1E2761">Break-evenpunt berekenen</text>
  <text x="300" y="408" text-anchor="middle" font-family="Arial" font-size="12" fill="#1E2761">TO = TK &#8594; Q = TCK / (P &#8722; GVK)</text>

  <!-- Arrow from break-even box to formula -->
  <line x1="299.5" y1="330" x2="300" y2="360" stroke="#718096" stroke-width="1.2" marker-end="url(#arrowhead)"/>
</svg>