<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="450" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">TK en TO van de fietsenmaker</text>

  <!-- Grid lines -->
  <g stroke="#E5E5E5" stroke-width="0.5" stroke-dasharray="4,3">
    <!-- Horizontal: €0 to 3000, step 500 -->
    <!-- €500: y=390-56.7=333.3, €1000: 276.7, €1500: 220.0, €2000: 163.3, €2500: 106.7, €3000: 50 -->
    <line x1="80" y1="333.3" x2="560" y2="333.3"/>
    <line x1="80" y1="276.7" x2="560" y2="276.7"/>
    <line x1="80" y1="220.0" x2="560" y2="220.0"/>
    <line x1="80" y1="163.3" x2="560" y2="163.3"/>
    <line x1="80" y1="106.7" x2="560" y2="106.7"/>
    <line x1="80" y1="50.0" x2="560" y2="50.0"/>
    <!-- Vertical: Q=10,20,...,80 => x=140,200,...,560 -->
    <line x1="140" y1="50" x2="140" y2="390"/>
    <line x1="200" y1="50" x2="200" y2="390"/>
    <line x1="260" y1="50" x2="260" y2="390"/>
    <line x1="320" y1="50" x2="320" y2="390"/>
    <line x1="380" y1="50" x2="380" y2="390"/>
    <line x1="440" y1="50" x2="440" y2="390"/>
    <line x1="500" y1="50" x2="500" y2="390"/>
    <line x1="560" y1="50" x2="560" y2="390"/>
  </g>

  <!-- Y-axis -->
  <line x1="80" y1="390" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>
  <text x="18" y="220" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096" transform="rotate(-90,18,220)">Euro (&#8364;)</text>

  <!-- X-axis -->
  <line x1="80" y1="390" x2="565" y2="390" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="565,390 555,386 555,394" fill="#2D3748"/>
  <text x="320" y="435" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096">Aantal reparaties (Q)</text>

  <!-- Origin -->
  <text x="72" y="404" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">0</text>

  <!-- Y-axis ticks: 500, 1000, 1500, 2000, 2500, 3000 -->
  <line x1="75" y1="333.3" x2="80" y2="333.3" stroke="#2D3748"/>
  <text x="72" y="337" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">500</text>
  <line x1="75" y1="276.7" x2="80" y2="276.7" stroke="#2D3748"/>
  <text x="72" y="280" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">1.000</text>
  <line x1="75" y1="220.0" x2="80" y2="220.0" stroke="#2D3748"/>
  <text x="72" y="224" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">1.500</text>
  <line x1="75" y1="163.3" x2="80" y2="163.3" stroke="#2D3748"/>
  <text x="72" y="167" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">2.000</text>
  <line x1="75" y1="106.7" x2="80" y2="106.7" stroke="#2D3748"/>
  <text x="72" y="110" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">2.500</text>
  <line x1="75" y1="50.0" x2="80" y2="50.0" stroke="#2D3748"/>
  <text x="72" y="54" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">3.000</text>

  <!-- X-axis ticks: 10, 20, ..., 80 -->
  <line x1="140" y1="390" x2="140" y2="395" stroke="#2D3748"/>
  <text x="140" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">10</text>
  <line x1="200" y1="390" x2="200" y2="395" stroke="#2D3748"/>
  <text x="200" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">20</text>
  <line x1="260" y1="390" x2="260" y2="395" stroke="#2D3748"/>
  <text x="260" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">30</text>
  <line x1="320" y1="390" x2="320" y2="395" stroke="#2D3748"/>
  <text x="320" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">40</text>
  <line x1="380" y1="390" x2="380" y2="395" stroke="#2D3748"/>
  <text x="380" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">50</text>
  <line x1="440" y1="390" x2="440" y2="395" stroke="#2D3748"/>
  <text x="440" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">60</text>
  <line x1="500" y1="390" x2="500" y2="395" stroke="#2D3748"/>
  <text x="500" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">70</text>
  <line x1="560" y1="390" x2="560" y2="395" stroke="#2D3748"/>
  <text x="560" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">80</text>

  <!-- Verlies zone (red) -->
  <polygon points="80,390 320,231.3 80,299.3" fill="#E74C3C" fill-opacity="0.15"/>

  <!-- Winst zone (green) -->
  <polygon points="320,231.3 560,72.7 560,163.3" fill="#27AE60" fill-opacity="0.15"/>

  <!-- TO line: (0,0) to (80,2800) => (80,390) to (560,72.7) -->
  <!-- TO at Q=80: 35*80=2800 => y=390-2800*0.11333=390-317.3=72.7 -->
  <line x1="80" y1="390" x2="560" y2="72.7" stroke="#1A5276" stroke-width="2.5"/>
  <text x="565" y="77" font-family="Arial" font-size="13" font-weight="bold" fill="#1A5276">TO</text>

  <!-- TK line: (0,800) to (80,2000) => (80,299.3) to (560,163.3) -->
  <!-- TK at Q=0: 800 => y=390-800*0.11333=390-90.7=299.3 -->
  <!-- TK at Q=80: 2000 => y=390-2000*0.11333=390-226.7=163.3 -->
  <line x1="80" y1="299.3" x2="560" y2="163.3" stroke="#E67E22" stroke-width="2.5"/>
  <text x="565" y="168" font-family="Arial" font-size="13" font-weight="bold" fill="#E67E22">TK</text>

  <!-- BEP: Q=40, €=1400 => (320, 231.3) -->
  <!-- Verify: x=80+40*6=320, y=390-1400*0.11333=390-158.7=231.3 -->
  <circle cx="320" cy="231.3" r="5" fill="#2D3748"/>
  <line x1="320" y1="231.3" x2="320" y2="390" stroke="#2D3748" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="80" y1="231.3" x2="320" y2="231.3" stroke="#2D3748" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="320" y="218" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2D3748">BEP</text>

  <!-- BEP axis labels -->
  <text x="320" y="408" text-anchor="middle" font-family="Arial" font-size="10" fill="#2D3748">40</text>
  <text x="72" y="235" text-anchor="end" font-family="Arial" font-size="10" fill="#2D3748">1.400</text>

  <!-- Zone labels -->
  <text x="190" y="330" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#E74C3C">verlies</text>
  <text x="470" y="140" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60">winst</text>
</svg>