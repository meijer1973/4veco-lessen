<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="450" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">Kosten van de fietsenmaker</text>

  <!-- Plot area: x=80..560, y=50..390
       Fietsenmaker: TCK=800, VK per stuk=€15
       x-axis: Q 0-100 (reparaties), px_per_Q = 480/100 = 4.8
       y-axis: Kosten €0-2500, px_per_euro = 340/2500 = 0.136
       q_to_x(q) = 80 + q * 4.8
       euro_to_y(v) = 390 - v * 0.136
  -->

  <!-- Grid lines -->
  <line x1="80" y1="322" x2="560" y2="322" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 500 -->
  <line x1="80" y1="254" x2="560" y2="254" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 1000 -->
  <line x1="80" y1="186" x2="560" y2="186" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 1500 -->
  <line x1="80" y1="118" x2="560" y2="118" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 2000 -->
  <line x1="80" y1="50" x2="560" y2="50" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 2500 -->

  <line x1="176" y1="50" x2="176" y2="390" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 20 -->
  <line x1="272" y1="50" x2="272" y2="390" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 40 -->
  <line x1="368" y1="50" x2="368" y2="390" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 60 -->
  <line x1="464" y1="50" x2="464" y2="390" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 80 -->

  <!-- Y-axis -->
  <line x1="80" y1="390" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>
  <text x="15" y="220" text-anchor="middle" font-family="Arial" font-size="13" fill="#718096" transform="rotate(-90,15,220)">Kosten (€)</text>

  <!-- X-axis -->
  <line x1="80" y1="390" x2="565" y2="390" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="565,390 555,386 555,394" fill="#2D3748"/>
  <text x="320" y="435" text-anchor="middle" font-family="Arial" font-size="13" fill="#718096">Aantal reparaties (Q)</text>

  <!-- Origin -->
  <text x="72" y="405" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">0</text>

  <!-- Y-axis ticks -->
  <line x1="75" y1="322" x2="80" y2="322" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="326" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">500</text>

  <line x1="75" y1="281.2" x2="80" y2="281.2" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="285" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">800</text>

  <line x1="75" y1="254" x2="80" y2="254" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="258" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">1000</text>

  <line x1="75" y1="186" x2="80" y2="186" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="190" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">1500</text>

  <line x1="75" y1="118" x2="80" y2="118" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="122" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">2000</text>

  <line x1="75" y1="50" x2="80" y2="50" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="54" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">2500</text>

  <!-- X-axis ticks -->
  <line x1="176" y1="390" x2="176" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="176" y="408" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">20</text>

  <line x1="272" y1="390" x2="272" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="272" y="408" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">40</text>

  <line x1="368" y1="390" x2="368" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="368" y="408" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">60</text>

  <line x1="464" y1="390" x2="464" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="464" y="408" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">80</text>

  <line x1="560" y1="390" x2="560" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="560" y="408" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">100</text>

  <!-- === CURVES === -->
  <!-- TCK = 800 (constant, dashed) → y = 390 - 800*0.136 = 390 - 108.8 = 281.2 -->
  <line x1="80" y1="281.2" x2="560" y2="281.2" stroke="#E67E22" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="567" y="277" font-family="Arial" font-size="12" font-weight="bold" fill="#E67E22">TCK</text>

  <!-- TVK = 15Q → at Q=0: y=390, at Q=100: 1500 → y=390-204=186 -->
  <line x1="80" y1="390" x2="560" y2="186" stroke="#27AE60" stroke-width="2.5"/>
  <text x="567" y="182" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60">TVK</text>

  <!-- TK = 800 + 15Q → at Q=0: 800 → y=281.2, at Q=100: 2300 → y=390-312.8=77.2 -->
  <line x1="80" y1="281.2" x2="560" y2="77.2" stroke="#1A5276" stroke-width="2.5"/>
  <text x="567" y="73" font-family="Arial" font-size="12" font-weight="bold" fill="#1A5276">TK</text>

  <!-- Marked points from worked example: Q=40 and Q=80 -->
  <!-- Q=40: x=80+40*4.8=272
       TCK=800 → y=281.2
       TVK=600 → y=390-81.6=308.4
       TK=1400 → y=390-190.4=199.6 -->
  <circle cx="272" cy="199.6" r="4" fill="#1A5276"/>
  <circle cx="272" cy="308.4" r="4" fill="#27AE60"/>
  <line x1="272" y1="390" x2="272" y2="199.6" stroke="#718096" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- Q=80: x=80+80*4.8=464
       TCK=800 → y=281.2
       TVK=1200 → y=390-163.2=226.8
       TK=2000 → y=390-272=118 -->
  <circle cx="464" cy="118" r="4" fill="#1A5276"/>
  <circle cx="464" cy="226.8" r="4" fill="#27AE60"/>
  <line x1="464" y1="390" x2="464" y2="118" stroke="#718096" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- Labels for marked points -->
  <text x="280" y="194" font-family="Arial" font-size="9" fill="#1A5276">TK = €1400</text>
  <text x="280" y="303" font-family="Arial" font-size="9" fill="#27AE60">TVK = €600</text>

  <text x="472" y="113" font-family="Arial" font-size="9" fill="#1A5276">TK = €2000</text>
  <text x="472" y="222" font-family="Arial" font-size="9" fill="#27AE60">TVK = €1200</text>

  <!-- TCK label at Q=40 -->
  <text x="247" y="248" font-family="Arial" font-size="9" fill="#E67E22">TCK = €800</text>
</svg>