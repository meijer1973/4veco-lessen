<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="450" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">Figuur 4: Kostenlijnen van een kledingfabriek</text>

  <!-- Plot area: x=80..560, y=50..390
       Kledingfabriek: TCK=2000, VK per stuk=€5
       x-axis: Q 0-500 stuks, px_per_Q = 480/500 = 0.96
       y-axis: Kosten €0-5000, px_per_euro = 340/5000 = 0.068
       q_to_x(q) = 80 + q * 0.96
       euro_to_y(v) = 390 - v * 0.068
  -->

  <!-- Grid lines -->
  <line x1="80" y1="322" x2="560" y2="322" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 1000 -->
  <line x1="80" y1="254" x2="560" y2="254" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 2000 -->
  <line x1="80" y1="186" x2="560" y2="186" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 3000 -->
  <line x1="80" y1="118" x2="560" y2="118" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 4000 -->
  <line x1="80" y1="50" x2="560" y2="50" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 5000 -->

  <line x1="176" y1="50" x2="176" y2="390" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 100 -->
  <line x1="272" y1="50" x2="272" y2="390" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 200 -->
  <line x1="368" y1="50" x2="368" y2="390" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 300 -->
  <line x1="464" y1="50" x2="464" y2="390" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 400 -->

  <!-- Y-axis -->
  <line x1="80" y1="390" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>
  <text x="15" y="220" text-anchor="middle" font-family="Arial" font-size="13" fill="#718096" transform="rotate(-90,15,220)">Kosten (€)</text>

  <!-- X-axis -->
  <line x1="80" y1="390" x2="565" y2="390" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="565,390 555,386 555,394" fill="#2D3748"/>
  <text x="320" y="435" text-anchor="middle" font-family="Arial" font-size="13" fill="#718096">Hoeveelheid (Q)</text>

  <!-- Origin -->
  <text x="72" y="405" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">0</text>

  <!-- Y-axis ticks -->
  <line x1="75" y1="322" x2="80" y2="322" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="326" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">1000</text>

  <line x1="75" y1="254" x2="80" y2="254" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="258" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">2000</text>

  <line x1="75" y1="186" x2="80" y2="186" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="190" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">3000</text>

  <line x1="75" y1="118" x2="80" y2="118" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="122" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">4000</text>

  <line x1="75" y1="50" x2="80" y2="50" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="54" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">5000</text>

  <!-- X-axis ticks -->
  <line x1="176" y1="390" x2="176" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="176" y="408" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">100</text>

  <line x1="272" y1="390" x2="272" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="272" y="408" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">200</text>

  <line x1="368" y1="390" x2="368" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="368" y="408" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">300</text>

  <line x1="464" y1="390" x2="464" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="464" y="408" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">400</text>

  <line x1="560" y1="390" x2="560" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="560" y="408" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">500</text>

  <!-- === CURVES === -->
  <!-- TCK = 2000 (constant, dashed) → y = 390 - 2000*0.068 = 390 - 136 = 254 -->
  <line x1="80" y1="254" x2="560" y2="254" stroke="#E67E22" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="567" y="250" font-family="Arial" font-size="12" font-weight="bold" fill="#E67E22">TCK</text>

  <!-- TVK = 5Q → at Q=0: y=390, at Q=500: 2500 → y=390-170=220 -->
  <line x1="80" y1="390" x2="560" y2="220" stroke="#27AE60" stroke-width="2.5"/>
  <text x="567" y="216" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60">TVK</text>

  <!-- TK = 2000 + 5Q → at Q=0: 2000 → y=254, at Q=500: 4500 → y=390-306=84 -->
  <line x1="80" y1="254" x2="560" y2="84" stroke="#1A5276" stroke-width="2.5"/>
  <text x="567" y="80" font-family="Arial" font-size="12" font-weight="bold" fill="#1A5276">TK</text>

  <!-- Reference points for students to read off -->
  <!-- Q=200: x=80+200*0.96=272
       TCK=2000 → y=254
       TVK=1000 → y=390-68=322
       TK=3000 → y=390-204=186 -->
  <circle cx="272" cy="186" r="4" fill="#1A5276"/>
  <circle cx="272" cy="322" r="4" fill="#27AE60"/>
  <line x1="272" y1="390" x2="272" y2="186" stroke="#718096" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- Dashed horizontal reference from TK at Q=200 to y-axis -->
  <line x1="80" y1="186" x2="272" y2="186" stroke="#718096" stroke-width="0.8" stroke-dasharray="3,2"/>
  <!-- Dashed horizontal reference from TVK at Q=200 to y-axis -->
  <line x1="80" y1="322" x2="272" y2="322" stroke="#718096" stroke-width="0.8" stroke-dasharray="3,2"/>
</svg>