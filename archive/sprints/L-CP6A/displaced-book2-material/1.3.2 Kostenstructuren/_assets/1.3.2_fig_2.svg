<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="450" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">GCK, GVK en GTK als functie van Q</text>

  <!-- Plot area: x=80..560, y=50..390
       x-axis: Q 0-1000, px_per_Q = 480/1000 = 0.48
       y-axis: €0-6, px_per_euro = 340/6 = 56.67
       q_to_x(q) = 80 + q * 0.48
       euro_to_y(v) = 390 - v * 56.67
  -->

  <!-- Grid lines -->
  <line x1="80" y1="333.3" x2="560" y2="333.3" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 1 -->
  <line x1="80" y1="276.7" x2="560" y2="276.7" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 2 -->
  <line x1="80" y1="220" x2="560" y2="220" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 3 -->
  <line x1="80" y1="163.3" x2="560" y2="163.3" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 4 -->
  <line x1="80" y1="106.7" x2="560" y2="106.7" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 5 -->
  <line x1="80" y1="50" x2="560" y2="50" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 6 -->

  <line x1="176" y1="50" x2="176" y2="390" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 200 -->
  <line x1="272" y1="50" x2="272" y2="390" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 400 -->
  <line x1="368" y1="50" x2="368" y2="390" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 600 -->
  <line x1="464" y1="50" x2="464" y2="390" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 800 -->

  <!-- Y-axis -->
  <line x1="80" y1="390" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>
  <text x="15" y="220" text-anchor="middle" font-family="Arial" font-size="13" fill="#718096" transform="rotate(-90,15,220)">Kosten per stuk (€)</text>

  <!-- X-axis -->
  <line x1="80" y1="390" x2="565" y2="390" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="565,390 555,386 555,394" fill="#2D3748"/>
  <text x="320" y="435" text-anchor="middle" font-family="Arial" font-size="13" fill="#718096">Hoeveelheid (Q)</text>

  <!-- Origin -->
  <text x="72" y="405" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">0</text>

  <!-- Y-axis ticks -->
  <line x1="75" y1="333.3" x2="80" y2="333.3" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="337" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">1</text>

  <line x1="75" y1="276.7" x2="80" y2="276.7" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="280" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">2</text>

  <line x1="75" y1="220" x2="80" y2="220" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="224" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">3</text>

  <line x1="75" y1="163.3" x2="80" y2="163.3" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="167" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">4</text>

  <line x1="75" y1="106.7" x2="80" y2="106.7" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="110" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">5</text>

  <line x1="75" y1="50" x2="80" y2="50" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="54" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">6</text>

  <!-- X-axis ticks -->
  <line x1="176" y1="390" x2="176" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="176" y="408" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">200</text>

  <line x1="272" y1="390" x2="272" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="272" y="408" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">400</text>

  <line x1="368" y1="390" x2="368" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="368" y="408" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">600</text>

  <line x1="464" y1="390" x2="464" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="464" y="408" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">800</text>

  <line x1="560" y1="390" x2="560" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="560" y="408" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">1000</text>

  <!-- === CURVES === -->
  <!-- GVK = €0.80 (constant horizontal line)
       y = 390 - 0.80 * 56.67 = 390 - 45.3 = 344.7 -->
  <line x1="80" y1="344.7" x2="560" y2="344.7" stroke="#27AE60" stroke-width="2.5"/>
  <text x="567" y="341" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60">GVK</text>

  <!-- Dashed reference line for GVK = €0,80 label -->
  <text x="567" y="354" font-family="Arial" font-size="9" fill="#27AE60">= €0,80</text>

  <!-- GCK = 500/Q (hyperbola), sample points to draw polyline:
       Q=50:  GCK=10 (off chart, clip at 6) → skip, start at Q where GCK=6: Q=500/6=83.3
       Q=83:  GCK=6.02 → y=390-6.02*56.67=390-341=49  x=80+83*0.48=119.8
       Q=100: GCK=5.00 → y=390-283.3=106.7  x=80+100*0.48=128
       Q=125: GCK=4.00 → y=390-226.7=163.3  x=80+125*0.48=140
       Q=150: GCK=3.33 → y=390-188.9=201.1  x=80+150*0.48=152
       Q=200: GCK=2.50 → y=390-141.7=248.3  x=176
       Q=250: GCK=2.00 → y=276.7  x=200
       Q=300: GCK=1.67 → y=390-94.5=295.5  x=224
       Q=400: GCK=1.25 → y=390-70.8=319.2  x=272
       Q=500: GCK=1.00 → y=333.3  x=320
       Q=600: GCK=0.833 → y=390-47.2=342.8  x=368
       Q=700: GCK=0.714 → y=390-40.5=349.5  x=416
       Q=800: GCK=0.625 → y=390-35.4=354.6  x=464
       Q=900: GCK=0.556 → y=390-31.5=358.5  x=512
       Q=1000: GCK=0.50 → y=390-28.3=361.7  x=560
  -->
  <polyline points="119.8,49 128,106.7 140,163.3 152,201.1 176,248.3 200,276.7 224,295.5 272,319.2 320,333.3 368,342.8 416,349.5 464,354.6 512,358.5 560,361.7"
    fill="none" stroke="#E67E22" stroke-width="2.5"/>
  <text x="567" y="365" font-family="Arial" font-size="12" font-weight="bold" fill="#E67E22">GCK</text>

  <!-- GTK = 500/Q + 0.80 (GCK + GVK), polyline:
       Q=83:  GTK=6.82 → off chart top, clip. Start at Q where GTK=6: 500/Q+0.8=6 → Q=96.2
       Q=96:  GTK=6.01 → y=390-340.5=49.5  x=80+96*0.48=126.1
       Q=100: GTK=5.80 → y=390-328.7=61.3  x=128
       Q=125: GTK=4.80 → y=390-272=118  x=140
       Q=150: GTK=4.13 → y=390-234.2=155.8  x=152
       Q=200: GTK=3.30 → y=390-187=203  x=176
       Q=250: GTK=2.80 → y=390-158.7=231.3  x=200
       Q=300: GTK=2.47 → y=390-139.7=250.3  x=224
       Q=400: GTK=2.05 → y=390-116.2=273.8  x=272
       Q=500: GTK=1.80 → y=390-102=288  x=320
       Q=600: GTK=1.63 → y=390-92.5=297.5  x=368
       Q=700: GTK=1.51 → y=390-85.8=304.2  x=416
       Q=800: GTK=1.43 → y=390-80.7=309.3  x=464
       Q=900: GTK=1.36 → y=390-76.8=313.2  x=512
       Q=1000: GTK=1.30 → y=390-73.7=316.3  x=560
  -->
  <polyline points="126.1,49.5 128,61.3 140,118 152,155.8 176,203 200,231.3 224,250.3 272,273.8 320,288 368,297.5 416,304.2 464,309.3 512,313.2 560,316.3"
    fill="none" stroke="#8E44AD" stroke-width="2.5"/>
  <text x="567" y="312" font-family="Arial" font-size="12" font-weight="bold" fill="#8E44AD">GTK</text>

  <!-- Annotation: dashed arrow showing GTK approaches GVK -->
  <text x="430" y="295" font-family="Arial" font-size="10" font-style="italic" fill="#718096">GTK nadert GVK</text>
  <line x1="430" y1="298" x2="490" y2="320" stroke="#718096" stroke-width="0.8" stroke-dasharray="3,2"/>
</svg>