<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="450" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E2761">Aanbod van stadsfietsen op de Nederlandse markt</text>

  <!-- Defs: arrowheads -->
  <defs>
    <marker id="arrowY" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,8 L4,0 L8,8" fill="#2D3748"/>
    </marker>
    <marker id="arrowX" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="#2D3748"/>
    </marker>
  </defs>

  <!-- Grid lines (light gray dashed) -->
  <!-- Horizontal grid at P = 100, 200, 300, 400, 500, 600, 700 -->
  <line x1="80" y1="347" x2="560" y2="347" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="305" x2="560" y2="305" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="262" x2="560" y2="262" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="220" x2="560" y2="220" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="177" x2="560" y2="177" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="135" x2="560" y2="135" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="92" x2="560" y2="92" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Vertical grid at Q = 2, 4, 6, 8, 10, 12, 14, 16 (×1000) -->
  <line x1="140" y1="50" x2="140" y2="390" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="200" y1="50" x2="200" y2="390" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="260" y1="50" x2="260" y2="390" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="320" y1="50" x2="320" y2="390" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="380" y1="50" x2="380" y2="390" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="440" y1="50" x2="440" y2="390" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="500" y1="50" x2="500" y2="390" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="560" y1="50" x2="560" y2="390" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Y-axis -->
  <line x1="80" y1="390" x2="80" y2="48" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <text x="18" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1A5276" transform="rotate(-90,18,220)">Prijs (&#8364;)</text>

  <!-- X-axis -->
  <line x1="80" y1="390" x2="562" y2="390" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrowX)"/>
  <text x="320" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1A5276">Hoeveelheid (&#215;1000 stuks)</text>

  <!-- Origin -->
  <text x="72" y="404" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#2D3748">0</text>

  <!-- Y-axis ticks and labels -->
  <!-- P scale: 0 at y=390, 800 at y=50. px_per_P = 340/800 = 0.425 -->
  <!-- P=100: y=390-42.5=347.5≈347 -->
  <line x1="75" y1="347" x2="80" y2="347" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="351" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#2D3748">100</text>
  <!-- P=200: y=390-85=305 -->
  <line x1="75" y1="305" x2="80" y2="305" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="309" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#2D3748">200</text>
  <!-- P=300: y=390-127.5≈262 -->
  <line x1="75" y1="262" x2="80" y2="262" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="266" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#2D3748">300</text>
  <!-- P=400: y=390-170=220 -->
  <line x1="75" y1="220" x2="80" y2="220" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="224" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#2D3748">400</text>
  <!-- P=500: y=390-212.5≈177 -->
  <line x1="75" y1="177" x2="80" y2="177" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="181" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#2D3748">500</text>
  <!-- P=600: y=390-255=135 -->
  <line x1="75" y1="135" x2="80" y2="135" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="139" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#2D3748">600</text>
  <!-- P=700: y=390-297.5≈92 -->
  <line x1="75" y1="92" x2="80" y2="92" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="96" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#2D3748">700</text>

  <!-- X-axis ticks and labels (Q in ×1000, step 2) -->
  <!-- Q scale: 0 at x=80, 16 at x=560. px_per_Q1000 = 30 -->
  <!-- Q=2: x=140 -->
  <line x1="140" y1="390" x2="140" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="140" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2D3748">2</text>
  <!-- Q=4: x=200 -->
  <line x1="200" y1="390" x2="200" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="200" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2D3748">4</text>
  <!-- Q=6: x=260 -->
  <line x1="260" y1="390" x2="260" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="260" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2D3748">6</text>
  <!-- Q=8: x=320 -->
  <line x1="320" y1="390" x2="320" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="320" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2D3748">8</text>
  <!-- Q=10: x=380 -->
  <line x1="380" y1="390" x2="380" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="380" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2D3748">10</text>
  <!-- Q=12: x=440 -->
  <line x1="440" y1="390" x2="440" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="440" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2D3748">12</text>
  <!-- Q=14: x=500 -->
  <line x1="500" y1="390" x2="500" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="500" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2D3748">14</text>
  <!-- Q=16: x=560 -->
  <line x1="560" y1="390" x2="560" y2="395" stroke="#2D3748" stroke-width="1"/>
  <text x="560" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2D3748">16</text>

  <!-- Supply curve A₁ -->
  <!-- Function: P = 40*Q_k + 60 (Q_k in thousands) -->
  <!-- Y-intercept: P=60 at Q=0 → (80, 390-25.5) = (80, 365) -->
  <!-- At Q_k=15: P=660 → (530, 390-280.5) = (530, 110) -->
  <line x1="80" y1="365" x2="530" y2="110" stroke="#E67E22" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Supply curve label A₁ -->
  <text x="538" y="106" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E67E22">A&#8321;</text>

  <!-- Equilibrium point E at Q_k=7, P=340 -->
  <!-- x = 80 + 7*30 = 290, y = 390 - 340*0.425 = 390 - 144.5 = 245.5 ≈ 246 -->
  <!-- Verify on line: y = 365 + (290-80)*(110-365)/(530-80) = 365 + 210*(-255/450) = 365 - 119 = 246 ✓ -->

  <!-- Dashed lines from E to axes -->
  <line x1="290" y1="246" x2="290" y2="390" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="80" y1="246" x2="290" y2="246" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Equilibrium labels on axes -->
  <text x="72" y="250" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#1A5276">340</text>
  <text x="290" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1A5276">7</text>

  <!-- Equilibrium dot E -->
  <circle cx="290" cy="246" r="4.5" fill="#1A5276"/>

  <!-- E label -->
  <text x="302" y="240" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A5276">E</text>

</svg>