<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="360" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E2761">Vraag en aanbod van mandarijnen op de weekmarkt</text>

  <!-- Defs: arrowheads -->
  <defs>
    <marker id="arrowY" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,8 L4,0 L8,8" fill="#2D3748"/>
    </marker>
    <marker id="arrowX" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="#2D3748"/>
    </marker>
  </defs>

  <!-- Y-axis -->
  <line x1="80" y1="310" x2="80" y2="43" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <text x="15" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#718096" transform="rotate(-90,15,180)">Prijs (€)</text>

  <!-- X-axis -->
  <line x1="80" y1="310" x2="682" y2="310" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrowX)"/>
  <text x="380" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#718096">Hoeveelheid (kratten per week)</text>

  <!-- Origin -->
  <text x="72" y="325" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#2D3748">0</text>

  <!-- Y-axis tick marks: P=10,20,28,30,40,50 -->
  <!-- px_per_P = 5.3, origin_y = 310 -->
  <!-- P=10: y=310-53=257 -->
  <line x1="75" y1="257" x2="80" y2="257" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="261" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#2D3748">10</text>
  <!-- P=20: y=310-106=204 -->
  <line x1="75" y1="204" x2="80" y2="204" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="208" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#2D3748">20</text>
  <!-- P=30: y=310-159=151 -->
  <line x1="75" y1="151" x2="80" y2="151" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="155" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#2D3748">30</text>
  <!-- P=40: y=310-212=98 -->
  <line x1="75" y1="98" x2="80" y2="98" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="102" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#2D3748">40</text>
  <!-- P=50: y=310-265=45 -->
  <line x1="75" y1="45" x2="80" y2="45" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="49" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#2D3748">50</text>

  <!-- X-axis tick marks: Q=10,20,22,30,40,50 -->
  <!-- px_per_Q = 12, origin_x = 80 -->
  <!-- Q=10: x=80+120=200 -->
  <line x1="200" y1="310" x2="200" y2="315" stroke="#2D3748" stroke-width="1"/>
  <text x="200" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2D3748">10</text>
  <!-- Q=20: x=80+240=320 -->
  <line x1="320" y1="310" x2="320" y2="315" stroke="#2D3748" stroke-width="1"/>
  <text x="320" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2D3748">20</text>
  <!-- Q=30: x=80+360=440 -->
  <line x1="440" y1="310" x2="440" y2="315" stroke="#2D3748" stroke-width="1"/>
  <text x="440" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2D3748">30</text>
  <!-- Q=40: x=80+480=560 -->
  <line x1="560" y1="310" x2="560" y2="315" stroke="#2D3748" stroke-width="1"/>
  <text x="560" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2D3748">40</text>
  <!-- Q=50: x=80+600=680 -->
  <line x1="680" y1="310" x2="680" y2="315" stroke="#2D3748" stroke-width="1"/>
  <text x="680" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2D3748">50</text>

  <!-- Demand curve V: Qv = -P + 50 -->
  <!-- P=50,Q=0: (80,45) to P=0,Q=50: (680,310) -->
  <line x1="80" y1="45" x2="680" y2="310" stroke="#1A5276" stroke-width="2.5" stroke-linecap="round"/>
  <text x="688" y="310" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A5276">V</text>

  <!-- Supply curve A: Qa = 2P - 34 -->
  <!-- Qa=0 at P=17: y=310-17*5.3=220, x=80 -->
  <!-- At P=42, Q=50: y=310-42*5.3=87, x=680 -->
  <line x1="80" y1="220" x2="680" y2="87" stroke="#27AE60" stroke-width="2.5" stroke-linecap="round"/>
  <text x="688" y="87" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27AE60">A</text>

  <!-- Equilibrium: P*=28, Q*=22 -->
  <!-- x=80+22*12=344, y=310-28*5.3=162 -->

  <!-- Dashed lines from equilibrium to axes -->
  <line x1="344" y1="162" x2="344" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="80" y1="162" x2="344" y2="162" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Equilibrium labels on axes -->
  <text x="72" y="166" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#1A5276" font-weight="bold">28</text>
  <text x="344" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1A5276" font-weight="bold">22</text>

  <!-- Equilibrium dot -->
  <circle cx="344" cy="162" r="4" fill="#1A5276"/>

  <!-- E label straight above -->
  <text x="344" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A5276">E</text>

  <!-- P=17 label on Y-axis (supply Y-intercept) -->
  <text x="72" y="224" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#718096">17</text>
</svg>