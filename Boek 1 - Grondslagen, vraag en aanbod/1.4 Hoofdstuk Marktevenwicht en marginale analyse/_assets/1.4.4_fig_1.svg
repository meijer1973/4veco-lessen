<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="400" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">Bedrijf 2: MK kruist MO bij het winstmaximum</text>

  <!-- Plot area: x=80..680, y=50..330
       Q range: 0..22, euro range: 0..40
       px_per_Q = 600/22 = 27.273
       px_per_euro = 280/40 = 7.0
       q_to_x(q) = 80 + q * 27.273
       euro_to_y(v) = 330 - v * 7.0
  -->

  <!-- Grid lines -->
  <line x1="80" y1="260" x2="680" y2="260" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/>
  <line x1="80" y1="190" x2="680" y2="190" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/>
  <line x1="80" y1="120" x2="680" y2="120" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/>

  <!-- Y-axis -->
  <line x1="80" y1="330" x2="80" y2="42" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,42 76,52 84,52" fill="#2D3748"/>
  <text x="15" y="190" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096" transform="rotate(-90,15,190)">Euro per stuk (&#8364;)</text>

  <!-- X-axis -->
  <line x1="80" y1="330" x2="685" y2="330" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="685,330 675,326 675,334" fill="#2D3748"/>
  <text x="380" y="385" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096">Hoeveelheid (Q)</text>

  <!-- Origin -->
  <text x="72" y="345" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">0</text>

  <!-- Y-axis ticks -->
  <line x1="75" y1="260" x2="80" y2="260" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="264" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">10</text>
  <line x1="75" y1="190" x2="80" y2="190" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="194" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">20</text>
  <line x1="75" y1="120" x2="80" y2="120" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="124" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">30</text>
  <line x1="75" y1="50" x2="80" y2="50" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="54" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">40</text>

  <!-- X-axis ticks -->
  <line x1="216.4" y1="330" x2="216.4" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="216.4" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">5</text>
  <line x1="352.7" y1="330" x2="352.7" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="352.7" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">10</text>
  <line x1="489.1" y1="330" x2="489.1" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="489.1" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">15</text>
  <line x1="625.5" y1="330" x2="625.5" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="625.5" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">20</text>

  <!-- MO = 30 constant: horizontal line at y = 330 - 30*7 = 120 -->
  <line x1="80" y1="120" x2="650" y2="120" stroke="#1A5276" stroke-width="2.5"/>
  <text x="656" y="116" font-family="Arial" font-size="12" font-weight="bold" fill="#1A5276">MO</text>

  <!-- MK line: MK = 2Q, passes through origin and (15,30) and (20,40)
       Q=0: MK=0, y=330. Q=5: MK=10, y=260. Q=10: MK=20, y=190.
       Q=15: MK=30, y=120. Q=20: MK=40, y=50.
       x values: 80, 216.4, 352.7, 489.1, 625.5
  -->
  <line x1="80" y1="330" x2="625.5" y2="50" stroke="#E67E22" stroke-width="2.5"/>
  <text x="635" y="46" font-family="Arial" font-size="12" font-weight="bold" fill="#E67E22">MK</text>

  <!-- Shaded area: winst zone where MO > MK (left of intersection) -->
  <polygon points="80,120 489.1,120 80,330" fill="#27AE60" fill-opacity="0.15"/>
  <text x="200" y="235" font-family="Arial" font-size="11" font-weight="bold" fill="#27AE60">MO &gt; MK</text>
  <text x="200" y="250" font-family="Arial" font-size="10" fill="#27AE60">winst stijgt</text>

  <!-- Area right of intersection: MK > MO -->
  <polygon points="489.1,120 625.5,50 625.5,120" fill="#F1948A" fill-opacity="0.15"/>
  <text x="555" y="100" font-family="Arial" font-size="11" font-weight="bold" fill="#D9534F">MK &gt; MO</text>
  <text x="555" y="113" font-family="Arial" font-size="10" fill="#D9534F">winst daalt</text>

  <!-- Intersection point: Q=15, MK=MO=30 at (489.1, 120) -->
  <circle cx="489.1" cy="120" r="5" fill="#2D3748"/>
  <line x1="489.1" y1="120" x2="489.1" y2="330" stroke="#2D3748" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="489.1" y="108" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2D3748">MO = MK</text>

  <!-- Q* label on x-axis -->
  <text x="489.1" y="368" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2D3748">Q* = 15</text>

  <!-- Sample dots on MK -->
  <circle cx="216.4" cy="260" r="3.5" fill="#E67E22"/>
  <circle cx="352.7" cy="190" r="3.5" fill="#E67E22"/>
  <circle cx="489.1" cy="120" r="3.5" fill="#E67E22"/>
  <circle cx="625.5" cy="50" r="3.5" fill="#E67E22"/>
</svg>