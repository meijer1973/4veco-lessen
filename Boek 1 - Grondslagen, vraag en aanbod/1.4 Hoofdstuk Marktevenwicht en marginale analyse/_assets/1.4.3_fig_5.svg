<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="360" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">Overzicht: marginale kosten en marginale opbrengsten</text>

  <!-- Central hub -->
  <rect x="260" y="60" width="200" height="44" rx="8" fill="#1A5276" stroke="#1A5276" stroke-width="1.5"/>
  <text x="360" y="78" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF">Marginaal denken</text>
  <text x="360" y="94" text-anchor="middle" font-family="Arial" font-size="11" fill="#FFFFFF">"Wat levert &#233;&#233;n extra op?"</text>

  <!-- Left branch: MK -->
  <rect x="40" y="140" width="260" height="80" rx="6" fill="#FEF3E2" stroke="#E67E22" stroke-width="1.5"/>
  <text x="170" y="162" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#E67E22">Marginale kosten (MK)</text>
  <text x="170" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">Extra kosten van 1 extra eenheid</text>
  <text x="170" y="196" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">MK = &#916;TK / &#916;Q</text>
  <text x="170" y="212" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic" fill="#718096">Kleur: oranje (#E67E22)</text>

  <!-- Right branch: MO -->
  <rect x="420" y="140" width="260" height="80" rx="6" fill="#EBF5FB" stroke="#1A5276" stroke-width="1.5"/>
  <text x="550" y="162" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1A5276">Marginale opbrengsten (MO)</text>
  <text x="550" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">Extra opbrengst van 1 extra eenheid</text>
  <text x="550" y="196" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">MO = &#916;TO / &#916;Q</text>
  <text x="550" y="212" text-anchor="middle" font-family="Arial" font-size="10" font-style="italic" fill="#718096">Kleur: blauw (#1A5276)</text>

  <!-- Connecting lines from hub -->
  <line x1="300" y1="104" x2="200" y2="140" stroke="#E67E22" stroke-width="1.5"/>
  <line x1="420" y1="104" x2="520" y2="140" stroke="#1A5276" stroke-width="1.5"/>

  <!-- Bottom row: two cases -->
  <rect x="40" y="250" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#E67E22" stroke-width="1"/>
  <text x="140" y="270" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#E67E22">Lineaire TK</text>
  <text x="140" y="288" text-anchor="middle" font-family="Arial" font-size="10" fill="#2D3748">TK = TCK + c&#183;Q</text>
  <text x="140" y="304" text-anchor="middle" font-family="Arial" font-size="10" fill="#2D3748">&#8594; MK is constant (= c)</text>

  <rect x="260" y="250" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#E67E22" stroke-width="1"/>
  <text x="360" y="270" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#E67E22">Kwadratische TK</text>
  <text x="360" y="288" text-anchor="middle" font-family="Arial" font-size="10" fill="#2D3748">TK = TCK + a&#183;Q&#178;</text>
  <text x="360" y="304" text-anchor="middle" font-family="Arial" font-size="10" fill="#2D3748">&#8594; MK stijgt met Q</text>

  <rect x="480" y="250" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#1A5276" stroke-width="1"/>
  <text x="580" y="270" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1A5276">Constante prijs</text>
  <text x="580" y="288" text-anchor="middle" font-family="Arial" font-size="10" fill="#2D3748">TO = P &#183; Q</text>
  <text x="580" y="304" text-anchor="middle" font-family="Arial" font-size="10" fill="#2D3748">&#8594; MO = P (constant)</text>

  <!-- Connecting lines from MK box to bottom cases -->
  <line x1="120" y1="220" x2="120" y2="250" stroke="#E67E22" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="200" y1="220" x2="340" y2="250" stroke="#E67E22" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Connecting line from MO box to bottom case -->
  <line x1="580" y1="220" x2="580" y2="250" stroke="#1A5276" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Bottom rule -->
  <rect x="120" y="338" width="480" height="18" rx="3" fill="#F0F0F0"/>
  <text x="360" y="352" text-anchor="middle" font-family="Arial" font-size="10" fill="#2D3748">Vuistregel: produceer extra zolang MO > MK &#8594; elke extra eenheid levert winst op</text>
</svg>