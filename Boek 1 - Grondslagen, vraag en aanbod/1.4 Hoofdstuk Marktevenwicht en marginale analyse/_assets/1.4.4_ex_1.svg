<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="400" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">Opgave 3: MK en MO</text>

  <!-- Plot area: x=80..680, y=50..330
       Q range: 0..28, euro range: 0..40
       px_per_Q = 600/28 = 21.43
       px_per_euro = 280/40 = 7.0
       q_to_x(q) = 80 + q * 21.43
       euro_to_y(v) = 330 - v * 7.0
  -->

  <!-- Grid -->
  <line x1="80" y1="260" x2="680" y2="260" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/>
  <line x1="80" y1="190" x2="680" y2="190" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/>
  <line x1="80" y1="120" x2="680" y2="120" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/>

  <!-- Y-axis -->
  <line x1="80" y1="330" x2="80" y2="42" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,42 76,52 84,52" fill="#2D3748"/>
  <text x="15" y="190" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096" transform="rotate(-90,15,190)">Euro per stuk (&#8364;)</text>

  <!-- X-axis -->
  <line x1="80" y1="330" x2="685" y2="330" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="685,330 675,326 675,334" fill="#2D3748"/>
  <text x="380" y="385" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096">Hoeveelheid (Q)</text>

  <!-- Origin -->
  <text x="72" y="345" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">0</text>

  <!-- Y-axis ticks -->
  <line x1="75" y1="260" x2="80" y2="260" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="264" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">10</text>
  <line x1="75" y1="190" x2="80" y2="190" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="194" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">20</text>
  <line x1="75" y1="120" x2="80" y2="120" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="124" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">30</text>
  <line x1="75" y1="50" x2="80" y2="50" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="54" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">40</text>

  <!-- X-axis ticks: 4, 8, 12, 16, 20, 24 -->
  <line x1="165.7" y1="330" x2="165.7" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="165.7" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">4</text>
  <line x1="251.4" y1="330" x2="251.4" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="251.4" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">8</text>
  <line x1="337.2" y1="330" x2="337.2" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="337.2" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">12</text>
  <line x1="422.9" y1="330" x2="422.9" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="422.9" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">16</text>
  <line x1="508.6" y1="330" x2="508.6" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="508.6" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">20</text>
  <line x1="594.3" y1="330" x2="594.3" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="594.3" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">24</text>

  <!-- This graph: a generic firm with MK rising, MO constant
       MO = 24 (horizontal) → y = 330 - 24*7 = 162
       MK = 2Q (rising) — intersects MO at Q=12
       At Q=12: x = 80 + 12*21.43 = 337.2, MK=24, y=162
  -->

  <!-- MO = 24: y=162 -->
  <line x1="80" y1="162" x2="650" y2="162" stroke="#1A5276" stroke-width="2.5"/>
  <text x="656" y="158" font-family="Arial" font-size="12" font-weight="bold" fill="#1A5276">MO = 24</text>

  <!-- MK = 2Q: from (0,0)=(80,330) through (12,24)=(337.2,162) to (20,40)=(508.6,50) -->
  <line x1="80" y1="330" x2="594.3" y2="50" stroke="#E67E22" stroke-width="2.5"/>
  <text x="604" y="46" font-family="Arial" font-size="12" font-weight="bold" fill="#E67E22">MK</text>

  <!-- Intersection at Q=12 -->
  <circle cx="337.2" cy="162" r="5" fill="#2D3748"/>
  <line x1="337.2" y1="162" x2="337.2" y2="330" stroke="#2D3748" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Q* label -->
  <text x="337.2" y="368" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2D3748">Q* = ?</text>

  <!-- Reference points for reading -->
  <!-- Q=8: x=251.4, MK=16, y=218 -->
  <circle cx="251.4" cy="218" r="3" fill="#E67E22"/>
  <line x1="251.4" y1="218" x2="251.4" y2="330" stroke="#718096" stroke-width="0.7" stroke-dasharray="3,3"/>
  <!-- Q=20: x=508.6, MK=40, y=50 -->
  <circle cx="508.6" cy="50" r="3" fill="#E67E22"/>
  <line x1="508.6" y1="50" x2="508.6" y2="330" stroke="#718096" stroke-width="0.7" stroke-dasharray="3,3"/>
</svg>