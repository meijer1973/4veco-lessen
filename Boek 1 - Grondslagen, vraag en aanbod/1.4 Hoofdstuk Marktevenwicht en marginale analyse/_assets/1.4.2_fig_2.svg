<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial">
  <rect width="720" height="360" fill="#F7FAFC" rx="8"/>
  <text x="360" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Figuur 2: Verschuiving van de aanbodlijn naar rechts</text>
  <!-- Y-axis -->
  <line x1="80" y1="45" x2="80" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,40 76,48 84,48" fill="#2D3748"/>
  <!-- X-axis -->
  <line x1="80" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="685,310 677,306 677,314" fill="#2D3748"/>
  <!-- Y-axis label -->
  <text x="15" y="180" text-anchor="middle" font-size="12" fill="#718096" transform="rotate(-90, 15, 180)">Prijs (P)</text>
  <!-- Origin -->
  <text x="72" y="325" text-anchor="end" font-size="11" fill="#718096">0</text>

  <!-- V: Qv = -2P + 100 (solid blue) -->
  <line x1="80" y1="89.2" x2="541.5" y2="310" stroke="#1A5276" stroke-width="2"/>
  <text x="549" y="305" font-size="12" font-weight="bold" fill="#1A5276">V</text>

  <!-- A old: Qa = 3P - 25 (dashed orange) -->
  <line x1="80" y1="273.2" x2="656.9" y2="89.2" stroke="#E67E22" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="660" y="82" font-size="11" fill="#E67E22">A</text>

  <!-- A new: Qa' = 3P - 10 (solid green) -->
  <!-- Q=0 → P=3.33: x=80, y=310-3.33*4.4167=295.3 -->
  <!-- P=45 → Q=125: x=656.9, y=111.3 -->
  <line x1="80" y1="295.3" x2="656.9" y2="111.3" stroke="#27AE60" stroke-width="2"/>
  <text x="660" y="104" font-size="12" font-weight="bold" fill="#27AE60">A'</text>

  <!-- Old equilibrium E: P=25, Q=50 → (310.8, 199.6) -->
  <line x1="310.8" y1="199.6" x2="80" y2="199.6" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="310.8" y1="199.6" x2="310.8" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="310.8" cy="199.6" r="3.5" fill="#CBD5E0"/>
  <text x="310.8" y="187.6" text-anchor="middle" font-size="10" fill="#718096">E</text>

  <!-- New equilibrium E': P=22, Q=56 → (338.5, 212.8) -->
  <line x1="338.5" y1="212.8" x2="80" y2="212.8" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="338.5" y1="212.8" x2="338.5" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="338.5" cy="212.8" r="4" fill="#2D3748"/>
  <text x="338.5" y="200.8" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">E'</text>

  <!-- Axis labels -->
  <text x="72" y="203.6" text-anchor="end" font-size="9" fill="#718096">P* = 25</text>
  <text x="72" y="216.8" text-anchor="end" font-size="9" fill="#2D3748">P*' = 22</text>
  <text x="310.8" y="340" text-anchor="middle" font-size="9" fill="#718096">50</text>
  <text x="338.5" y="325" text-anchor="middle" font-size="9" fill="#2D3748">56</text>

  <!-- Shift arrow: horizontal, in quiet zone at ~1/3 from A endpoint -->
  <!-- Place at P≈40 level on the supply curves -->
  <!-- A old at P=40: Q=3*40-25=95 → x=80+95*4.6154=518.5, y=310-40*4.4167=133.3 -->
  <!-- A new at P=40: Q=3*40-10=110 → x=80+110*4.6154=587.7 -->
  <line x1="518.5" y1="133.3" x2="575" y2="133.3" stroke="#27AE60" stroke-width="2"/>
  <polygon points="580,133.3 572,129.3 572,137.3" fill="#27AE60"/>
</svg>