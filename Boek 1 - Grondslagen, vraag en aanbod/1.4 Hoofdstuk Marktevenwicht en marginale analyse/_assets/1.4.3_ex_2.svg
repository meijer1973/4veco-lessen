<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="400" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">Opgave 4: MK en MO van de meubelfabriek</text>

  <!-- Plot area: x=80..680, y=50..330
       Q range: 0..55, euro range: 0..50
       px_per_Q = 600/55 = 10.909
       px_per_euro = 280/50 = 5.6
       q_to_x(q) = 80 + q * 10.909
       euro_to_y(v) = 330 - v * 5.6
  -->

  <!-- Grid lines -->
  <line x1="80" y1="274" x2="680" y2="274" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 10 -->
  <line x1="80" y1="218" x2="680" y2="218" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 20 -->
  <line x1="80" y1="162" x2="680" y2="162" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 30 -->
  <line x1="80" y1="106" x2="680" y2="106" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 40 -->
  <line x1="80" y1="50" x2="680" y2="50" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 50 -->

  <!-- Y-axis -->
  <line x1="80" y1="330" x2="80" y2="42" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,42 76,52 84,52" fill="#2D3748"/>
  <text x="15" y="190" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096" transform="rotate(-90,15,190)">Euro per stuk (&#8364;)</text>

  <!-- X-axis -->
  <line x1="80" y1="330" x2="685" y2="330" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="685,330 675,326 675,334" fill="#2D3748"/>
  <text x="380" y="385" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096">Hoeveelheid (Q)</text>

  <!-- Origin -->
  <text x="72" y="345" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">0</text>

  <!-- Y-axis ticks -->
  <line x1="75" y1="274" x2="80" y2="274" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="278" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">10</text>
  <line x1="75" y1="218" x2="80" y2="218" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="222" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">20</text>
  <line x1="75" y1="162" x2="80" y2="162" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="166" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">30</text>
  <line x1="75" y1="106" x2="80" y2="106" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="110" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">40</text>
  <line x1="75" y1="50" x2="80" y2="50" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="54" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">50</text>

  <!-- X-axis ticks -->
  <line x1="189.1" y1="330" x2="189.1" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="189.1" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">10</text>
  <line x1="298.2" y1="330" x2="298.2" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="298.2" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">20</text>
  <line x1="407.3" y1="330" x2="407.3" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="407.3" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">30</text>
  <line x1="516.4" y1="330" x2="516.4" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="516.4" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">40</text>
  <line x1="625.5" y1="330" x2="625.5" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="625.5" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">50</text>

  <!-- MK rising line: TK = 500 + 2Q^2, MK per 10 units:
       Q 0-10: MK = (500+200 - 500)/10 = 20
       Q 10-20: MK = (500+800 - 700)/10 = 60  too steep, let's use TK = 500 + 0.5Q^2
       Actually this is for exercise 4 with TK = 500 + 0.5Q^2, P = 25
       MK(0-10) = (500+50 - 500)/10 = 5
       MK(10-20) = (500+200 - 550)/10 = 15
       MK(20-30) = (500+450 - 700)/10 = 25
       MK(30-40) = (500+800 - 950)/10 = 35
       MK(40-50) = (500+1250 - 1300)/10 = 45
  -->

  <!-- MO = 25 constant: y = 330 - 25*5.6 = 190 -->
  <line x1="80" y1="190" x2="650" y2="190" stroke="#1A5276" stroke-width="2.5"/>
  <text x="656" y="186" font-family="Arial" font-size="12" font-weight="bold" fill="#1A5276">MO = 25</text>

  <!-- MK step bars -->
  <rect x="80" y="302" width="109.1" height="28" fill="#E67E22" fill-opacity="0.3" stroke="#E67E22" stroke-width="1.5"/>
  <text x="134.5" y="320" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#E67E22">MK=5</text>

  <rect x="189.1" y="246" width="109.1" height="84" fill="#E67E22" fill-opacity="0.3" stroke="#E67E22" stroke-width="1.5"/>
  <text x="243.6" y="292" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#E67E22">MK=15</text>

  <rect x="298.2" y="190" width="109.1" height="140" fill="#E67E22" fill-opacity="0.3" stroke="#E67E22" stroke-width="1.5"/>
  <text x="352.7" y="264" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#E67E22">MK=25</text>

  <rect x="407.3" y="134" width="109.1" height="196" fill="#E67E22" fill-opacity="0.3" stroke="#E67E22" stroke-width="1.5"/>
  <text x="461.8" y="236" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#E67E22">MK=35</text>

  <rect x="516.4" y="78" width="109.1" height="252" fill="#E67E22" fill-opacity="0.3" stroke="#E67E22" stroke-width="1.5"/>
  <text x="570.9" y="208" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#E67E22">MK=45</text>

  <!-- Rising MK dashed line through midpoints -->
  <circle cx="134.5" cy="302" r="3" fill="#E67E22"/>
  <circle cx="243.6" cy="246" r="3" fill="#E67E22"/>
  <circle cx="352.7" cy="190" r="3" fill="#E67E22"/>
  <circle cx="461.8" cy="134" r="3" fill="#E67E22"/>
  <circle cx="570.9" cy="78" r="3" fill="#E67E22"/>
  <line x1="134.5" y1="302" x2="570.9" y2="78" stroke="#E67E22" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="580" y="72" font-family="Arial" font-size="12" font-weight="bold" fill="#E67E22">MK</text>

  <!-- Intersection at MK=MO=25 around Q=20-30 -->
  <circle cx="352.7" cy="190" r="5" fill="none" stroke="#2D3748" stroke-width="1.5"/>
  <text x="365" y="182" font-family="Arial" font-size="10" fill="#2D3748">MK = MO</text>
</svg>