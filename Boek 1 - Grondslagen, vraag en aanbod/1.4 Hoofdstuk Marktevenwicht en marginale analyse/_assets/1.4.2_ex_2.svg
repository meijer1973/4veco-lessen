<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial">
  <rect width="720" height="360" fill="#F7FAFC" rx="8"/>
  <text x="360" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2761">Opgave 5e: Beide verschuivingen tegelijk</text>
  <!-- Q range: 0..130, px_per_Q = 4.6154 -->
  <!-- P range: 0..60, px_per_P = 4.4167 -->

  <!-- Y-axis -->
  <line x1="80" y1="45" x2="80" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,40 76,48 84,48" fill="#2D3748"/>
  <!-- X-axis -->
  <line x1="80" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="685,310 677,306 677,314" fill="#2D3748"/>
  <text x="15" y="180" text-anchor="middle" font-size="12" fill="#718096" transform="rotate(-90, 15, 180)">Prijs (P)</text>
  <text x="72" y="325" text-anchor="end" font-size="11" fill="#718096">0</text>

  <!-- V old (dashed orange): Qv=-2P+100 -->
  <line x1="80" y1="89.2" x2="541.5" y2="310" stroke="#E67E22" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="549" y="305" font-size="9" fill="#E67E22">V</text>

  <!-- V new (solid blue): Qv'=-2P+120 -->
  <line x1="80" y1="45.0" x2="633.8" y2="310" stroke="#1A5276" stroke-width="2"/>
  <text x="641" y="305" font-size="11" font-weight="bold" fill="#1A5276">V'</text>

  <!-- A old (dashed orange): Qa=3P-25 -->
  <line x1="80" y1="273.2" x2="656.9" y2="89.2" stroke="#E67E22" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="660" y="82" font-size="9" fill="#E67E22">A</text>

  <!-- A new (solid green): Qa'=3P-10 -->
  <line x1="80" y1="295.3" x2="656.9" y2="111.3" stroke="#27AE60" stroke-width="2"/>
  <text x="660" y="104" font-size="11" font-weight="bold" fill="#27AE60">A'</text>

  <!-- Old E: P=25, Q=50 → (310.8, 199.6) -->
  <circle cx="310.8" cy="199.6" r="3" fill="#CBD5E0"/>
  <line x1="310.8" y1="199.6" x2="80" y2="199.6" stroke="#CBD5E0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="310.8" y1="199.6" x2="310.8" y2="310" stroke="#CBD5E0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="310.8" y="187.6" text-anchor="middle" font-size="10" fill="#718096">E</text>

  <!-- New E3: P=26, Q=68 → (393.8, 195.2) -->
  <circle cx="393.8" cy="195.2" r="4" fill="#2D3748"/>
  <line x1="393.8" y1="195.2" x2="80" y2="195.2" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="393.8" y1="195.2" x2="393.8" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="393.8" y="183.2" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">E'</text>

  <!-- Axis labels -->
  <text x="72" y="203.6" text-anchor="end" font-size="9" fill="#718096">25</text>
  <text x="72" y="192.0" text-anchor="end" font-size="9" fill="#2D3748">26</text>
  <text x="310.8" y="340" text-anchor="middle" font-size="9" fill="#718096">50</text>
  <text x="393.8" y="325" text-anchor="middle" font-size="9" fill="#2D3748">68</text>

  <!-- Shift arrows -->
  <line x1="490" y1="120" x2="530" y2="120" stroke="#27AE60" stroke-width="1.5"/>
  <polygon points="534,120 528,117 528,123" fill="#27AE60"/>
  <line x1="400" y1="255" x2="440" y2="255" stroke="#1A5276" stroke-width="1.5"/>
  <polygon points="444,255 438,252 438,258" fill="#1A5276"/>

  <!-- Annotation: ambiguous price -->
  <rect x="440" y="190" width="180" height="35" fill="#FEF3E2" stroke="#E67E22" stroke-width="1" rx="4"/>
  <text x="530" y="205" text-anchor="middle" font-size="9" font-weight="bold" fill="#E67E22">P* bijna gelijk (25 → 26)</text>
  <text x="530" y="218" text-anchor="middle" font-size="8.5" fill="#2D3748">→ prijseffect onzeker</text>
</svg>