<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="360" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">Markt voor brood &#x2014; twee situaties</text>

  <!-- ====== SITUATIE 1 (left panel): Beweging langs de aanbodlijn ====== -->
  <!-- Panel area: x=40..340 -->
  <text x="190" y="48" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2D3748">Situatie 1</text>

  <!-- Y-axis (left panel) -->
  <line x1="60" y1="310" x2="60" y2="60" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="60,60 56,70 64,70" fill="#2D3748"/>
  <text x="25" y="185" text-anchor="middle" font-family="Arial" font-size="10" fill="#718096" transform="rotate(-90, 25, 185)">Prijs (P)</text>

  <!-- X-axis (left panel) -->
  <line x1="60" y1="310" x2="335" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="335,310 325,306 325,314" fill="#2D3748"/>
  <text x="197" y="345" text-anchor="middle" font-family="Arial" font-size="10" fill="#718096">Hoeveelheid (Q)</text>

  <!-- Origin -->
  <text x="52" y="325" text-anchor="end" font-family="Arial" font-size="10" fill="#2D3748">0</text>

  <!-- Supply curve A (left panel): from (60,290) to (320,80) -->
  <line x1="60" y1="290" x2="320" y2="80" stroke="#1E8449" stroke-width="2"/>
  <text x="325" y="78" font-family="Arial" font-size="11" font-weight="bold" fill="#1E8449">A</text>

  <!-- Point E at lower position: roughly (140, 223) -->
  <circle cx="140" cy="225" r="4" fill="#1E8449"/>
  <text x="127" y="240" text-anchor="end" font-family="Arial" font-size="11" font-weight="bold" fill="#1E8449">E</text>

  <!-- Point E' at higher position: roughly (230, 152) -->
  <circle cx="230" cy="152" r="4" fill="#1E8449"/>
  <text x="243" y="145" font-family="Arial" font-size="11" font-weight="bold" fill="#1E8449">E'</text>

  <!-- Arrow along the curve from E to E' -->
  <defs>
    <marker id="arrowOrange1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#E67E22"/>
    </marker>
  </defs>
  <line x1="152" y1="215" x2="218" y2="162" stroke="#E67E22" stroke-width="2" marker-end="url(#arrowOrange1)"/>

  <!-- Dashed ref lines for E -->
  <line x1="60" y1="225" x2="140" y2="225" stroke="#CBD5E0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="140" y1="225" x2="140" y2="310" stroke="#CBD5E0" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Dashed ref lines for E' -->
  <line x1="60" y1="152" x2="230" y2="152" stroke="#CBD5E0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="230" y1="152" x2="230" y2="310" stroke="#CBD5E0" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Divider line between panels -->
  <line x1="370" y1="45" x2="370" y2="340" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ====== SITUATIE 2 (right panel): Verschuiving van de aanbodlijn ====== -->
  <!-- Panel area: x=390..680 -->
  <text x="535" y="48" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2D3748">Situatie 2</text>

  <!-- Y-axis (right panel) -->
  <line x1="405" y1="310" x2="405" y2="60" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="405,60 401,70 409,70" fill="#2D3748"/>
  <text x="385" y="185" text-anchor="middle" font-family="Arial" font-size="10" fill="#718096" transform="rotate(-90, 385, 185)">Prijs (P)</text>

  <!-- X-axis (right panel) -->
  <line x1="405" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="680,310 670,306 670,314" fill="#2D3748"/>
  <text x="542" y="345" text-anchor="middle" font-family="Arial" font-size="10" fill="#718096">Hoeveelheid (Q)</text>

  <!-- Origin -->
  <text x="397" y="325" text-anchor="end" font-family="Arial" font-size="10" fill="#2D3748">0</text>

  <!-- Original supply A₁ (dashed): from (405,280) to (650,80) -->
  <line x1="405" y1="280" x2="650" y2="80" stroke="#1E8449" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="655" y="78" font-family="Arial" font-size="11" font-weight="bold" fill="#1E8449">A<tspan font-size="8" dy="3">1</tspan></text>

  <!-- New supply A₂ (solid, shifted right): from (470,280) to (670,120) -->
  <line x1="470" y1="280" x2="670" y2="120" stroke="#27AE60" stroke-width="2.5"/>
  <text x="675" y="118" font-family="Arial" font-size="11" font-weight="bold" fill="#27AE60">A<tspan font-size="8" dy="3">2</tspan></text>

  <!-- Horizontal shift arrow pointing RIGHT -->
  <defs>
    <marker id="arrowRight2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#27AE60"/>
    </marker>
  </defs>
  <line x1="510" y1="195" x2="570" y2="195" stroke="#27AE60" stroke-width="2" marker-end="url(#arrowRight2)"/>
</svg>