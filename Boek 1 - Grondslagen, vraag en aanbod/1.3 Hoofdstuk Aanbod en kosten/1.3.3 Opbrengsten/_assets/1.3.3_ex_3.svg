<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="450" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">Doeloefening: TK en TO van de bakker</text>

  <!-- Coordinate system: Q 0-1200, Euro 0-1800 -->
  <!-- px_per_Q = 480/1200 = 0.4, px_per_euro = 340/1800 = 0.18889 -->

  <!-- Grid lines -->
  <g stroke="#E5E5E5" stroke-width="0.5" stroke-dasharray="4,3">
    <line x1="80" y1="352.2" x2="560" y2="352.2"/>
    <line x1="80" y1="314.4" x2="560" y2="314.4"/>
    <line x1="80" y1="276.7" x2="560" y2="276.7"/>
    <line x1="80" y1="238.9" x2="560" y2="238.9"/>
    <line x1="80" y1="201.1" x2="560" y2="201.1"/>
    <line x1="80" y1="163.3" x2="560" y2="163.3"/>
    <line x1="80" y1="125.6" x2="560" y2="125.6"/>
    <line x1="80" y1="87.8" x2="560" y2="87.8"/>
    <line x1="80" y1="50.0" x2="560" y2="50.0"/>
    <line x1="160" y1="50" x2="160" y2="390"/>
    <line x1="240" y1="50" x2="240" y2="390"/>
    <line x1="320" y1="50" x2="320" y2="390"/>
    <line x1="400" y1="50" x2="400" y2="390"/>
    <line x1="480" y1="50" x2="480" y2="390"/>
    <line x1="560" y1="50" x2="560" y2="390"/>
  </g>

  <!-- Winst shading from BEP to Q=1000 (green area between TO above and TK below) -->
  <!-- BEP: (365.7, 187.6), TO at Q=1000: (480, 106.7), TK at Q=1000: (480, 144.4) -->
  <!-- TK at BEP: same as TO = 187.6 -->
  <polygon points="365.7,187.6 480,106.7 480,144.4" fill="#27AE60" fill-opacity="0.25"/>

  <!-- Verlies shading from Q=0 to BEP (red area between TK above and TO below) -->
  <polygon points="80,390 365.7,187.6 80,295.6" fill="#E74C3C" fill-opacity="0.15"/>

  <!-- Y-axis -->
  <line x1="80" y1="390" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>
  <text x="18" y="220" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096" transform="rotate(-90,18,220)">Euro (&#8364;)</text>

  <!-- X-axis -->
  <line x1="80" y1="390" x2="565" y2="390" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="565,390 555,386 555,394" fill="#2D3748"/>
  <text x="320" y="435" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096">Hoeveelheid (Q)</text>

  <!-- Origin -->
  <text x="72" y="404" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">0</text>

  <!-- Y-axis ticks -->
  <line x1="75" y1="352.2" x2="80" y2="352.2" stroke="#2D3748"/>
  <text x="72" y="356" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">200</text>
  <line x1="75" y1="314.4" x2="80" y2="314.4" stroke="#2D3748"/>
  <text x="72" y="318" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">400</text>
  <line x1="75" y1="276.7" x2="80" y2="276.7" stroke="#2D3748"/>
  <text x="72" y="280" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">600</text>
  <line x1="75" y1="238.9" x2="80" y2="238.9" stroke="#2D3748"/>
  <text x="72" y="242" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">800</text>
  <line x1="75" y1="201.1" x2="80" y2="201.1" stroke="#2D3748"/>
  <text x="72" y="205" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">1.000</text>
  <line x1="75" y1="163.3" x2="80" y2="163.3" stroke="#2D3748"/>
  <text x="72" y="167" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">1.200</text>
  <line x1="75" y1="125.6" x2="80" y2="125.6" stroke="#2D3748"/>
  <text x="72" y="129" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">1.400</text>
  <line x1="75" y1="87.8" x2="80" y2="87.8" stroke="#2D3748"/>
  <text x="72" y="91" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">1.600</text>
  <line x1="75" y1="50.0" x2="80" y2="50.0" stroke="#2D3748"/>
  <text x="72" y="54" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">1.800</text>

  <!-- X-axis ticks -->
  <line x1="160" y1="390" x2="160" y2="395" stroke="#2D3748"/>
  <text x="160" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">200</text>
  <line x1="240" y1="390" x2="240" y2="395" stroke="#2D3748"/>
  <text x="240" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">400</text>
  <line x1="320" y1="390" x2="320" y2="395" stroke="#2D3748"/>
  <text x="320" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">600</text>
  <line x1="400" y1="390" x2="400" y2="395" stroke="#2D3748"/>
  <text x="400" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">800</text>
  <line x1="480" y1="390" x2="480" y2="395" stroke="#2D3748"/>
  <text x="480" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">1.000</text>
  <line x1="560" y1="390" x2="560" y2="395" stroke="#2D3748"/>
  <text x="560" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">1.200</text>

  <!-- TO line: (80,390) to (560,50) -->
  <line x1="80" y1="390" x2="560" y2="50" stroke="#1A5276" stroke-width="2.5"/>
  <text x="565" y="55" font-family="Arial" font-size="13" font-weight="bold" fill="#1A5276">TO</text>

  <!-- TK line: (80,295.6) to (560,114.2) -->
  <line x1="80" y1="295.6" x2="560" y2="114.2" stroke="#E67E22" stroke-width="2.5"/>
  <text x="565" y="119" font-family="Arial" font-size="13" font-weight="bold" fill="#E67E22">TK</text>

  <!-- BEP point: Q=714.29, €=1071.43 => (365.7, 187.6) -->
  <circle cx="365.7" cy="187.6" r="5" fill="#2D3748"/>
  <line x1="365.7" y1="187.6" x2="365.7" y2="390" stroke="#2D3748" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="80" y1="187.6" x2="365.7" y2="187.6" stroke="#2D3748" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="365.7" y="173" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2D3748">BEP</text>
  <text x="365.7" y="408" text-anchor="middle" font-family="Arial" font-size="10" fill="#2D3748">714</text>
  <text x="72" y="191" text-anchor="end" font-family="Arial" font-size="10" fill="#2D3748">1.071</text>

  <!-- Vertical dashed line at Q=1000 -->
  <line x1="480" y1="106.7" x2="480" y2="390" stroke="#2D3748" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- Points at Q=1000 -->
  <circle cx="480" cy="106.7" r="3.5" fill="#1A5276"/>
  <circle cx="480" cy="144.4" r="3.5" fill="#E67E22"/>

  <!-- Winst bracket at Q=1000 -->
  <line x1="485" y1="106.7" x2="495" y2="106.7" stroke="#27AE60" stroke-width="1.5"/>
  <line x1="490" y1="106.7" x2="490" y2="144.4" stroke="#27AE60" stroke-width="1.5"/>
  <line x1="485" y1="144.4" x2="495" y2="144.4" stroke="#27AE60" stroke-width="1.5"/>
  <text x="502" y="129" font-family="Arial" font-size="10" font-weight="bold" fill="#27AE60">&#8364;200</text>

  <!-- Labels in zones -->
  <!-- Verlies centroid: (80,390),(365.7,187.6),(80,295.6) → ~(175,291) -->
  <text x="175" y="295" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#E74C3C">verlies</text>
  <!-- Winst centroid: (365.7,187.6),(480,106.7),(480,144.4) → ~(442,146) -->
  <text x="442" y="150" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60">winst</text>

  <!-- Value annotations at Q=1000 -->
  <text x="480" y="98" text-anchor="middle" font-family="Arial" font-size="10" fill="#1A5276">&#8364;1.500</text>
  <text x="480" y="160" text-anchor="middle" font-family="Arial" font-size="10" fill="#E67E22">&#8364;1.300</text>
</svg>