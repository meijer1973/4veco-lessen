<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="450" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">TK en TO van een kledingwinkel</text>

  <!-- Coordinate system: Q 0-400, Euro 0-2000 -->
  <!-- px_per_Q = 480/400 = 1.2, px_per_euro = 340/2000 = 0.17 -->
  <!-- Q->x: x = 80 + Q*1.2, Euro->y: y = 390 - Euro*0.17 -->

  <!-- Grid lines -->
  <g stroke="#E5E5E5" stroke-width="0.5" stroke-dasharray="4,3">
    <!-- Horizontal: €200 step => 0.17*200=34px apart -->
    <line x1="80" y1="356" x2="560" y2="356"/><!-- 200 -->
    <line x1="80" y1="322" x2="560" y2="322"/><!-- 400 -->
    <line x1="80" y1="288" x2="560" y2="288"/><!-- 600 -->
    <line x1="80" y1="254" x2="560" y2="254"/><!-- 800 -->
    <line x1="80" y1="220" x2="560" y2="220"/><!-- 1000 -->
    <line x1="80" y1="186" x2="560" y2="186"/><!-- 1200 -->
    <line x1="80" y1="152" x2="560" y2="152"/><!-- 1400 -->
    <line x1="80" y1="118" x2="560" y2="118"/><!-- 1600 -->
    <line x1="80" y1="84" x2="560" y2="84"/><!-- 1800 -->
    <line x1="80" y1="50" x2="560" y2="50"/><!-- 2000 -->
    <!-- Vertical: Q=50 step => 1.2*50=60px -->
    <line x1="140" y1="50" x2="140" y2="390"/><!-- 50 -->
    <line x1="200" y1="50" x2="200" y2="390"/><!-- 100 -->
    <line x1="260" y1="50" x2="260" y2="390"/><!-- 150 -->
    <line x1="320" y1="50" x2="320" y2="390"/><!-- 200 -->
    <line x1="380" y1="50" x2="380" y2="390"/><!-- 250 -->
    <line x1="440" y1="50" x2="440" y2="390"/><!-- 300 -->
    <line x1="500" y1="50" x2="500" y2="390"/><!-- 350 -->
    <line x1="560" y1="50" x2="560" y2="390"/><!-- 400 -->
  </g>

  <!-- Y-axis -->
  <line x1="80" y1="390" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>
  <text x="18" y="220" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096" transform="rotate(-90,18,220)">Euro (&#8364;)</text>

  <!-- X-axis -->
  <line x1="80" y1="390" x2="565" y2="390" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="565,390 555,386 555,394" fill="#2D3748"/>
  <text x="320" y="435" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096">Hoeveelheid (Q)</text>

  <!-- Origin -->
  <text x="72" y="404" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">0</text>

  <!-- Y-axis ticks: every 200 -->
  <line x1="75" y1="356" x2="80" y2="356" stroke="#2D3748"/>
  <text x="72" y="360" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">200</text>
  <line x1="75" y1="322" x2="80" y2="322" stroke="#2D3748"/>
  <text x="72" y="326" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">400</text>
  <line x1="75" y1="288" x2="80" y2="288" stroke="#2D3748"/>
  <text x="72" y="292" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">600</text>
  <line x1="75" y1="254" x2="80" y2="254" stroke="#2D3748"/>
  <text x="72" y="258" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">800</text>
  <line x1="75" y1="220" x2="80" y2="220" stroke="#2D3748"/>
  <text x="72" y="224" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">1.000</text>
  <line x1="75" y1="186" x2="80" y2="186" stroke="#2D3748"/>
  <text x="72" y="190" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">1.200</text>
  <line x1="75" y1="152" x2="80" y2="152" stroke="#2D3748"/>
  <text x="72" y="156" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">1.400</text>
  <line x1="75" y1="118" x2="80" y2="118" stroke="#2D3748"/>
  <text x="72" y="122" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">1.600</text>
  <line x1="75" y1="84" x2="80" y2="84" stroke="#2D3748"/>
  <text x="72" y="88" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">1.800</text>
  <line x1="75" y1="50" x2="80" y2="50" stroke="#2D3748"/>
  <text x="72" y="54" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">2.000</text>

  <!-- X-axis ticks: every 50 -->
  <line x1="140" y1="390" x2="140" y2="395" stroke="#2D3748"/>
  <text x="140" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">50</text>
  <line x1="200" y1="390" x2="200" y2="395" stroke="#2D3748"/>
  <text x="200" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">100</text>
  <line x1="260" y1="390" x2="260" y2="395" stroke="#2D3748"/>
  <text x="260" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">150</text>
  <line x1="320" y1="390" x2="320" y2="395" stroke="#2D3748"/>
  <text x="320" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">200</text>
  <line x1="380" y1="390" x2="380" y2="395" stroke="#2D3748"/>
  <text x="380" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">250</text>
  <line x1="440" y1="390" x2="440" y2="395" stroke="#2D3748"/>
  <text x="440" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">300</text>
  <line x1="500" y1="390" x2="500" y2="395" stroke="#2D3748"/>
  <text x="500" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">350</text>
  <line x1="560" y1="390" x2="560" y2="395" stroke="#2D3748"/>
  <text x="560" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">400</text>

  <!-- TO line: P=5, TO=5Q. (0,0) to (400,2000) => (80,390) to (560,50) -->
  <line x1="80" y1="390" x2="560" y2="50" stroke="#1A5276" stroke-width="2.5"/>
  <text x="565" y="55" font-family="Arial" font-size="13" font-weight="bold" fill="#1A5276">TO</text>

  <!-- TK line: TK=200+3Q. (0,200) to (400,1400) => (80,356) to (560,152) -->
  <line x1="80" y1="356" x2="560" y2="152" stroke="#E67E22" stroke-width="2.5"/>
  <text x="565" y="157" font-family="Arial" font-size="13" font-weight="bold" fill="#E67E22">TK</text>

  <!-- BEP: Q=100, €=500 => (200, 305) -->
  <!-- Verify: x=80+100*1.2=200, y=390-500*0.17=390-85=305 -->
  <circle cx="200" cy="305" r="5" fill="#2D3748"/>
  <line x1="200" y1="305" x2="200" y2="390" stroke="#2D3748" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="80" y1="305" x2="200" y2="305" stroke="#2D3748" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="200" y="291" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2D3748">BEP</text>
</svg>