<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="360" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">Overzicht: verschuivingen van de aanbodlijn</text>

  <!-- Y-axis -->
  <line x1="80" y1="310" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>
  <text x="15" y="180" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096" transform="rotate(-90, 15, 180)">Prijs (P)</text>

  <!-- X-axis -->
  <line x1="80" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="680,310 670,306 670,314" fill="#2D3748"/>
  <text x="380" y="350" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096">Hoeveelheid (Q)</text>

  <!-- Origin -->
  <text x="72" y="325" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">0</text>

  <!-- A₂ (left, dashed — kosten stijging): Q=2P-200, from (80,257) to (560,45) -->
  <line x1="80" y1="257" x2="560" y2="45" stroke="#E67E22" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="565" y="40" font-family="Arial" font-size="12" font-weight="bold" fill="#E67E22">A<tspan font-size="9" dy="3">2</tspan></text>

  <!-- A₁ (center, solid — origineel): Q=2P, from (80,310) to (680,45) -->
  <line x1="80" y1="310" x2="680" y2="45" stroke="#1E8449" stroke-width="2.5"/>
  <text x="685" y="50" font-family="Arial" font-size="12" font-weight="bold" fill="#1E8449">A<tspan font-size="9" dy="3">1</tspan></text>

  <!-- A₃ (right, dashed — subsidie): Q=2P+200, from (200,310) to (680,98) -->
  <line x1="200" y1="310" x2="680" y2="98" stroke="#27AE60" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="685" y="103" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60">A<tspan font-size="9" dy="3">3</tspan></text>

  <!-- Left shift arrow (aanbodafname) at ~P=300 level -->
  <line x1="390" y1="155" x2="318" y2="155" stroke="#E67E22" stroke-width="2"/>
  <polygon points="310,155 322,149 322,161" fill="#E67E22"/>
  <text x="350" y="145" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#E67E22">aanbodafname</text>

  <!-- Right shift arrow (aanbodtoename) at ~P=200 level -->
  <line x1="380" y1="215" x2="452" y2="215" stroke="#27AE60" stroke-width="2"/>
  <polygon points="460,215 448,209 448,221" fill="#27AE60"/>
  <text x="420" y="240" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#27AE60">aanbodtoename</text>
</svg>