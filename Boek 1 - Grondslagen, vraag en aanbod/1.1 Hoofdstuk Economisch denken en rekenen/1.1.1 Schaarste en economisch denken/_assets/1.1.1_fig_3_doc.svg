<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg">
    
    <rect width="1000" height="640" rx="28" fill="#fbf8ef"/>
    <rect x="32" y="32" width="936" height="576" rx="24" fill="#ffffff" stroke="#d9d0be" stroke-width="1.5"/>
    <text x="64" y="114" text-anchor="start" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="700" letter-spacing="0" font-style="italic" fill="#1b1a17">Economisch denken in vier stappen (B02)</text>
    <text x="64" y="146" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0" font-style="" fill="#4a463d">Alternatieven benoemen, opbrengsten, rangschikken, nettowaarde beoordelen.</text>
  
    
      <rect x="74" y="162" width="195" height="162" rx="20" fill="#dff6f8" stroke="#17A2B8" stroke-width="2"/>
      <circle cx="104" cy="196" r="20" fill="#17A2B8"/>
      <text x="104" y="203" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="0" font-style="" fill="#ffffff">1</text>
      <text x="185.5" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="0" font-style="" fill="#17A2B8">Alternatieven</text>
      <text x="171.5" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">Welke opties</text><text x="171.5" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">heb je?</text>
      <text x="171.5" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0" font-style="italic" fill="#82796d">Tarwe of maïs</text>
    
      <rect x="293" y="162" width="195" height="162" rx="20" fill="#e5f4ea" stroke="#2f7d4a" stroke-width="2"/>
      <circle cx="323" cy="196" r="20" fill="#2f7d4a"/>
      <text x="323" y="203" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="0" font-style="" fill="#ffffff">2</text>
      <text x="404.5" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="0" font-style="" fill="#2f7d4a">Opbrengsten</text>
      <text x="390.5" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">Wat levert</text><text x="390.5" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">elk op?</text>
      <text x="390.5" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0" font-style="italic" fill="#82796d">€5.000 vs €3.500</text>
    
      <rect x="512" y="162" width="195" height="162" rx="20" fill="#f5ead8" stroke="#d08732" stroke-width="2"/>
      <circle cx="542" cy="196" r="20" fill="#d08732"/>
      <text x="542" y="203" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="0" font-style="" fill="#ffffff">3</text>
      <text x="623.5" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="0" font-style="" fill="#d08732">Rangschik</text>
      <text x="609.5" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">Beste niet-</text><text x="609.5" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">gekozen = alt. kosten</text>
      <text x="609.5" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0" font-style="italic" fill="#82796d">alt. kosten €3.500</text>
    
      <rect x="731" y="162" width="195" height="162" rx="20" fill="#e5f4ea" stroke="#2f7d4a" stroke-width="2"/>
      <circle cx="761" cy="196" r="20" fill="#2f7d4a"/>
      <text x="761" y="203" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="0" font-style="" fill="#ffffff">4</text>
      <text x="842.5" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="0" font-style="" fill="#2f7d4a">Nettowaarde</text>
      <text x="828.5" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">Opbrengst -</text><text x="828.5" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">alt. kosten</text>
      <text x="828.5" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0" font-style="italic" fill="#82796d">€5.000 - €3.500 = €1.500</text>
    
    <line x1="275" y1="243" x2="287" y2="243" stroke="#82796d" stroke-width="3"/><polygon points="287,243 275,235 275,251" fill="#82796d"/><line x1="494" y1="243" x2="506" y2="243" stroke="#82796d" stroke-width="3"/><polygon points="506,243 494,235 494,251" fill="#82796d"/><line x1="713" y1="243" x2="725" y2="243" stroke="#82796d" stroke-width="3"/><polygon points="725,243 713,235 713,251" fill="#82796d"/>
    <rect x="90" y="382" width="820" height="94" rx="18" fill="#efe8d7" stroke="#d9d0be" stroke-width="1.3"/>
    <text x="500" y="417" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="900" letter-spacing="0" font-style="" fill="#1b1a17">Voorbeeld boer met 10 hectare</text>
    <text x="500" y="450" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" letter-spacing="0" font-style="" fill="#4a463d">Tarwe kiezen → opbrengst €5.000; alt. kosten €3.500 (maïs); nettowaarde €1.500.</text>
  </svg>