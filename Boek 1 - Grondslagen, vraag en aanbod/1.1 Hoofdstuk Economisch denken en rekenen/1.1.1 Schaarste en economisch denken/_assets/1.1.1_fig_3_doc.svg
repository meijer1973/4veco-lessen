      <text x="199" y="250" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">Welke opties</text><text x="199" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">heb je?</text>
