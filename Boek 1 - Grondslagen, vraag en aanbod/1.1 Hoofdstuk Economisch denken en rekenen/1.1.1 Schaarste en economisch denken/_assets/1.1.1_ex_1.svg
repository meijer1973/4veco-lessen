<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="400" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2D3748">Winst per hectare van drie gewassen</text>

  <!-- Y-axis -->
  <line x1="100" y1="340" x2="100" y2="50" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="100,50 96,60 104,60" fill="#2D3748"/>
  <text x="28" y="200" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748" transform="rotate(-90,28,200)">Winst per ha (€)</text>

  <!-- X-axis -->
  <line x1="100" y1="340" x2="640" y2="340" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="640,340 630,336 630,344" fill="#2D3748"/>
  <text x="370" y="390" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748">Gewas</text>

  <!-- Origin -->
  <text x="92" y="358" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">0</text>

  <!-- Y-axis ticks (€0 to €600, step 100) — 100€ = 48px -->
  <line x1="95" y1="292" x2="100" y2="292" stroke="#2D3748" stroke-width="1"/>
  <text x="88" y="296" text-anchor="end" font-family="Arial" font-size="12" fill="#2D3748">€100</text>
  <line x1="95" y1="244" x2="100" y2="244" stroke="#2D3748" stroke-width="1"/>
  <text x="88" y="248" text-anchor="end" font-family="Arial" font-size="12" fill="#2D3748">€200</text>
  <line x1="95" y1="196" x2="100" y2="196" stroke="#2D3748" stroke-width="1"/>
  <text x="88" y="200" text-anchor="end" font-family="Arial" font-size="12" fill="#2D3748">€300</text>
  <line x1="95" y1="148" x2="100" y2="148" stroke="#2D3748" stroke-width="1"/>
  <text x="88" y="152" text-anchor="end" font-family="Arial" font-size="12" fill="#2D3748">€400</text>
  <line x1="95" y1="100" x2="100" y2="100" stroke="#2D3748" stroke-width="1"/>
  <text x="88" y="104" text-anchor="end" font-family="Arial" font-size="12" fill="#2D3748">€500</text>

  <!-- Gridlines -->
  <line x1="100" y1="292" x2="600" y2="292" stroke="#E0E0E0" stroke-width="0.5"/>
  <line x1="100" y1="244" x2="600" y2="244" stroke="#E0E0E0" stroke-width="0.5"/>
  <line x1="100" y1="196" x2="600" y2="196" stroke="#E0E0E0" stroke-width="0.5"/>
  <line x1="100" y1="148" x2="600" y2="148" stroke="#E0E0E0" stroke-width="0.5"/>
  <line x1="100" y1="100" x2="600" y2="100" stroke="#E0E0E0" stroke-width="0.5"/>

  <!-- Bar 1: Tarwe — €500 -->
  <rect x="145" y="100" width="120" height="240" fill="#1A5276" opacity="0.7" stroke="#1A5276" stroke-width="1.5"/>
  <text x="205" y="88" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1A5276">€500</text>
  <text x="205" y="365" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">Tarwe</text>

  <!-- Bar 2: Maïs — €350 -->
  <rect x="305" y="172" width="120" height="168" fill="#27AE60" opacity="0.6" stroke="#27AE60" stroke-width="1.5"/>
  <text x="365" y="160" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#27AE60">€350</text>
  <text x="365" y="365" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">Maïs</text>

  <!-- Bar 3: Zonnebloemen — €300 -->
  <rect x="465" y="196" width="120" height="144" fill="#E67E22" opacity="0.6" stroke="#E67E22" stroke-width="1.5"/>
  <text x="525" y="184" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#E67E22">€300</text>
  <text x="525" y="365" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">Zonnebloemen</text>
</svg>