      <text x="391.16666666666663" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="0" font-style="" fill="#4ade80">Opbrengsten</text>
      <text x="377.16666666666663" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#f2efe8">Wat levert</text><text x="377.16666666666663" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#f2efe8">elk op?</text>
      <text x="377.16666666666663" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0" font-style="italic" fill="#909aa8">€5.000 vs €3.500</text>
    
      <rect x="485.3333333333333" y="162" width="195" height="162" rx="20" fill="#352813" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="515.3333333333333" cy="196" r="20" fill="#fbbf24"/>
