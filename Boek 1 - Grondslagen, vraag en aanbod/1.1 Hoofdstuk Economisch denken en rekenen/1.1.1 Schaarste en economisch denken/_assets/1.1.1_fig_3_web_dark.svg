      <text x="185.5" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="0" font-style="" fill="#2dd4bf">Alternatieven</text>
      <text x="171.5" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#f2efe8">Welke opties</text><text x="171.5" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#f2efe8">heb je?</text>
      <text x="171.5" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0" font-style="italic" fill="#909aa8">Tarwe of maïs</text>
    
      <rect x="279.66666666666663" y="162" width="195" height="162" rx="20" fill="#123022" stroke="#4ade80" stroke-width="2"/>
      <circle cx="309.66666666666663" cy="196" r="20" fill="#4ade80"/>
