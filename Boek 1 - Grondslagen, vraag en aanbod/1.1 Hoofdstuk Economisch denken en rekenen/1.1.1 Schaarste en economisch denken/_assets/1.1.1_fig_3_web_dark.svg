    <text x="64" y="114" text-anchor="start" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="700" letter-spacing="0" font-style="italic" fill="#f2efe8">Economisch denken in vier stappen (B02)</text>
    <text x="64" y="146" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0" font-style="" fill="#c9c2b8">Alternatieven benoemen, opbrengsten, rangschikken, nettowaarde beoordelen.</text>
  
    
      <rect x="74" y="162" width="195" height="162" rx="20" fill="#12333b" stroke="#2dd4bf" stroke-width="2"/>
