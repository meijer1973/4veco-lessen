    <text x="380" y="359" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="0" font-style="" fill="#4a463d">Tarwe kiezen → opbrengst €5.000; alt. kosten €3.500 (maïs); nettowaarde €1.500.</text>
