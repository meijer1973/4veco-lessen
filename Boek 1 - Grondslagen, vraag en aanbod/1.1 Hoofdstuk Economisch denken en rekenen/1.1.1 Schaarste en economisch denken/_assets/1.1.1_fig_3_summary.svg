      <text x="143" y="218" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">Welke opties</text><text x="143" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">heb je?</text>
      
    
