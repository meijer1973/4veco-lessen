    <text x="54" y="136" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0" font-style="" fill="#4a463d">Alternatieven benoemen, opbrengsten, rangschikken, nettowaarde beoordelen.</text>
  
    
      <rect x="64" y="150" width="158" height="116" rx="20" fill="#dff6f8" stroke="#17A2B8" stroke-width="2"/>
