      <text x="459" y="218" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">Beste niet-</text><text x="459" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">gekozen = alt. kosten</text>
      
    
