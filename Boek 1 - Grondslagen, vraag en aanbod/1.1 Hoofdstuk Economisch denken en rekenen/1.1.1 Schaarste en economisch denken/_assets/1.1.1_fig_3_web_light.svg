      <text x="596.8333333333333" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="0" font-style="" fill="#d08732">Rangschik</text>
      <text x="582.8333333333333" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">Beste niet-</text><text x="582.8333333333333" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">gekozen = alt. kosten</text>
      <text x="582.8333333333333" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0" font-style="italic" fill="#82796d">alt. kosten €3.500</text>
    
      <rect x="691" y="162" width="195" height="162" rx="20" fill="#e5f4ea" stroke="#2f7d4a" stroke-width="2"/>
      <circle cx="721" cy="196" r="20" fill="#2f7d4a"/>
