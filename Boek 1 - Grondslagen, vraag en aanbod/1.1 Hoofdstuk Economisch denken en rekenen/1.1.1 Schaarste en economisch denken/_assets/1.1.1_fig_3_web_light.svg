<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
    
    <rect width="960" height="540" rx="28" fill="#fbf8ef"/>
    <rect x="32" y="32" width="896" height="476" rx="24" fill="#ffffff" stroke="#d9d0be" stroke-width="1.5"/>
    <text x="64" y="114" text-anchor="start" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="700" letter-spacing="0" font-style="italic" fill="#1b1a17">Economisch denken in vier stappen (B02)</text>
    <text x="64" y="146" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0" font-style="" fill="#4a463d">Alternatieven benoemen, opbrengsten, rangschikken, nettowaarde beoordelen.</text>
  
    
      <rect x="74" y="162" width="195" height="162" rx="20" fill="#dff6f8" stroke="#17A2B8" stroke-width="2"/>
      <circle cx="104" cy="196" r="20" fill="#17A2B8"/>
      <text x="104" y="203" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="0" font-style="" fill="#ffffff">1</text>
      <text x="185.5" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="0" font-style="" fill="#17A2B8">Alternatieven</text>
      <text x="171.5" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">Welke opties</text><text x="171.5" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">heb je?</text>
      <text x="171.5" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0" font-style="italic" fill="#82796d">Tarwe of maïs</text>
    
      <rect x="279.66666666666663" y="162" width="195" height="162" rx="20" fill="#e5f4ea" stroke="#2f7d4a" stroke-width="2"/>
      <circle cx="309.66666666666663" cy="196" r="20" fill="#2f7d4a"/>
      <text x="309.66666666666663" y="203" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="0" font-style="" fill="#ffffff">2</text>
      <text x="391.16666666666663" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="0" font-style="" fill="#2f7d4a">Opbrengsten</text>
      <text x="377.16666666666663" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">Wat levert</text><text x="377.16666666666663" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">elk op?</text>
      <text x="377.16666666666663" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0" font-style="italic" fill="#82796d">€5.000 vs €3.500</text>
    
      <rect x="485.3333333333333" y="162" width="195" height="162" rx="20" fill="#f5ead8" stroke="#d08732" stroke-width="2"/>
      <circle cx="515.3333333333333" cy="196" r="20" fill="#d08732"/>
