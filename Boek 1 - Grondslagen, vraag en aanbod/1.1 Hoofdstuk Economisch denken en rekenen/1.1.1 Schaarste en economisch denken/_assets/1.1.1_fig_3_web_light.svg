      <text x="788.5" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">Opbrengst -</text><text x="788.5" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="0" font-style="" fill="#1b1a17">alt. kosten</text>
      <text x="788.5" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0" font-style="italic" fill="#82796d">€5.000 - €3.500 = €1.500</text>
    
    <line x1="275" y1="243" x2="273.66666666666663" y2="243" stroke="#82796d" stroke-width="3"/><polygon points="273.66666666666663,243 261.66666666666663,235 261.66666666666663,251" fill="#82796d"/><line x1="480.6666666666667" y1="243" x2="479.3333333333333" y2="243" stroke="#82796d" stroke-width="3"/><polygon points="479.3333333333333,243 467.3333333333333,235 467.3333333333333,251" fill="#82796d"/><line x1="686.3333333333334" y1="243" x2="685" y2="243" stroke="#82796d" stroke-width="3"/><polygon points="685,243 673,235 673,251" fill="#82796d"/>
    <rect x="90" y="382" width="780" height="94" rx="18" fill="#efe8d7" stroke="#d9d0be" stroke-width="1.3"/>
    <text x="480" y="417" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="900" letter-spacing="0" font-style="" fill="#1b1a17">Voorbeeld boer met 10 hectare</text>
    <text x="480" y="450" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" letter-spacing="0" font-style="" fill="#4a463d">Tarwe kiezen → opbrengst €5.000; alt. kosten €3.500 (maïs); nettowaarde €1.500.</text>
