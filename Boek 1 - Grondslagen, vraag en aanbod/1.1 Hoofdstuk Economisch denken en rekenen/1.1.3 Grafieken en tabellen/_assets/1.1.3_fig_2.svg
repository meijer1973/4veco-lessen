<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial">
  <!-- Background -->
  <rect width="720" height="400" fill="#F7FAFC" rx="8"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Figuur 2: Assenconventie — economie vs. wiskunde</text>

  <!-- ===== LEFT PANEL: Economics convention (CORRECT) ===== -->
  <!-- Panel area: x=40..330, y=55..340 -->

  <!-- Panel title -->
  <text x="185" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#27AE60">Economie (correct)</text>

  <!-- Y-axis -->
  <line x1="80" y1="330" x2="80" y2="70" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,70 76,80 84,80" fill="#2D3748"/>
  <text x="72" y="205" text-anchor="middle" font-size="11" fill="#2D3748" transform="rotate(-90, 30, 205)">Prijs (P)</text>

  <!-- X-axis -->
  <line x1="80" y1="330" x2="320" y2="330" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="320,330 310,326 310,334" fill="#2D3748"/>
  <text x="200" y="365" text-anchor="middle" font-size="11" fill="#2D3748">Hoeveelheid (Q)</text>

  <!-- Origin -->
  <text x="72" y="345" text-anchor="end" font-size="10" fill="#718096">0</text>

  <!-- Demand line (correct: P on y, Q on x) -->
  <!-- From (Q=50,P=high) to (Q=250,P=low): line from (110,100) to (290,300) -->
  <line x1="110" y1="100" x2="290" y2="300" stroke="#1A5276" stroke-width="2.5"/>
  <circle cx="110" cy="100" r="4" fill="#1A5276"/>
  <circle cx="200" cy="200" r="4" fill="#1A5276"/>
  <circle cx="290" cy="300" r="4" fill="#1A5276"/>

  <!-- Green check mark -->
  <rect x="140" y="75" width="20" height="20" rx="3" fill="#27AE60"/>
  <text x="150" y="90" text-anchor="middle" font-size="14" fill="white" font-weight="bold">✓</text>

  <!-- Box label below panel -->
  <rect x="60" y="370" width="260" height="24" rx="4" fill="none" stroke="#27AE60" stroke-width="1.5"/>
  <text x="190" y="387" text-anchor="middle" font-size="10" fill="#27AE60" font-weight="bold">Prijs op y-as, hoeveelheid op x-as</text>


  <!-- ===== RIGHT PANEL: Math convention (WRONG for economics) ===== -->
  <!-- Panel area: x=390..680, y=55..340 -->

  <!-- Panel title -->
  <text x="535" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#D9534F">Wiskunde (niet gebruiken)</text>

  <!-- Y-axis -->
  <line x1="430" y1="330" x2="430" y2="70" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="430,70 426,80 434,80" fill="#2D3748"/>
  <text x="422" y="205" text-anchor="middle" font-size="11" fill="#2D3748" transform="rotate(-90, 380, 205)">Hoeveelheid (Q)</text>

  <!-- X-axis -->
  <line x1="430" y1="330" x2="670" y2="330" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="670,330 660,326 660,334" fill="#2D3748"/>
  <text x="550" y="365" text-anchor="middle" font-size="11" fill="#2D3748">Prijs (P)</text>

  <!-- Origin -->
  <text x="422" y="345" text-anchor="end" font-size="10" fill="#718096">0</text>

  <!-- Same demand relationship but axes swapped: P on x, Q on y -->
  <!-- From (P=low,Q=high) to (P=high,Q=low): line from (460,100) to (640,300) -->
  <line x1="460" y1="100" x2="640" y2="300" stroke="#1A5276" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="460" cy="100" r="4" fill="#1A5276" opacity="0.5"/>
  <circle cx="550" cy="200" r="4" fill="#1A5276" opacity="0.5"/>
  <circle cx="640" cy="300" r="4" fill="#1A5276" opacity="0.5"/>

  <!-- Red cross -->
  <rect x="490" y="75" width="20" height="20" rx="3" fill="#D9534F"/>
  <text x="500" y="90" text-anchor="middle" font-size="14" fill="white" font-weight="bold">✗</text>

  <!-- Box label below panel -->
  <rect x="410" y="370" width="260" height="24" rx="4" fill="none" stroke="#D9534F" stroke-width="1.5"/>
  <text x="540" y="387" text-anchor="middle" font-size="10" fill="#D9534F" font-weight="bold">Assen omgedraaid — niet bij economie</text>
</svg>
