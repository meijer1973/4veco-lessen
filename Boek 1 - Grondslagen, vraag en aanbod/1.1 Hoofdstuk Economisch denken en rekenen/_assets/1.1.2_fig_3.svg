<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial" font-size="12">
  <!-- Background -->
  <rect width="720" height="400" fill="#F7FAFC" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Indexpunten vs. procenten — de klassieke valkuil</text>

  <!-- LEFT PANEL: The wrong reasoning -->
  <rect x="30" y="50" width="310" height="300" fill="white" rx="6" stroke="#CBD5E0" stroke-width="1"/>
  <text x="185" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#D9534F">FOUT</text>

  <!-- Two bars showing index 125 and 135 -->
  <!-- Bar 125 -->
  <rect x="80" y="140" width="80" height="175" fill="#1A5276" rx="3"/>
  <text x="120" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A5276">125</text>
  <text x="120" y="335" text-anchor="middle" font-size="10" fill="#718096">oud</text>

  <!-- Bar 135 -->
  <rect x="210" y="110" width="80" height="205" fill="#1A5276" rx="3"/>
  <text x="250" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A5276">135</text>
  <text x="250" y="335" text-anchor="middle" font-size="10" fill="#718096">nieuw</text>

  <!-- Arrow showing difference -->
  <line x1="175" y1="140" x2="175" y2="110" stroke="#D9534F" stroke-width="2"/>
  <polygon points="175,106 171,116 179,116" fill="#D9534F"/>
  <text x="175" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#D9534F">+10</text>

  <!-- Wrong conclusion -->
  <rect x="55" y="345" width="260" height="26" fill="#FDECEA" rx="4" stroke="#D9534F" stroke-width="1"/>
  <text x="185" y="363" text-anchor="middle" font-size="11" fill="#D9534F">"10 indexpunten = 10% stijging"</text>

  <!-- Cross mark -->
  <text x="310" y="365" text-anchor="middle" font-size="16" fill="#D9534F">✗</text>

  <!-- RIGHT PANEL: The correct reasoning -->
  <rect x="380" y="50" width="310" height="300" fill="white" rx="6" stroke="#CBD5E0" stroke-width="1"/>
  <text x="535" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#27AE60">GOED</text>

  <!-- Bar 125 -->
  <rect x="420" y="140" width="80" height="175" fill="#1A5276" rx="3"/>
  <text x="460" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A5276">125</text>
  <text x="460" y="335" text-anchor="middle" font-size="10" fill="#718096">oud</text>

  <!-- Bar 135 -->
  <rect x="560" y="110" width="80" height="205" fill="#1A5276" rx="3"/>
  <text x="600" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A5276">135</text>
  <text x="600" y="335" text-anchor="middle" font-size="10" fill="#718096">nieuw</text>

  <!-- Calculation shown -->
  <text x="535" y="210" text-anchor="middle" font-size="11" fill="#2D3748">10 / 125 × 100%</text>
  <line x1="470" y1="218" x2="600" y2="218" stroke="#2D3748" stroke-width="1"/>
  <text x="535" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#27AE60">= 8%</text>

  <!-- Arrow pointing to "delen door OUD indexcijfer" -->
  <text x="535" y="265" text-anchor="middle" font-size="10" fill="#E67E22">↑ delen door OUD</text>
  <text x="535" y="279" text-anchor="middle" font-size="10" fill="#E67E22">indexcijfer (125)</text>

  <!-- Correct conclusion -->
  <rect x="405" y="345" width="260" height="26" fill="#E8F8E8" rx="4" stroke="#27AE60" stroke-width="1"/>
  <text x="535" y="363" text-anchor="middle" font-size="11" fill="#27AE60">"10 indexpunten = 8% stijging"</text>

  <!-- Check mark -->
  <text x="660" y="365" text-anchor="middle" font-size="16" fill="#27AE60">✓</text>

  <!-- Bottom rule box -->
  <rect x="100" y="380" width="520" height="16" fill="none"/>
  <text x="360" y="394" text-anchor="middle" font-size="11" font-weight="bold" fill="#E67E22">Regel: indexpunten ÷ oud indexcijfer × 100% = procentuele verandering</text>
</svg>