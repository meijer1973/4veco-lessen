<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="400" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2D3748">Economisch denken in drie stappen</text>

  <!-- Step 1 box -->
  <rect x="40" y="60" width="200" height="120" rx="10" fill="#1A5276" opacity="0.1" stroke="#1A5276" stroke-width="2"/>
  <circle cx="70" cy="88" r="16" fill="#1A5276"/>
  <text x="70" y="94" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">1</text>
  <text x="150" y="92" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1A5276">Alternatieven</text>
  <text x="140" y="118" text-anchor="middle" font-family="Arial" font-size="12" fill="#2D3748">Welke opties</text>
  <text x="140" y="135" text-anchor="middle" font-family="Arial" font-size="12" fill="#2D3748">heb je?</text>
  <text x="140" y="162" text-anchor="middle" font-family="Arial" font-size="11" font-style="italic" fill="#555">Tarwe of maïs</text>

  <!-- Arrow 1→2 -->
  <line x1="245" y1="120" x2="275" y2="120" stroke="#2D3748" stroke-width="2"/>
  <polygon points="275,120 267,115 267,125" fill="#2D3748"/>

  <!-- Step 2 box -->
  <rect x="280" y="60" width="200" height="120" rx="10" fill="#27AE60" opacity="0.1" stroke="#27AE60" stroke-width="2"/>
  <circle cx="310" cy="88" r="16" fill="#27AE60"/>
  <text x="310" y="94" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">2</text>
  <text x="390" y="92" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#27AE60">Opbrengsten</text>
  <text x="380" y="118" text-anchor="middle" font-family="Arial" font-size="12" fill="#2D3748">Wat levert elk</text>
  <text x="380" y="135" text-anchor="middle" font-family="Arial" font-size="12" fill="#2D3748">alternatief op?</text>
  <text x="380" y="162" text-anchor="middle" font-family="Arial" font-size="11" font-style="italic" fill="#555">€5.000 vs €3.500</text>

  <!-- Arrow 2→3 -->
  <line x1="485" y1="120" x2="515" y2="120" stroke="#2D3748" stroke-width="2"/>
  <polygon points="515,120 507,115 507,125" fill="#2D3748"/>

  <!-- Step 3 box -->
  <rect x="520" y="60" width="170" height="120" rx="10" fill="#E67E22" opacity="0.1" stroke="#E67E22" stroke-width="2"/>
  <circle cx="550" cy="88" r="16" fill="#E67E22"/>
  <text x="550" y="94" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">3</text>
  <text x="610" y="92" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#E67E22">Alternatieve</text>
  <text x="610" y="108" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#E67E22">kosten</text>
  <text x="605" y="134" text-anchor="middle" font-family="Arial" font-size="12" fill="#2D3748">Wat geef je op?</text>
  <text x="605" y="162" text-anchor="middle" font-family="Arial" font-size="11" font-style="italic" fill="#555">€3.500 misgelopen</text>

  <!-- Example section below -->
  <line x1="60" y1="210" x2="660" y2="210" stroke="#2D3748" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="360" y="240" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2D3748">Voorbeeld: de boer met 10 hectare</text>

  <!-- Choice visual -->
  <rect x="60" y="260" width="280" height="50" rx="8" fill="#1A5276" opacity="0.15" stroke="#1A5276" stroke-width="1.5"/>
  <text x="200" y="280" text-anchor="middle" font-family="Arial" font-size="13" fill="#1A5276">Gekozen: Tarwe</text>
  <text x="200" y="300" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1A5276">Opbrengst: €5.000</text>

  <rect x="380" y="260" width="280" height="50" rx="8" fill="#E67E22" opacity="0.15" stroke="#E67E22" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="520" y="280" text-anchor="middle" font-family="Arial" font-size="13" fill="#E67E22">Niet gekozen: Maïs</text>
  <text x="520" y="300" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#E67E22">Opbrengst: €3.500</text>

  <!-- Result -->
  <rect x="140" y="330" width="440" height="50" rx="8" fill="#27AE60" opacity="0.1" stroke="#27AE60" stroke-width="2"/>
  <text x="360" y="352" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">Alternatieve kosten = €3.500 | Netto voordeel = €5.000 − €3.500 = <tspan font-weight="bold" fill="#27AE60">€1.500</tspan></text>
  <text x="360" y="372" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic" fill="#555">De boer is economisch beter af met tarwe</text>
</svg>