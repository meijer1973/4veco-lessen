<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial" font-size="12">
  <!-- Background -->
  <rect width="720" height="400" fill="#F7FAFC" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Prijsstijging smartphone — van €600 naar €648</text>

  <!-- Y-axis -->
  <line x1="120" y1="55" x2="120" y2="330" stroke="#2D3748" stroke-width="2"/>
  <polygon points="120,50 116,60 124,60" fill="#2D3748"/>

  <!-- X-axis -->
  <line x1="120" y1="330" x2="600" y2="330" stroke="#2D3748" stroke-width="2"/>

  <!-- Y-axis label -->
  <text x="20" y="195" text-anchor="middle" font-size="12" fill="#718096" transform="rotate(-90, 20, 195)">Prijs (€)</text>

  <!-- Y-axis tick labels -->
  <text x="110" y="334" text-anchor="end" font-size="11" fill="#718096">0</text>
  <text x="110" y="284" text-anchor="end" font-size="11" fill="#718096">200</text>
  <text x="110" y="234" text-anchor="end" font-size="11" fill="#718096">400</text>
  <text x="110" y="184" text-anchor="end" font-size="11" fill="#718096">600</text>
  <text x="110" y="134" text-anchor="end" font-size="11" fill="#718096">800</text>

  <!-- Y-axis gridlines (subtle) -->
  <line x1="120" y1="280" x2="600" y2="280" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="120" y1="230" x2="600" y2="230" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="120" y1="180" x2="600" y2="180" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="120" y1="130" x2="600" y2="130" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Bar: Old price €600 -->
  <rect x="200" y="180" width="120" height="150" fill="#1A5276" rx="3"/>
  <text x="260" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A5276">€600</text>
  <text x="260" y="360" text-anchor="middle" font-size="12" fill="#2D3748">Oude prijs</text>
  <text x="260" y="376" text-anchor="middle" font-size="11" fill="#718096">(vorig jaar)</text>

  <!-- Bar: New price €648 — split into two parts -->
  <!-- Base part (same as old price) -->
  <rect x="400" y="180" width="120" height="150" fill="#1A5276" rx="0"/>
  <!-- Extra part: the €48 increase (orange) -->
  <rect x="400" y="156" width="120" height="24" fill="#E67E22" rx="0"/>
  <!-- Round top corners only -->
  <rect x="400" y="156" width="120" height="8" fill="#E67E22" rx="3"/>

  <text x="460" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#E67E22">€648</text>
  <text x="460" y="360" text-anchor="middle" font-size="12" fill="#2D3748">Nieuwe prijs</text>
  <text x="460" y="376" text-anchor="middle" font-size="11" fill="#718096">(dit jaar)</text>

  <!-- Arrow and label showing the +€48 / +8% -->
  <line x1="540" y1="180" x2="540" y2="156" stroke="#E67E22" stroke-width="2"/>
  <polygon points="540,152 536,162 544,162" fill="#E67E22"/>
  <text x="580" y="162" text-anchor="start" font-size="12" font-weight="bold" fill="#E67E22">+€48</text>
  <text x="580" y="178" text-anchor="start" font-size="12" font-weight="bold" fill="#E67E22">(+8%)</text>

  <!-- Bracket showing "old value" reference -->
  <line x1="530" y1="180" x2="550" y2="180" stroke="#718096" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="530" y1="156" x2="550" y2="156" stroke="#718096" stroke-width="1" stroke-dasharray="3,3"/>
</svg>