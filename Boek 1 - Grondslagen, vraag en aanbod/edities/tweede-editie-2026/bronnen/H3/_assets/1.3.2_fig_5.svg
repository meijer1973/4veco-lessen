<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7Z" fill="#183247"/></marker></defs><rect x="0" y="0" width="720" height="220" rx="6" fill="#f7fafb"/><text x="360.00000" y="28.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" fill="#17688f" text-anchor="middle" font-weight="700" >Een controle bestaat uit twee aparte berekeningen</text><rect x="20.0" y="54" width="212.0" height="115" rx="6" fill="#edf5f8"/><text x="126.00000" y="82.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#17688f" text-anchor="middle" font-weight="700" >Gevonden prijs</text><text x="126.00000" y="111.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" fill="#183247" text-anchor="middle" font-weight="400" >Niet afronden</text><text x="126.00000" y="135.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" fill="#183247" text-anchor="middle" font-weight="400" >tijdens het oplossen</text><line x1="234.00000" y1="111.00000" x2="251.00000" y2="111.00000" stroke="#183247" stroke-width="1.5" marker-end="url(#arr)"/><rect x="254.0" y="54" width="212.0" height="115" rx="6" fill="#edf5f8"/><text x="360.00000" y="82.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#17688f" text-anchor="middle" font-weight="700" >Invullen</text><text x="360.00000" y="111.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" fill="#183247" text-anchor="middle" font-weight="400" >In de vraagfunctie</text><text x="360.00000" y="135.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" fill="#183247" text-anchor="middle" font-weight="400" >én in de aanbodfunctie</text><line x1="468.00000" y1="111.00000" x2="485.00000" y2="111.00000" stroke="#183247" stroke-width="1.5" marker-end="url(#arr)"/><rect x="488.0" y="54" width="212.0" height="115" rx="6" fill="#edf5f8"/><text x="594.00000" y="82.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#17688f" text-anchor="middle" font-weight="700" >Vergelijken</text><text x="594.00000" y="111.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" fill="#183247" text-anchor="middle" font-weight="400" >Qv = Qa?</text><text x="594.00000" y="135.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" fill="#183247" text-anchor="middle" font-weight="400" >Eenheid en betekenis?</text><text x="360.00000" y="201.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" fill="#536777" text-anchor="middle" font-weight="400" >Gelijke uitkomsten controleren het evenwicht; ze zeggen niets over eerlijkheid.</text></svg>