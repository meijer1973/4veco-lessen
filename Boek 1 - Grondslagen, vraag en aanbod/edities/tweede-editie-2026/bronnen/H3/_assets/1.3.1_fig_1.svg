<svg xmlns="http://www.w3.org/2000/svg" width="720" height="241" viewBox="0 0 720 241"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7Z" fill="#183247"/></marker></defs><rect x="0" y="0" width="720" height="241" rx="6" fill="#f7fafb"/><text x="360.00000" y="27.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#17688f" text-anchor="middle" font-weight="700" >Dezelfde markt, twee soorten plannen</text><rect x="22" y="50" width="318" height="110" rx="6" fill="#eaf2f6"/><text x="181.00000" y="79.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" fill="#17688f" text-anchor="middle" font-weight="700" >Kopers</text><text x="181.00000" y="111.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" fill="#183247" text-anchor="middle" font-weight="400" >Hoeveel wil en kan ik kopen?</text><text x="181.00000" y="142.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" fill="#536777" text-anchor="middle" font-weight="400" >bij verschillende prijzen</text><rect x="380" y="50" width="318" height="110" rx="6" fill="#eaf2f6"/><text x="539.00000" y="79.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" fill="#227064" text-anchor="middle" font-weight="700" >Verkopers</text><text x="539.00000" y="111.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" fill="#183247" text-anchor="middle" font-weight="400" >Hoeveel wil en kan ik aanbieden?</text><text x="539.00000" y="142.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" fill="#536777" text-anchor="middle" font-weight="400" >bij verschillende prijzen</text><text x="360.00000" y="197.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="700" >Eén afgesproken product, periode en eenheid.</text><text x="360.00000" y="222.00000" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" fill="#5367