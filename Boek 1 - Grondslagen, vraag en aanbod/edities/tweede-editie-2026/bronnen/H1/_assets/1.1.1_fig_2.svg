<svg xmlns="http://www.w3.org/2000/svg" width="720" height="273" viewBox="0 0 720 273"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7Z" fill="#183247"/></marker></defs><rect x="0" y="0" width="720" height="273" rx="8" fill="#f7fafb" stroke="none"/><text x="360.000" y="28.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#17688f" text-anchor="middle" font-weight="700" >De beste mogelijkheid die je laat liggen</text><rect x="209" y="48" width="302" height="47" rx="6" fill="#edf5f8" stroke="#b8cdd8"/><text x="360.000" y="78.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" fill="#183247" text-anchor="middle" font-weight="700" >Drie uur op zaterdag</text><line x1="360.00000" y1="95.00000" x2="127.00000" y2="119.00000" stroke="#536777" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="22" y="121" width="211" height="100" rx="6" fill="#e8f3ef" stroke="#bfd1db"/><text x="127.000" y="149.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" fill="#17688f" text-anchor="middle" font-weight="700" >Naar de bibliotheek</text><text x="127.000" y="175.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" fill="#183247" text-anchor="middle" font-weight="400" >Jouw gekozen activiteit</text><text x="127.000" y="201.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" fill="#183247" text-anchor="middle" font-weight="400" >Geen toegangsprijs</text><line x1="360.00000" y1="95.00000" x2="360.00000" y2="119.00000" stroke="#536777" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="255" y="121" width="211" height="100" rx="6" fill="#eef3f6" stroke="#bfd1db"/><text x="360.000" y="149.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" fill="#17688f" text-anchor="middle" font-weight="700" >Honden uitlaten</text><text x="360.000" y="175.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" fill="#183247" text-anchor=