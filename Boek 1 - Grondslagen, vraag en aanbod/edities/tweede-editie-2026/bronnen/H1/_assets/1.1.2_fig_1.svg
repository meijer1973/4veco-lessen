<svg xmlns="http://www.w3.org/2000/svg" width="720" height="214" viewBox="0 0 720 214"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7Z" fill="#183247"/></marker></defs><rect x="0" y="0" width="720" height="214" rx="8" fill="#f7fafb" stroke="none"/><text x="360.000" y="27.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#17688f" text-anchor="middle" font-weight="700" >Twee verschillende vergelijkingen</text><rect x="24" y="51" width="324" height="140" rx="6" fill="#edf5f8" stroke="#cbdbe3"/><rect x="372" y="51" width="324" height="140" rx="6" fill="#edf5f8" stroke="#cbdbe3"/><text x="186.000" y="79.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" fill="#17688f" text-anchor="middle" font-weight="700" >Bedrag per eenheid</text><text x="186.000" y="113.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="400" >€ 180 voor 12 personen</text><text x="186.000" y="146.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="700" >€ 180 / 12 = € 15</text><text x="186.000" y="176.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" fill="#536777" text-anchor="middle" font-weight="400" >Eenheid: euro per persoon</text><text x="534.000" y="79.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" fill="#17688f" text-anchor="middle" font-weight="700" >Deel van een groep</text><text x="534.000" y="113.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="400" >18 van de 60 leerlingen</text><text x="534.000" y="146.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="700" >18 / 60 × 100% = 30%</text><text x="534.000" y="176.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" fill="#536777" text-anchor="middle" font-weight="400" >Eenheid: procent</text></svg>