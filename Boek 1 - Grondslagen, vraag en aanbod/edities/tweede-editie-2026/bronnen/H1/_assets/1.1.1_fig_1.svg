<svg xmlns="http://www.w3.org/2000/svg" width="720" height="208" viewBox="0 0 720 208"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7Z" fill="#183247"/></marker></defs><rect x="0" y="0" width="720" height="208" rx="8" fill="#f7fafb" stroke="none"/><text x="360.000" y="27.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#17688f" text-anchor="middle" font-weight="700" >Je kunt hetzelfde middel niet tegelijk twee keer gebruiken</text><rect x="24.0" y="54" width="205.33333333333334" height="100" rx="6" fill="#edf5f8" stroke="#cedce3"/><text x="126.667" y="81.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" fill="#17688f" text-anchor="middle" font-weight="700" >Behoeften</text><text x="126.667" y="109.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" fill="#183247" text-anchor="middle" font-weight="400" >Wat wil je bereiken?</text><line x1="233.33333" y1="104.00000" x2="252.33333" y2="104.00000" stroke="#183247" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="257.33333333333337" y="54" width="205.33333333333334" height="100" rx="6" fill="#edf5f8" stroke="#cedce3"/><text x="360.000" y="81.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" fill="#17688f" text-anchor="middle" font-weight="700" >Beperkt middel</text><text x="360.000" y="109.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" fill="#183247" text-anchor="middle" font-weight="400" >Tijd, geld of ruimte</text><line x1="466.66667" y1="104.00000" x2="485.66667" y2="104.00000" stroke="#183247" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="490.6666666666667" y="54" width="205.33333333333334" height="100" rx="6" fill="#edf5f8" stroke="#cedce3"/><text x="593.333" y="81.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" fill="#17688f" text-anchor="middle" font-weight="700" >Keuze</text><text x="593.333" y="109.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="16" fill="#183247" text-anchor="middle" font-weight="400" >Wat doe je wél?</text><text x="360.000" y="187.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" fill="#183247" text-anchor="middle" font-weight="400" >Een keuze betekent dat een andere mogelijkheid vervalt.</text></svg>