<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="360" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2D3748">Verschuiving van de vraaglijn — markt voor boter</text>

  <!-- Y-axis -->
  <line x1="80" y1="310" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>
  <text x="15" y="180" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748" transform="rotate(-90, 15, 180)">Prijs (€)</text>

  <!-- X-axis -->
  <line x1="80" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="680,310 670,306 670,314" fill="#2D3748"/>
  <text x="380" y="350" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748">Hoeveelheid (pakjes per week)</text>

  <!-- Origin -->
  <text x="72" y="325" text-anchor="end" font-family="Arial" font-size="14" fill="#2D3748">0</text>

  <!-- Original V₁: dashed -->
  <line x1="80" y1="75" x2="680" y2="310" stroke="#1A5276" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="685" y="310" font-family="Arial" font-size="16" font-weight="bold" fill="#1A5276">V₁</text>

  <!-- V₂ shifted right (+300Q): start at Q=300/x=193, end at Q=1900 (cap at x=680) -->
  <line x1="193" y1="75" x2="680" y2="266" stroke="#27AE60" stroke-width="2.5"/>
  <text x="685" y="266" font-family="Arial" font-size="16" font-weight="bold" fill="#27AE60">V₂</text>

  <!-- Reference: €2 on V₁ at Q=1000 (x=455), on V₂ at Q=1300 (x=568) -->
  <circle cx="455" cy="222" r="4" fill="#1A5276"/>
  <circle cx="568" cy="222" r="4" fill="#27AE60"/>

  <!-- Shift arrow at €2 level -->
  <line x1="460" y1="222" x2="563" y2="222" stroke="#27AE60" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#27AE60"/>
    </marker>
  </defs>

  <!-- €2 dashed line -->
  <line x1="80" y1="222" x2="455" y2="222" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="72" y="226" text-anchor="end" font-family="Arial" font-size="14" fill="#2D3748">€2</text>

  <!-- Quantity labels -->
  <line x1="455" y1="222" x2="455" y2="310" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="568" y1="222" x2="568" y2="310" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="455" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">1000</text>
  <text x="568" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">1300</text>

  <!-- Annotation -->
  <text x="490" y="200" font-family="Arial" font-size="15" font-style="italic" fill="#27AE60">Verschuiving</text>
  <text x="490" y="218" font-family="Arial" font-size="15" font-style="italic" fill="#27AE60">naar rechts</text>

  <!-- Cause label -->
  <text x="180" y="100" font-family="Arial" font-size="13" fill="#4A5568" font-style="italic">Oorzaak: nieuwsbericht</text>
  <text x="180" y="118" font-family="Arial" font-size="13" fill="#4A5568" font-style="italic">"margarine is ongezond"</text>
</svg>
