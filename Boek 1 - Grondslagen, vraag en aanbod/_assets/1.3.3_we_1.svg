<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial">
  <rect width="720" height="360" fill="#F7FAFC" rx="8"/>
  <text x="360" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Uitgewerkt voorbeeld: markt voor fietsbellen</text>
  <!-- Plot area: x=80..680 (600px), y=45..310 (265px) -->
  <!-- P range: 0..65, px_per_P = 265/65 = 4.077 -->
  <!-- Q range: 0..70, px_per_Q = 600/70 = 8.571 -->
  <!-- x(Q) = 80 + Q*8.571, y(P) = 310 - P*4.077 -->

  <!-- Y-axis -->
  <line x1="80" y1="45" x2="80" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,40 76,48 84,48" fill="#2D3748"/>
  <!-- X-axis -->
  <line x1="80" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="685,310 677,306 677,314" fill="#2D3748"/>
  <!-- Y-axis label -->
  <text x="15" y="180" text-anchor="middle" font-size="12" fill="#718096" transform="rotate(-90, 15, 180)">Prijs (P)</text>
  <!-- Origin -->
  <text x="72" y="325" text-anchor="end" font-size="11" fill="#718096">0</text>

  <!-- V: Qv = -P + 60 -->
  <!-- P=60→Q=0: x=80, y=310-60*4.077=65.4 -->
  <!-- P=0→Q=60: x=80+60*8.571=594.3, y=310 -->
  <line x1="80" y1="65.4" x2="594.3" y2="310" stroke="#1A5276" stroke-width="2"/>
  <text x="602" y="305" font-size="12" font-weight="bold" fill="#1A5276">V</text>

  <!-- A old: Qa = 2P - 30 (dashed orange) -->
  <!-- P=15→Q=0: x=80, y=310-15*4.077=248.8 -->
  <!-- P=55→Q=80 (clip to ~65): P=50→Q=70: x=80+70*8.571=680, y=310-50*4.077=106.2 -->
  <line x1="80" y1="248.8" x2="680" y2="106.2" stroke="#E67E22" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="675" y="99" font-size="11" fill="#E67E22">A</text>

  <!-- A new: Qa' = 2P - 18 (solid green) -->
  <!-- P=9→Q=0: x=80, y=310-9*4.077=273.3 -->
  <!-- P=50→Q=82 → clipped. P=47→Q=76: x=80+76*8.571=731→clip at 680. P=44→Q=70: x=680, y=310-44*4.077=130.6 -->
  <line x1="80" y1="273.3" x2="680" y2="130.6" stroke="#27AE60" stroke-width="2"/>
  <text x="675" y="123" font-size="12" font-weight="bold" fill="#27AE60">A'</text>

  <!-- Old equilibrium E: P=30, Q=30 → x=80+30*8.571=337.1, y=310-30*4.077=187.7 -->
  <line x1="337.1" y1="187.7" x2="80" y2="187.7" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="337.1" y1="187.7" x2="337.1" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="337.1" cy="187.7" r="3.5" fill="#CBD5E0"/>
  <text x="337.1" y="175.7" text-anchor="middle" font-size="10" fill="#718096">E</text>

  <!-- New equilibrium E': P=26, Q=34 → x=80+34*8.571=371.4, y=310-26*4.077=204.0 -->
  <line x1="371.4" y1="204.0" x2="80" y2="204.0" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="371.4" y1="204.0" x2="371.4" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="371.4" cy="204.0" r="4" fill="#2D3748"/>
  <text x="371.4" y="192.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">E'</text>

  <!-- Axis labels -->
  <text x="72" y="191.7" text-anchor="end" font-size="9" fill="#718096">30</text>
  <text x="72" y="208.0" text-anchor="end" font-size="9" fill="#2D3748">26</text>
  <text x="337.1" y="340" text-anchor="middle" font-size="9" fill="#718096">30</text>
  <text x="371.4" y="325" text-anchor="middle" font-size="9" fill="#2D3748">34</text>

  <!-- Y-intercept labels -->
  <text x="72" y="69.4" text-anchor="end" font-size="9" fill="#718096">60</text>
  <line x1="77" y1="65.4" x2="80" y2="65.4" stroke="#2D3748" stroke-width="1"/>

  <!-- Shift arrow on A curve, at P≈38 level -->
  <!-- A old at P=38: Q=2*38-30=46 → x=80+46*8.571=474.3, y=310-38*4.077=155.1 -->
  <line x1="474.3" y1="155.1" x2="524" y2="155.1" stroke="#27AE60" stroke-width="2"/>
  <polygon points="529,155.1 521,151.1 521,159.1" fill="#27AE60"/>
</svg>
