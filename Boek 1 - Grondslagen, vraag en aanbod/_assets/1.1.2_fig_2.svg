<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial" font-size="12">
  <!-- Background -->
  <rect width="720" height="400" fill="#F7FAFC" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D3748">Indexcijfers boodschappenmandje (basisjaar 2021 = 100)</text>

  <!-- Y-axis -->
  <line x1="80" y1="50" x2="80" y2="320" stroke="#2D3748" stroke-width="2"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>

  <!-- X-axis -->
  <line x1="80" y1="320" x2="680" y2="320" stroke="#2D3748" stroke-width="2"/>
  <polygon points="685,320 675,316 675,324" fill="#2D3748"/>

  <!-- Y-axis label -->
  <text x="18" y="185" text-anchor="middle" font-size="12" fill="#2D3748" transform="rotate(-90, 18, 185)">Indexcijfer</text>

  <!-- X-axis label -->
  <text x="380" y="380" text-anchor="middle" font-size="12" fill="#2D3748">Jaar</text>

  <!-- Scale: index 90..150, y range 310..50 -->
  <!-- y = 310 - (index - 90) * (260/60) = 310 - (index - 90) * 4.333 -->

  <!-- Y-axis ticks and gridlines -->
  <!-- 90: y=310 -->
  <line x1="75" y1="310" x2="80" y2="310" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="314" text-anchor="end" font-size="11" fill="#2D3748">90</text>

  <!-- 100: y=310-(10*4.333)=310-43.3=266.7 -->
  <line x1="75" y1="267" x2="80" y2="267" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="271" text-anchor="end" font-size="11" fill="#2D3748">100</text>
  <line x1="80" y1="267" x2="680" y2="267" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- 110: y=310-(20*4.333)=310-86.7=223.3 -->
  <line x1="75" y1="223" x2="80" y2="223" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="227" text-anchor="end" font-size="11" fill="#2D3748">110</text>
  <line x1="80" y1="223" x2="680" y2="223" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- 120: y=310-(30*4.333)=310-130=180 -->
  <line x1="75" y1="180" x2="80" y2="180" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="184" text-anchor="end" font-size="11" fill="#2D3748">120</text>
  <line x1="80" y1="180" x2="680" y2="180" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- 130: y=310-(40*4.333)=310-173.3=136.7 -->
  <line x1="75" y1="137" x2="80" y2="137" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="141" text-anchor="end" font-size="11" fill="#2D3748">130</text>
  <line x1="80" y1="137" x2="680" y2="137" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- 140: y=310-(50*4.333)=310-216.7=93.3 -->
  <line x1="75" y1="93" x2="80" y2="93" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="97" text-anchor="end" font-size="11" fill="#2D3748">140</text>
  <line x1="80" y1="93" x2="680" y2="93" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- 150: y=310-(60*4.333)=310-260=50 -->
  <line x1="75" y1="50" x2="80" y2="50" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="54" text-anchor="end" font-size="11" fill="#2D3748">150</text>

  <!-- X-axis year labels and ticks -->
  <line x1="160" y1="320" x2="160" y2="325" stroke="#2D3748" stroke-width="1"/>
  <text x="160" y="340" text-anchor="middle" font-size="11" fill="#2D3748">2021</text>
  <line x1="280" y1="320" x2="280" y2="325" stroke="#2D3748" stroke-width="1"/>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#2D3748">2022</text>
  <line x1="400" y1="320" x2="400" y2="325" stroke="#2D3748" stroke-width="1"/>
  <text x="400" y="340" text-anchor="middle" font-size="11" fill="#2D3748">2023</text>
  <line x1="520" y1="320" x2="520" y2="325" stroke="#2D3748" stroke-width="1"/>
  <text x="520" y="340" text-anchor="middle" font-size="11" fill="#2D3748">2024</text>
  <line x1="640" y1="320" x2="640" y2="325" stroke="#2D3748" stroke-width="1"/>
  <text x="640" y="340" text-anchor="middle" font-size="11" fill="#2D3748">2025</text>

  <!-- Data points: 2021=100, 2022=112, 2023=125, 2024=132, 2025=140 -->
  <!-- 2021: index=100, x=160, y=267 -->
  <!-- 2022: index=112, y=310-(22*4.333)=310-95.3=214.7 -->
  <!-- 2023: index=125, y=310-(35*4.333)=310-151.7=158.3 -->
  <!-- 2024: index=132, y=310-(42*4.333)=310-182=128 -->
  <!-- 2025: index=140, y=93 -->

  <!-- Line connecting points -->
  <polyline points="160,267 280,215 400,158 520,128 640,93"
            fill="none" stroke="#1A5276" stroke-width="2.5"/>

  <!-- Data points -->
  <circle cx="160" cy="267" r="5" fill="#1A5276"/>
  <circle cx="280" cy="215" r="5" fill="#1A5276"/>
  <circle cx="400" cy="158" r="5" fill="#1A5276"/>
  <circle cx="520" cy="128" r="5" fill="#1A5276"/>
  <circle cx="640" cy="93" r="5" fill="#1A5276"/>

  <!-- Value labels above points -->
  <text x="160" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5276">100</text>
  <text x="280" y="203" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5276">112</text>
  <text x="400" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5276">125</text>
  <text x="520" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5276">132</text>
  <text x="640" y="81" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5276">140</text>

  <!-- Dashed reference line from basis (100) -->
  <line x1="80" y1="267" x2="680" y2="267" stroke="#E67E22" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="685" y="263" text-anchor="start" font-size="10" fill="#E67E22">basis = 100</text>

  <!-- Arrow showing +25% from 2021 to 2023 -->
  <line x1="420" y1="267" x2="420" y2="158" stroke="#E67E22" stroke-width="1.5"/>
  <polygon points="420,154 416,164 424,164" fill="#E67E22"/>
  <text x="440" y="215" text-anchor="start" font-size="11" font-weight="bold" fill="#E67E22">+25%</text>
</svg>
