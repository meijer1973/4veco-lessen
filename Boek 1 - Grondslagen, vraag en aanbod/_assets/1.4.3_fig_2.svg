<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="400" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">Bedrijf 1: MK en MO (constant) &#8212; TK = 200 + 3Q, P = &#8364;8</text>

  <!-- Plot area: x=80..680, y=50..330
       Q range: 0..55, euro range: 0..12
       px_per_Q = 600/55 = 10.909
       px_per_euro = 280/12 = 23.333
       q_to_x(q) = 80 + q * 10.909
       euro_to_y(v) = 330 - v * 23.333
  -->

  <!-- Grid lines -->
  <line x1="80" y1="283.3" x2="680" y2="283.3" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 2 -->
  <line x1="80" y1="236.7" x2="680" y2="236.7" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 4 -->
  <line x1="80" y1="190.0" x2="680" y2="190.0" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 6 -->
  <line x1="80" y1="143.3" x2="680" y2="143.3" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 8 -->
  <line x1="80" y1="96.7" x2="680" y2="96.7" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/><!-- 10 -->

  <!-- Y-axis -->
  <line x1="80" y1="330" x2="80" y2="42" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,42 76,52 84,52" fill="#2D3748"/>
  <text x="15" y="190" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096" transform="rotate(-90,15,190)">Euro per stuk (&#8364;)</text>

  <!-- X-axis -->
  <line x1="80" y1="330" x2="685" y2="330" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="685,330 675,326 675,334" fill="#2D3748"/>
  <text x="380" y="380" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096">Hoeveelheid (Q)</text>

  <!-- Origin -->
  <text x="72" y="345" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">0</text>

  <!-- Y-axis ticks -->
  <line x1="75" y1="283.3" x2="80" y2="283.3" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="287" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">2</text>
  <line x1="75" y1="236.7" x2="80" y2="236.7" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="240" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">4</text>
  <line x1="75" y1="190.0" x2="80" y2="190.0" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="194" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">6</text>
  <line x1="75" y1="143.3" x2="80" y2="143.3" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="147" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">8</text>
  <line x1="75" y1="96.7" x2="80" y2="96.7" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="101" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">10</text>

  <!-- X-axis ticks -->
  <line x1="189.1" y1="330" x2="189.1" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="189.1" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">10</text>
  <line x1="298.2" y1="330" x2="298.2" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="298.2" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">20</text>
  <line x1="407.3" y1="330" x2="407.3" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="407.3" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">30</text>
  <line x1="516.4" y1="330" x2="516.4" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="516.4" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">40</text>
  <line x1="625.5" y1="330" x2="625.5" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="625.5" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">50</text>

  <!-- MK = 3 constant: horizontal line at y = 330 - 3*23.333 = 260.0 -->
  <line x1="80" y1="260.0" x2="650" y2="260.0" stroke="#E67E22" stroke-width="2.5"/>
  <text x="656" y="256" font-family="Arial" font-size="12" font-weight="bold" fill="#E67E22">MK = 3</text>

  <!-- MO = 8 constant: horizontal line at y = 330 - 8*23.333 = 143.3 -->
  <line x1="80" y1="143.3" x2="650" y2="143.3" stroke="#1A5276" stroke-width="2.5"/>
  <text x="656" y="139" font-family="Arial" font-size="12" font-weight="bold" fill="#1A5276">MO = 8</text>

  <!-- Shaded area between MO and MK showing marginal profit per unit -->
  <rect x="80" y="143.3" width="570" height="116.7" fill="#82E0AA" fill-opacity="0.2"/>

  <!-- Annotation: vertical arrow between the two lines at Q=25 -->
  <line x1="353" y1="260" x2="353" y2="147" stroke="#1E8449" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="353" y1="143" x2="353" y2="256" stroke="#1E8449" stroke-width="1.5"/>
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#1E8449"/>
    </marker>
  </defs>
  <text x="370" y="205" font-family="Arial" font-size="11" font-weight="bold" fill="#1E8449">MO &#8722; MK = 5</text>
  <text x="370" y="219" font-family="Arial" font-size="10" fill="#1E8449">(marginale winst)</text>

  <!-- Rule labels below -->
  <rect x="100" y="362" width="240" height="28" rx="4" fill="#FEF3E2" stroke="#E67E22" stroke-width="1"/>
  <text x="220" y="380" text-anchor="middle" font-family="Arial" font-size="10" fill="#E67E22">MK = &#916;TK/&#916;Q = 3 (constant)</text>

  <rect x="380" y="362" width="240" height="28" rx="4" fill="#EBF5FB" stroke="#1A5276" stroke-width="1"/>
  <text x="500" y="380" text-anchor="middle" font-family="Arial" font-size="10" fill="#1A5276">MO = &#916;TO/&#916;Q = 8 = prijs (constant)</text>
</svg>