<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="360" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">Verschuiving van de aanbodlijn naar links</text>

  <!-- Y-axis -->
  <line x1="80" y1="310" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>
  <text x="15" y="180" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096" transform="rotate(-90, 15, 180)">Prijs (P)</text>

  <!-- X-axis -->
  <line x1="80" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="680,310 670,306 670,314" fill="#2D3748"/>
  <text x="380" y="350" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096">Hoeveelheid (Q)</text>

  <!-- Origin -->
  <text x="72" y="325" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">0</text>

  <!-- Original supply curve A₁: Q=2P, from (80,310) to (680,45) — solid -->
  <line x1="80" y1="310" x2="680" y2="45" stroke="#1E8449" stroke-width="2.5"/>
  <text x="685" y="50" font-family="Arial" font-size="12" font-weight="bold" fill="#1E8449">A<tspan font-size="9" dy="3">1</tspan></text>

  <!-- Shifted supply curve A₂: Q=2P-200, P-intercept at P=100 → (80,257), to (560,45) — dashed -->
  <line x1="80" y1="257" x2="560" y2="45" stroke="#E67E22" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="565" y="40" font-family="Arial" font-size="12" font-weight="bold" fill="#E67E22">A<tspan font-size="9" dy="3">2</tspan></text>

  <!-- Dashed reference line at P=200 -->
  <line x1="80" y1="204" x2="340" y2="204" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Points at P=200 on both curves -->
  <!-- A₁: P=200, Q=400 → (320, 204) -->
  <circle cx="320" cy="204" r="4" fill="#1E8449"/>
  <!-- A₂: P=200, Q=200 → (200, 204) -->
  <circle cx="200" cy="204" r="4" fill="#E67E22"/>

  <!-- Vertical dashed lines down to x-axis -->
  <line x1="320" y1="204" x2="320" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="200" y1="204" x2="200" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Price label -->
  <text x="72" y="208" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">200</text>

  <!-- Quantity labels -->
  <text x="200" y="325" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">200</text>
  <text x="320" y="325" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">400</text>

  <!-- Horizontal shift arrow pointing LEFT -->
  <line x1="420" y1="160" x2="348" y2="160" stroke="#E67E22" stroke-width="2"/>
  <polygon points="340,160 352,154 352,166" fill="#E67E22"/>
</svg>