<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="400" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">Fietsenmaker: MK en MO (TK = 80 + 0,5Q&#178;, P = &#8364;20)</text>

  <!-- Plot area: x=80..680, y=50..330
       Q range: 0..28, MK/MO range: 0..30
       px_per_Q = 600/28 = 21.43
       px_per_euro = 280/30 = 9.333
       q_to_x(q) = 80 + q * 21.43
       euro_to_y(v) = 330 - v * 9.333
  -->

  <!-- Grid -->
  <line x1="80" y1="237" x2="680" y2="237" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/>
  <line x1="80" y1="143" x2="680" y2="143" stroke="#E5E5E5" stroke-width="0.7" stroke-dasharray="4,3"/>

  <!-- Y-axis -->
  <line x1="80" y1="330" x2="80" y2="42" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,42 76,52 84,52" fill="#2D3748"/>
  <text x="15" y="190" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096" transform="rotate(-90,15,190)">Euro per stuk (&#8364;)</text>

  <!-- X-axis -->
  <line x1="80" y1="330" x2="685" y2="330" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="685,330 675,326 675,334" fill="#2D3748"/>
  <text x="380" y="385" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096">Hoeveelheid (Q)</text>

  <!-- Origin -->
  <text x="72" y="345" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">0</text>

  <!-- Y-axis ticks -->
  <line x1="75" y1="237" x2="80" y2="237" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="241" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">10</text>
  <line x1="75" y1="143" x2="80" y2="143" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="147" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">20</text>
  <line x1="75" y1="50" x2="80" y2="50" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="54" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">30</text>

  <!-- X-axis ticks -->
  <line x1="294.3" y1="330" x2="294.3" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="294.3" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">10</text>
  <line x1="508.6" y1="330" x2="508.6" y2="335" stroke="#2D3748" stroke-width="1"/>
  <text x="508.6" y="350" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">20</text>

  <!-- MO = P = 20: horizontal line at y = 330 - 20*9.333 = 143.3 -->
  <line x1="80" y1="143" x2="650" y2="143" stroke="#1A5276" stroke-width="2.5"/>
  <text x="656" y="139" font-family="Arial" font-size="12" font-weight="bold" fill="#1A5276">MO = 20</text>

  <!-- MK ≈ Q: from (0,0) to (28,28)
       Q=0: MK=0, y=330. Q=10: MK=10, y=237. Q=20: MK=20, y=143. Q=28: MK=28, y=68.7.
       x: 80, 294.3, 508.6, 680
  -->
  <line x1="80" y1="330" x2="680" y2="68.7" stroke="#E67E22" stroke-width="2.5"/>
  <text x="685" y="65" font-family="Arial" font-size="12" font-weight="bold" fill="#E67E22">MK</text>

  <!-- Intersection at Q=20: x=508.6, y=143 -->
  <circle cx="508.6" cy="143" r="5" fill="#2D3748"/>
  <line x1="508.6" y1="143" x2="508.6" y2="330" stroke="#2D3748" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Label -->
  <text x="508.6" y="130" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2D3748">MO = MK</text>
  <text x="508.6" y="368" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2D3748">Q* = 20</text>

  <!-- Winst zone shading -->
  <polygon points="80,143 508.6,143 80,330" fill="#27AE60" fill-opacity="0.12"/>
  <text x="230" y="260" text-anchor="middle" font-family="Arial" font-size="11" fill="#27AE60">MO &gt; MK</text>

  <!-- Sample dots -->
  <circle cx="294.3" cy="237" r="3.5" fill="#E67E22"/>
  <circle cx="508.6" cy="143" r="3.5" fill="#E67E22"/>

  <!-- Rule box -->
  <rect x="140" y="364" width="440" height="26" rx="4" fill="#EBF5FB" stroke="#1A5276" stroke-width="1"/>
  <text x="360" y="381" text-anchor="middle" font-family="Arial" font-size="10" fill="#1A5276">MO = MK &#8594; 20 = Q &#8594; Q* = 20 (winstmaximum bij &#8364;120)</text>
</svg>