<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial">
  <rect width="720" height="360" fill="#F7FAFC" rx="8"/>
  <text x="360" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2761">Opgave 5d: Verschuivingen in de schriftenmarkt</text>
  <!-- Using same coordinate system as theory figs -->
  <!-- Q range: 0..130, px_per_Q = 4.6154 -->
  <!-- P range: 0..60, px_per_P = 4.4167 -->

  <!-- Y-axis -->
  <line x1="80" y1="45" x2="80" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,40 76,48 84,48" fill="#2D3748"/>
  <!-- X-axis -->
  <line x1="80" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="685,310 677,306 677,314" fill="#2D3748"/>
  <!-- Y-axis label -->
  <text x="15" y="180" text-anchor="middle" font-size="12" fill="#718096" transform="rotate(-90, 15, 180)">Prijs (P)</text>
  <!-- Origin -->
  <text x="72" y="325" text-anchor="end" font-size="11" fill="#718096">0</text>

  <!-- LEFT HALF: Supply shift (a/b) -->
  <!-- V (solid blue): from (80, 89.2) to (541.5, 310) -->
  <line x1="80" y1="89.2" x2="541.5" y2="310" stroke="#1A5276" stroke-width="2"/>
  <text x="549" y="305" font-size="11" font-weight="bold" fill="#1A5276">V</text>

  <!-- A old (dashed orange): from (80, 273.2) to (656.9, 89.2) -->
  <line x1="80" y1="273.2" x2="656.9" y2="89.2" stroke="#E67E22" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="660" y="82" font-size="9" fill="#E67E22">A</text>

  <!-- A new (solid green): Qa'=3P-10, from (80, 295.3) to (656.9, 111.3) -->
  <line x1="80" y1="295.3" x2="656.9" y2="111.3" stroke="#27AE60" stroke-width="2"/>
  <text x="660" y="104" font-size="11" font-weight="bold" fill="#27AE60">A'</text>

  <!-- Old E: (310.8, 199.6) -->
  <circle cx="310.8" cy="199.6" r="3" fill="#CBD5E0"/>
  <line x1="310.8" y1="199.6" x2="80" y2="199.6" stroke="#CBD5E0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="310.8" y1="199.6" x2="310.8" y2="310" stroke="#CBD5E0" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- New E1: P=22, Q=56 → (338.5, 212.8) -->
  <circle cx="338.5" cy="212.8" r="4" fill="#2D3748"/>
  <line x1="338.5" y1="212.8" x2="80" y2="212.8" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="338.5" y1="212.8" x2="338.5" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="338.5" y="200.8" text-anchor="middle" font-size="10" font-weight="bold" fill="#2D3748">E'</text>

  <!-- Axis labels -->
  <text x="72" y="203.6" text-anchor="end" font-size="9" fill="#718096">25</text>
  <text x="72" y="216.8" text-anchor="end" font-size="9" fill="#2D3748">22</text>
  <text x="310.8" y="340" text-anchor="middle" font-size="9" fill="#718096">50</text>
  <text x="338.5" y="325" text-anchor="middle" font-size="9" fill="#2D3748">56</text>

  <!-- Supply shift arrow -->
  <line x1="500" y1="130" x2="545" y2="130" stroke="#27AE60" stroke-width="1.5"/>
  <polygon points="549,130 543,127 543,133" fill="#27AE60"/>
</svg>
