<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial">
  <rect width="720" height="360" fill="#F7FAFC" rx="8"/>
  <text x="360" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Figuur 3: Verschuiving van de vraaglijn naar rechts</text>
  <!-- Y-axis -->
  <line x1="80" y1="45" x2="80" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,40 76,48 84,48" fill="#2D3748"/>
  <!-- X-axis -->
  <line x1="80" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="685,310 677,306 677,314" fill="#2D3748"/>
  <!-- Y-axis label -->
  <text x="15" y="180" text-anchor="middle" font-size="12" fill="#718096" transform="rotate(-90, 15, 180)">Prijs (P)</text>
  <!-- Origin -->
  <text x="72" y="325" text-anchor="end" font-size="11" fill="#718096">0</text>

  <!-- V old: Qv = -2P + 100 (dashed orange) -->
  <!-- P=50→Q=0: (80, 89.2). P=0→Q=100: (541.5, 310) -->
  <line x1="80" y1="89.2" x2="541.5" y2="310" stroke="#E67E22" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="549" y="305" font-size="11" fill="#E67E22">V</text>

  <!-- V new: Qv' = -2P + 120 (solid blue) -->
  <!-- P=60→Q=0: (80, 45.0). P=0→Q=120: (633.8, 310) -->
  <line x1="80" y1="45.0" x2="633.8" y2="310" stroke="#1A5276" stroke-width="2"/>
  <text x="641" y="305" font-size="12" font-weight="bold" fill="#1A5276">V'</text>

  <!-- A: Qa = 3P - 25 (solid green) -->
  <line x1="80" y1="273.2" x2="656.9" y2="89.2" stroke="#27AE60" stroke-width="2"/>
  <text x="660" y="82" font-size="12" font-weight="bold" fill="#27AE60">A</text>

  <!-- Old equilibrium E: P=25, Q=50 → (310.8, 199.6) -->
  <line x1="310.8" y1="199.6" x2="80" y2="199.6" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="310.8" y1="199.6" x2="310.8" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="310.8" cy="199.6" r="3.5" fill="#CBD5E0"/>
  <text x="310.8" y="187.6" text-anchor="middle" font-size="10" fill="#718096">E</text>

  <!-- New equilibrium E': P=29, Q=62 → (366.2, 182.0) -->
  <line x1="366.2" y1="182.0" x2="80" y2="182.0" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="366.2" y1="182.0" x2="366.2" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="366.2" cy="182.0" r="4" fill="#2D3748"/>
  <text x="366.2" y="170.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">E'</text>

  <!-- Axis labels -->
  <text x="72" y="203.6" text-anchor="end" font-size="9" fill="#718096">P* = 25</text>
  <text x="72" y="186.0" text-anchor="end" font-size="9" fill="#2D3748">P*' = 29</text>
  <text x="310.8" y="340" text-anchor="middle" font-size="9" fill="#718096">50</text>
  <text x="366.2" y="325" text-anchor="middle" font-size="9" fill="#2D3748">62</text>

  <!-- Shift arrow: horizontal, in quiet zone at ~1/3 from V endpoint -->
  <!-- Place at P≈15 level on the demand curves -->
  <!-- V old at P=15: Q=-2*15+100=70 → x=80+70*4.6154=403.1, y=310-15*4.4167=243.8 -->
  <!-- V new at P=15: Q=-2*15+120=90 → x=80+90*4.6154=495.4 -->
  <line x1="403.1" y1="243.8" x2="483" y2="243.8" stroke="#1A5276" stroke-width="2"/>
  <polygon points="488,243.8 480,239.8 480,247.8" fill="#1A5276"/>
</svg>
