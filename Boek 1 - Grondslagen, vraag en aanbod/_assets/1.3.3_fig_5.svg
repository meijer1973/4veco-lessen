<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial">
  <rect width="720" height="360" fill="#F7FAFC" rx="8"/>
  <text x="360" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2761">Figuur 5: Verschuivingen en het effect op het evenwicht</text>

  <!-- Central hub -->
  <rect x="270" y="130" width="180" height="55" fill="#1E2761" rx="8"/>
  <text x="360" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Marktevenwicht</text>
  <text x="360" y="172" text-anchor="middle" font-size="10" fill="#E8E8E8">P* en Q*</text>

  <!-- Left branch: Aanbodverschuiving -->
  <rect x="30" y="40" width="180" height="40" fill="#E8F8F5" stroke="#27AE60" stroke-width="1.5" rx="6"/>
  <text x="120" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#27AE60">Aanbod verschuift</text>

  <!-- Factors for A -->
  <rect x="15" y="95" width="90" height="28" fill="#FFFFFF" stroke="#27AE60" stroke-width="1" rx="4"/>
  <text x="60" y="113" text-anchor="middle" font-size="8.5" fill="#2D3748">Grondstofprijzen</text>
  <rect x="115" y="95" width="90" height="28" fill="#FFFFFF" stroke="#27AE60" stroke-width="1" rx="4"/>
  <text x="160" y="113" text-anchor="middle" font-size="8.5" fill="#2D3748">Technologie</text>

  <!-- Arrow from A box to hub -->
  <line x1="210" y1="60" x2="268" y2="145" stroke="#27AE60" stroke-width="1.5"/>
  <polygon points="270,148 264,140 272,140" fill="#27AE60"/>

  <!-- A shift right result -->
  <rect x="30" y="200" width="180" height="50" fill="#FFFFFF" stroke="#27AE60" stroke-width="1" rx="4"/>
  <text x="120" y="218" text-anchor="middle" font-size="9.5" fill="#27AE60" font-weight="bold">A → rechts (meer aanbod)</text>
  <text x="120" y="233" text-anchor="middle" font-size="9" fill="#2D3748">P* daalt, Q* stijgt</text>
  <!-- A shift left result -->
  <rect x="30" y="260" width="180" height="50" fill="#FFFFFF" stroke="#27AE60" stroke-width="1" rx="4"/>
  <text x="120" y="278" text-anchor="middle" font-size="9.5" fill="#27AE60" font-weight="bold">A ← links (minder aanbod)</text>
  <text x="120" y="293" text-anchor="middle" font-size="9" fill="#2D3748">P* stijgt, Q* daalt</text>

  <!-- Arrow from hub to A results -->
  <line x1="280" y1="185" x2="210" y2="210" stroke="#27AE60" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Right branch: Vraagverschuiving -->
  <rect x="510" y="40" width="180" height="40" fill="#EBF5FB" stroke="#1A5276" stroke-width="1.5" rx="6"/>
  <text x="600" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5276">Vraag verschuift</text>

  <!-- Factors for V -->
  <rect x="510" y="95" width="80" height="28" fill="#FFFFFF" stroke="#1A5276" stroke-width="1" rx="4"/>
  <text x="550" y="113" text-anchor="middle" font-size="8.5" fill="#2D3748">Inkomen</text>
  <rect x="600" y="95" width="90" height="28" fill="#FFFFFF" stroke="#1A5276" stroke-width="1" rx="4"/>
  <text x="645" y="113" text-anchor="middle" font-size="8.5" fill="#2D3748">Voorkeuren</text>

  <!-- Arrow from V box to hub -->
  <line x1="510" y1="60" x2="452" y2="145" stroke="#1A5276" stroke-width="1.5"/>
  <polygon points="450,148 448,140 456,140" fill="#1A5276"/>

  <!-- V shift right result -->
  <rect x="510" y="200" width="180" height="50" fill="#FFFFFF" stroke="#1A5276" stroke-width="1" rx="4"/>
  <text x="600" y="218" text-anchor="middle" font-size="9.5" fill="#1A5276" font-weight="bold">V → rechts (meer vraag)</text>
  <text x="600" y="233" text-anchor="middle" font-size="9" fill="#2D3748">P* stijgt, Q* stijgt</text>
  <!-- V shift left result -->
  <rect x="510" y="260" width="180" height="50" fill="#FFFFFF" stroke="#1A5276" stroke-width="1" rx="4"/>
  <text x="600" y="278" text-anchor="middle" font-size="9.5" fill="#1A5276" font-weight="bold">V ← links (minder vraag)</text>
  <text x="600" y="293" text-anchor="middle" font-size="9" fill="#2D3748">P* daalt, Q* daalt</text>

  <!-- Arrow from hub to V results -->
  <line x1="440" y1="185" x2="510" y2="210" stroke="#1A5276" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Bottom: simultaneous shift warning -->
  <rect x="200" y="325" width="320" height="30" fill="#FEF3E2" stroke="#E67E22" stroke-width="1.5" rx="4"/>
  <text x="360" y="344" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#E67E22">Beide tegelijk? → Q-effect duidelijk, P-effect onzeker!</text>
</svg>