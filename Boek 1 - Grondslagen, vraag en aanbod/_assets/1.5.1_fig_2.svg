<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial">
  <!-- Background -->
  <rect width="720" height="360" fill="#F7FAFC" rx="8"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Vraaglijn, consumentensurplus en verschuiving</text>

  <!-- Axes -->
  <line x1="80" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="2"/>
  <line x1="80" y1="310" x2="80" y2="45" stroke="#2D3748" stroke-width="2"/>
  <!-- Arrowheads -->
  <polygon points="680,310 672,306 672,314" fill="#2D3748"/>
  <polygon points="80,45 76,53 84,53" fill="#2D3748"/>

  <!-- Axis labels -->
  <text x="15" y="180" text-anchor="middle" font-size="12" fill="#718096" transform="rotate(-90, 15, 180)">Prijs (P)</text>
  <text x="380" y="345" text-anchor="middle" font-size="12" fill="#718096">Hoeveelheid (Q)</text>
  <text x="72" y="325" text-anchor="end" font-size="10" fill="#718096">0</text>

  <!-- Demand line V1: from (80,70) to (580,290) — P=50 at Q=0 to P=5 at Q=500 -->
  <!-- Economically: Qv = -10P + 500 => P = 50 - 0.1Q -->
  <!-- Pixel mapping: P range 0..50 -> y 310..60; Q range 0..500 -> x 80..580 -->
  <!-- At P=50: y=60, Q=0: x=80 => (80,60) -->
  <!-- At P=0: y=310, Q=500: x=580 => (580,310) -->

  <!-- Consumer surplus area (triangle above price line, below demand) -->
  <!-- Price line at P=20 => y = 310 - (20/50)*250 = 310 - 100 = 210 -->
  <!-- At P=20: Q = -10*20+500 = 300 => x = 80 + (300/500)*500 = 80 + 300 = 380 -->
  <polygon points="80,60 380,210 80,210" fill="#85C1E9" fill-opacity="0.45"/>

  <!-- Demand line V1 -->
  <line x1="80" y1="60" x2="580" y2="310" stroke="#1A5276" stroke-width="2.5"/>
  <text x="588" y="306" font-size="12" font-weight="bold" fill="#1A5276">V</text>

  <!-- Shifted demand V2: parallel shift right by 100 units => Qv = -10P + 600 -->
  <!-- At P=50: Q=100 => x = 80+100=180, y=60 => (180,60) -->
  <!-- At P=0: Q=600 => x = 80+600=680, but clip to plot area, at x=680: Q=600, P=0 => (680,310) -->
  <!-- At P=10/60*50≈8.33: Q=516.7 at x=596.7 => just use (680,310) endpoint -->
  <line x1="180" y1="60" x2="680" y2="310" stroke="#1A5276" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="685" y="306" font-size="12" font-weight="bold" fill="#1A5276">V'</text>

  <!-- Price line at P=20 -->
  <line x1="80" y1="210" x2="580" y2="210" stroke="#E67E22" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="72" y="214" text-anchor="end" font-size="10" fill="#E67E22">P = 20</text>

  <!-- Equilibrium point on V at P=20 -->
  <circle cx="380" cy="210" r="4" fill="#E74C3C"/>

  <!-- Dashed lines from equilibrium to axes -->
  <line x1="380" y1="210" x2="380" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="380" y="325" text-anchor="middle" font-size="10" fill="#2D3748">Q = 300</text>

  <!-- CS label -->
  <text x="170" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5276">CS</text>

  <!-- Shift arrow (horizontal, between V and V' at y=130) -->
  <!-- At y=130: V is at x≈220, V' is at x≈320. Arrow between them. -->
  <line x1="235" y1="130" x2="305" y2="130" stroke="#1E8449" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="270" y="122" text-anchor="middle" font-size="10" fill="#1E8449">verschuiving</text>

  <!-- BB label at top of demand -->
  <text x="72" y="64" text-anchor="end" font-size="10" fill="#1A5276">BB max</text>

  <!-- Legend box -->
  <rect x="500" y="52" width="190" height="68" rx="4" fill="#ffffff" fill-opacity="0.9" stroke="#CBD5E0" stroke-width="1"/>
  <text x="510" y="70" font-size="10" fill="#2D3748">Prijsverandering:</text>
  <text x="520" y="84" font-size="10" font-weight="bold" fill="#E67E22">beweging LANGS V</text>
  <text x="510" y="100" font-size="10" fill="#2D3748">Andere factor:</text>
  <text x="520" y="114" font-size="10" font-weight="bold" fill="#1E8449">verschuiving VAN V</text>

  <!-- Arrowhead definitions -->
  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1E8449"/>
    </marker>
  </defs>
</svg>