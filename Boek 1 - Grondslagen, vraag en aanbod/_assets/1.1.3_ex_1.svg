<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial">
  <!-- Background -->
  <rect width="720" height="400" fill="#F7FAFC" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Opgave 1: Broodjesverkoop</text>

  <!-- Plot area: x=80..680, y=45..340 -->
  <!-- Data: broodjes sold at different prices -->
  <!-- P=2.00 → Q=300 -->
  <!-- P=2.50 → Q=250 -->
  <!-- P=3.00 → Q=200 -->
  <!-- P=3.50 → Q=150 -->
  <!-- P=4.00 → Q=100 -->

  <!-- X scale: Q 0..400, x=80..680 → per unit: 600/400 = 1.5px -->
  <!-- Y scale: P 0..5.00, y=340..45 → per euro: 295/5 = 59px -->

  <!-- Q=100 → x=80+100*1.5=230 -->
  <!-- Q=150 → x=80+150*1.5=305 -->
  <!-- Q=200 → x=80+200*1.5=380 -->
  <!-- Q=250 → x=80+250*1.5=455 -->
  <!-- Q=300 → x=80+300*1.5=530 -->

  <!-- P=1.00 → y=340-1.00*59=281 -->
  <!-- P=2.00 → y=340-2.00*59=222 -->
  <!-- P=2.50 → y=340-2.50*59=192.5 ≈ 193 -->
  <!-- P=3.00 → y=340-3.00*59=163 -->
  <!-- P=3.50 → y=340-3.50*59=133.5 ≈ 134 -->
  <!-- P=4.00 → y=340-4.00*59=104 -->

  <!-- Y-axis -->
  <line x1="80" y1="340" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>

  <!-- X-axis -->
  <line x1="80" y1="340" x2="680" y2="340" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="680,340 670,336 670,344" fill="#2D3748"/>

  <!-- Y-axis label -->
  <text x="15" y="195" text-anchor="middle" font-size="12" fill="#718096" transform="rotate(-90, 15, 195)">Prijs (€)</text>

  <!-- X-axis label -->
  <text x="380" y="385" text-anchor="middle" font-size="12" fill="#718096">Hoeveelheid (broodjes per week)</text>

  <!-- Origin -->
  <text x="72" y="355" text-anchor="end" font-size="11" fill="#718096">0</text>

  <!-- Y-axis ticks -->
  <line x1="76" y1="281" x2="80" y2="281" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="285" text-anchor="end" font-size="10" fill="#718096">1,00</text>
  <line x1="80" y1="281" x2="680" y2="281" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>

  <line x1="76" y1="222" x2="80" y2="222" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="226" text-anchor="end" font-size="10" fill="#718096">2,00</text>
  <line x1="80" y1="222" x2="680" y2="222" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>

  <line x1="76" y1="163" x2="80" y2="163" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="167" text-anchor="end" font-size="10" fill="#718096">3,00</text>
  <line x1="80" y1="163" x2="680" y2="163" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>

  <line x1="76" y1="104" x2="80" y2="104" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="108" text-anchor="end" font-size="10" fill="#718096">4,00</text>
  <line x1="80" y1="104" x2="680" y2="104" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- X-axis ticks -->
  <line x1="230" y1="340" x2="230" y2="344" stroke="#2D3748" stroke-width="1"/>
  <text x="230" y="358" text-anchor="middle" font-size="10" fill="#718096">100</text>
  <line x1="230" y1="45" x2="230" y2="340" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>

  <line x1="380" y1="340" x2="380" y2="344" stroke="#2D3748" stroke-width="1"/>
  <text x="380" y="358" text-anchor="middle" font-size="10" fill="#718096">200</text>
  <line x1="380" y1="45" x2="380" y2="340" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>

  <line x1="530" y1="340" x2="530" y2="344" stroke="#2D3748" stroke-width="1"/>
  <text x="530" y="358" text-anchor="middle" font-size="10" fill="#718096">300</text>
  <line x1="530" y1="45" x2="530" y2="340" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Data line -->
  <polyline points="530,222 455,193 380,163 305,134 230,104" fill="none" stroke="#1A5276" stroke-width="2.5"/>

  <!-- Data points -->
  <circle cx="530" cy="222" r="5" fill="#1A5276"/>
  <circle cx="455" cy="193" r="5" fill="#1A5276"/>
  <circle cx="380" cy="163" r="5" fill="#1A5276"/>
  <circle cx="305" cy="134" r="5" fill="#1A5276"/>
  <circle cx="230" cy="104" r="5" fill="#1A5276"/>

  <!-- Data point labels -->
  <text x="540" y="216" font-size="9" fill="#1A5276">(300; €2,00)</text>
  <text x="465" y="187" font-size="9" fill="#1A5276">(250; €2,50)</text>
  <text x="390" y="157" font-size="9" fill="#1A5276">(200; €3,00)</text>
  <text x="315" y="128" font-size="9" fill="#1A5276">(150; €3,50)</text>
  <text x="240" y="98" font-size="9" fill="#1A5276">(100; €4,00)</text>
</svg>