<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="400" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2D3748">Tarwe versus maïs — alternatieve kosten</text>

  <!-- Y-axis -->
  <line x1="100" y1="345" x2="100" y2="50" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="100,50 96,60 104,60" fill="#2D3748"/>
  <text x="28" y="200" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748" transform="rotate(-90,28,200)">Totale winst (€)</text>

  <!-- X-axis -->
  <line x1="100" y1="345" x2="620" y2="345" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="620,345 610,341 610,349" fill="#2D3748"/>

  <!-- Origin -->
  <text x="92" y="362" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">0</text>

  <!-- Y-axis ticks (€0 to €6.000, step 1000) — 1000€ = 50px -->
  <line x1="95" y1="295" x2="100" y2="295" stroke="#2D3748" stroke-width="1"/>
  <text x="88" y="299" text-anchor="end" font-family="Arial" font-size="12" fill="#2D3748">€1.000</text>
  <line x1="95" y1="245" x2="100" y2="245" stroke="#2D3748" stroke-width="1"/>
  <text x="88" y="249" text-anchor="end" font-family="Arial" font-size="12" fill="#2D3748">€2.000</text>
  <line x1="95" y1="195" x2="100" y2="195" stroke="#2D3748" stroke-width="1"/>
  <text x="88" y="199" text-anchor="end" font-family="Arial" font-size="12" fill="#2D3748">€3.000</text>
  <line x1="95" y1="145" x2="100" y2="145" stroke="#2D3748" stroke-width="1"/>
  <text x="88" y="149" text-anchor="end" font-family="Arial" font-size="12" fill="#2D3748">€4.000</text>
  <line x1="95" y1="95" x2="100" y2="95" stroke="#2D3748" stroke-width="1"/>
  <text x="88" y="99" text-anchor="end" font-family="Arial" font-size="12" fill="#2D3748">€5.000</text>

  <!-- Gridlines -->
  <line x1="100" y1="295" x2="580" y2="295" stroke="#E0E0E0" stroke-width="0.5"/>
  <line x1="100" y1="245" x2="580" y2="245" stroke="#E0E0E0" stroke-width="0.5"/>
  <line x1="100" y1="195" x2="580" y2="195" stroke="#E0E0E0" stroke-width="0.5"/>
  <line x1="100" y1="145" x2="580" y2="145" stroke="#E0E0E0" stroke-width="0.5"/>
  <line x1="100" y1="95" x2="580" y2="95" stroke="#E0E0E0" stroke-width="0.5"/>

  <!-- Bar 1: Tarwe (GEKOZEN) - Blue -->
  <rect x="160" y="95" width="150" height="250" fill="#1A5276" opacity="0.7" stroke="#1A5276" stroke-width="1.5"/>
  <text x="235" y="82" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#1A5276">€5.000</text>
  <text x="235" y="370" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">Tarwe (10 ha)</text>

  <!-- Chosen label: solid green badge with white text -->
  <rect x="190" y="175" width="90" height="26" rx="4" fill="#27AE60"/>
  <text x="235" y="193" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF">GEKOZEN</text>

  <!-- Bar 2: Maïs (NIET GEKOZEN) - Orange dashed -->
  <rect x="390" y="170" width="150" height="175" fill="#E67E22" opacity="0.3" stroke="#E67E22" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="465" y="157" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#E67E22">€3.500</text>
  <text x="465" y="370" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">Maïs (10 ha)</text>

  <!-- Alternatieve kosten label: solid orange badge with white text -->
  <rect x="400" y="235" width="130" height="40" rx="4" fill="#E67E22"/>
  <text x="465" y="253" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#FFFFFF">ALTERNATIEVE</text>
  <text x="465" y="268" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#FFFFFF">KOSTEN</text>

  <!-- Brace between bars showing the difference -->
  <line x1="340" y1="95" x2="360" y2="95" stroke="#27AE60" stroke-width="1.5"/>
  <line x1="360" y1="95" x2="360" y2="170" stroke="#27AE60" stroke-width="1.5"/>
  <line x1="340" y1="170" x2="360" y2="170" stroke="#27AE60" stroke-width="1.5"/>
  <text x="375" y="137" text-anchor="start" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60">+€1.500</text>
  <text x="375" y="153" text-anchor="start" font-family="Arial" font-size="11" fill="#27AE60">voordeel</text>
</svg>