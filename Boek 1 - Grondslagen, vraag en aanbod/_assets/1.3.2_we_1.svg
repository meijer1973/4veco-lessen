<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial">
  <rect width="720" height="360" fill="#F7FAFC" rx="8"/>
  <text x="360" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Uitgewerkt voorbeeld: markt voor pennen</text>
  <!-- Y-axis -->
  <line x1="80" y1="45" x2="80" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,40 76,48 84,48" fill="#2D3748"/>
  <!-- X-axis -->
  <line x1="80" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="685,310 677,306 677,314" fill="#2D3748"/>
  <!-- Y-axis label -->
  <text x="15" y="180" text-anchor="middle" font-size="12" fill="#718096" transform="rotate(-90, 15, 180)">Prijs (P)</text>
  <!-- Origin -->
  <text x="72" y="325" text-anchor="end" font-size="11" fill="#718096">0</text>
  <line x1="80.0" y1="82.9" x2="620.0" y2="310.0" stroke="#1A5276" stroke-width="2"/>
  <text x="628.0" y="305.0" font-size="12" font-weight="bold" fill="#1A5276">V</text>
  <line x1="80.0" y1="272.1" x2="440.0" y2="45.0" stroke="#27AE60" stroke-width="2"/>
  <text x="435.0" y="37.0" font-size="12" font-weight="bold" fill="#27AE60">A</text>
  <line x1="260.0" y1="158.6" x2="80" y2="158.6" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="260.0" y1="158.6" x2="260.0" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="260.0" cy="158.6" r="4" fill="#2D3748"/>
  <text x="260.0" y="146.6" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">E</text>
  <text x="72" y="162.6" text-anchor="end" font-size="11" fill="#718096">P* = 20</text>
  <text x="260.0" y="325" text-anchor="middle" font-size="11" fill="#718096">Q* = 30</text>
  <text x="72" y="86.9" text-anchor="end" font-size="10" fill="#718096">30</text>
  <text x="72" y="276.1" text-anchor="end" font-size="10" fill="#718096">5</text>
  <text x="620.0" y="325" text-anchor="middle" font-size="10" fill="#718096">90</text>
</svg>