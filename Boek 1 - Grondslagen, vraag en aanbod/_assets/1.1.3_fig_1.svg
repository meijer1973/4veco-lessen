<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial">
  <!-- Background -->
  <rect width="720" height="400" fill="#F7FAFC" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Figuur 1: Prijs en hoeveelheid ijsjesverkoop</text>

  <!-- Plot area: x=80..680, y=45..340 -->

  <!-- Y-axis -->
  <line x1="80" y1="340" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>

  <!-- X-axis -->
  <line x1="80" y1="340" x2="680" y2="340" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="680,340 670,336 670,344" fill="#2D3748"/>

  <!-- Y-axis label -->
  <text x="15" y="195" text-anchor="middle" font-size="12" fill="#718096" transform="rotate(-90, 15, 195)">Prijs (€)</text>

  <!-- X-axis label -->
  <text x="380" y="385" text-anchor="middle" font-size="12" fill="#718096">Hoeveelheid (Q)</text>

  <!-- Origin -->
  <text x="72" y="355" text-anchor="end" font-size="11" fill="#718096">0</text>

  <!-- Y-axis tick marks and labels: €0.50, €1.00, €1.50, €2.00, €2.50, €3.00 -->
  <!-- Scale: y=340 is P=0, y=45 is P=3.50. Per euro: (340-45)/3.5 = 84.3px -->
  <!-- P=0.50 → y=340-0.50*84.3=297.9 -->
  <!-- P=1.00 → y=340-1.00*84.3=255.7 -->
  <!-- P=1.50 → y=340-1.50*84.3=213.6 -->
  <!-- P=2.00 → y=340-2.00*84.3=171.4 -->
  <!-- P=2.50 → y=340-2.50*84.3=129.3 -->
  <!-- P=3.00 → y=340-3.00*84.3=87.1 -->

  <line x1="76" y1="298" x2="80" y2="298" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="302" text-anchor="end" font-size="10" fill="#718096">0,50</text>

  <line x1="76" y1="256" x2="80" y2="256" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="260" text-anchor="end" font-size="10" fill="#718096">1,00</text>

  <line x1="76" y1="214" x2="80" y2="214" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="218" text-anchor="end" font-size="10" fill="#718096">1,50</text>

  <line x1="76" y1="171" x2="80" y2="171" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="175" text-anchor="end" font-size="10" fill="#718096">2,00</text>

  <line x1="76" y1="129" x2="80" y2="129" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="133" text-anchor="end" font-size="10" fill="#718096">2,50</text>

  <line x1="76" y1="87" x2="80" y2="87" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="91" text-anchor="end" font-size="10" fill="#718096">3,00</text>

  <!-- Grid lines (light) -->
  <line x1="80" y1="298" x2="680" y2="298" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="256" x2="680" y2="256" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="214" x2="680" y2="214" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="171" x2="680" y2="171" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="129" x2="680" y2="129" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="87" x2="680" y2="87" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- X-axis tick marks and labels: 100, 200, 300, 400, 500 -->
  <!-- Scale: x=80 is Q=0, x=680 is Q=600. Per 100: (680-80)/6 = 100px -->
  <!-- Q=100 → x=180, Q=200 → x=280, Q=300 → x=380, Q=400 → x=480, Q=500 → x=580 -->

  <line x1="180" y1="340" x2="180" y2="344" stroke="#2D3748" stroke-width="1"/>
  <text x="180" y="358" text-anchor="middle" font-size="10" fill="#718096">100</text>

  <line x1="280" y1="340" x2="280" y2="344" stroke="#2D3748" stroke-width="1"/>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#718096">200</text>

  <line x1="380" y1="340" x2="380" y2="344" stroke="#2D3748" stroke-width="1"/>
  <text x="380" y="358" text-anchor="middle" font-size="10" fill="#718096">300</text>

  <line x1="480" y1="340" x2="480" y2="344" stroke="#2D3748" stroke-width="1"/>
  <text x="480" y="358" text-anchor="middle" font-size="10" fill="#718096">400</text>

  <line x1="580" y1="340" x2="580" y2="344" stroke="#2D3748" stroke-width="1"/>
  <text x="580" y="358" text-anchor="middle" font-size="10" fill="#718096">500</text>

  <!-- Vertical grid lines -->
  <line x1="180" y1="45" x2="180" y2="340" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="280" y1="45" x2="280" y2="340" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="380" y1="45" x2="380" y2="340" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="480" y1="45" x2="480" y2="340" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="580" y1="45" x2="580" y2="340" stroke="#CBD5E0" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Data line: (Q=500,P=1.00) (Q=400,P=1.50) (Q=300,P=2.00) (Q=200,P=2.50) (Q=100,P=3.00) -->
  <!-- Pixel coords: -->
  <!-- (500,1.00) → (580, 256) -->
  <!-- (400,1.50) → (480, 214) -->
  <!-- (300,2.00) → (380, 171) -->
  <!-- (200,2.50) → (280, 129) -->
  <!-- (100,3.00) → (180, 87) -->

  <polyline points="580,256 480,214 380,171 280,129 180,87" fill="none" stroke="#1A5276" stroke-width="2.5"/>

  <!-- Data points -->
  <circle cx="580" cy="256" r="5" fill="#1A5276"/>
  <circle cx="480" cy="214" r="5" fill="#1A5276"/>
  <circle cx="380" cy="171" r="5" fill="#1A5276"/>
  <circle cx="280" cy="129" r="5" fill="#1A5276"/>
  <circle cx="180" cy="87" r="5" fill="#1A5276"/>

  <!-- Data point labels -->
  <text x="595" y="252" font-size="9" fill="#1A5276">(500; €1,00)</text>
  <text x="495" y="210" font-size="9" fill="#1A5276">(400; €1,50)</text>
  <text x="395" y="167" font-size="9" fill="#1A5276">(300; €2,00)</text>
  <text x="295" y="125" font-size="9" fill="#1A5276">(200; €2,50)</text>
  <text x="195" y="83" font-size="9" fill="#1A5276">(100; €3,00)</text>
</svg>