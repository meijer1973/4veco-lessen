<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial">
  <rect width="720" height="360" fill="#F7FAFC" rx="8"/>
  <text x="360" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Figuur 3: Marktevenwicht (P* = 25, Q* = 50)</text>
  <!-- Y-axis -->
  <line x1="80" y1="45" x2="80" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,40 76,48 84,48" fill="#2D3748"/>
  <!-- X-axis -->
  <line x1="80" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="685,310 677,306 677,314" fill="#2D3748"/>
  <!-- Y-axis label -->
  <text x="15" y="180" text-anchor="middle" font-size="12" fill="#718096" transform="rotate(-90, 15, 180)">Prijs (P)</text>
  <!-- Origin -->
  <text x="72" y="325" text-anchor="end" font-size="11" fill="#718096">0</text>
  <line x1="80.0" y1="69.1" x2="625.5" y2="310.0" stroke="#1A5276" stroke-width="2"/>
  <text x="633.5" y="305.0" font-size="12" font-weight="bold" fill="#1A5276">V</text>
  <line x1="80.0" y1="269.8" x2="680.0" y2="93.2" stroke="#27AE60" stroke-width="2"/>
  <text x="675.0" y="85.2" font-size="12" font-weight="bold" fill="#27AE60">A</text>
  <!-- Equilibrium dashed lines -->
  <line x1="352.7" y1="189.5" x2="80" y2="189.5" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="352.7" y1="189.5" x2="352.7" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <!-- Equilibrium dot -->
  <circle cx="352.7" cy="189.5" r="4" fill="#2D3748"/>
  <!-- Label straight above -->
  <text x="352.7" y="177.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">E</text>
  <!-- Axis labels -->
  <text x="72" y="193.5" text-anchor="end" font-size="11" fill="#718096">P* = 25</text>
  <text x="352.7" y="325" text-anchor="middle" font-size="11" fill="#718096">Q* = 50</text>
  <text x="72" y="73.1" text-anchor="end" font-size="10" fill="#718096">50</text>
  <line x1="77" y1="69.1" x2="80" y2="69.1" stroke="#2D3748" stroke-width="1"/>
