<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial">
  <rect width="720" height="360" fill="#F7FAFC" rx="8"/>
  <text x="360" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Figuur 1: De schriftenmarkt in evenwicht</text>
  <!-- Y-axis -->
  <line x1="80" y1="45" x2="80" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,40 76,48 84,48" fill="#2D3748"/>
  <!-- X-axis -->
  <line x1="80" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="685,310 677,306 677,314" fill="#2D3748"/>
  <!-- Y-axis label -->
  <text x="15" y="180" text-anchor="middle" font-size="12" fill="#718096" transform="rotate(-90, 15, 180)">Prijs (P)</text>
  <!-- Origin -->
  <text x="72" y="325" text-anchor="end" font-size="11" fill="#718096">0</text>

  <!-- V: Qv = -2P + 100 — from (P=50,Q=0) to (P=0,Q=100) -->
  <line x1="80" y1="89.2" x2="541.5" y2="310" stroke="#1A5276" stroke-width="2"/>
  <text x="549" y="305" font-size="12" font-weight="bold" fill="#1A5276">V</text>

  <!-- A: Qa = 3P - 25 — from (Q=0,P=8.33) to (Q=125,P=50) -->
  <line x1="80" y1="273.2" x2="656.9" y2="89.2" stroke="#27AE60" stroke-width="2"/>
  <text x="660" y="82" font-size="12" font-weight="bold" fill="#27AE60">A</text>

  <!-- Equilibrium dashed lines -->
  <line x1="310.8" y1="199.6" x2="80" y2="199.6" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="310.8" y1="199.6" x2="310.8" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="5,4"/>
  <!-- Equilibrium dot -->
  <circle cx="310.8" cy="199.6" r="4" fill="#2D3748"/>
  <!-- Label straight above -->
  <text x="310.8" y="187.6" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D3748">E</text>

  <!-- Axis labels -->
  <text x="72" y="203.6" text-anchor="end" font-size="10" fill="#718096">P* = 25</text>
  <text x="310.8" y="325" text-anchor="middle" font-size="10" fill="#718096">Q* = 50</text>
  <!-- Y-intercept labels -->
  <text x="72" y="93.2" text-anchor="end" font-size="10" fill="#718096">50</text>
  <line x1="77" y1="89.2" x2="80" y2="89.2" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="277.2" text-anchor="end" font-size="9" fill="#718096">8⅓</text>
  <line x1="77" y1="273.2" x2="80" y2="273.2" stroke="#2D3748" stroke-width="1"/>
</svg>
