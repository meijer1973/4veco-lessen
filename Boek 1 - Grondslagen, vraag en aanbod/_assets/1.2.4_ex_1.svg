<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="420" rx="8" fill="#F7FAFC"/>
  <text x="360" y="25" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2D3748">Individuele vraag naar ijsjes — Daan en Sanne</text>

  <!-- Y-axis (P) -->
  <line x1="80" y1="350" x2="80" y2="55" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,55 76,65 84,65" fill="#2D3748"/>
  <text x="15" y="200" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748" transform="rotate(-90, 15, 200)">Prijs (&#8364;)</text>

  <!-- X-axis (Q) -->
  <line x1="80" y1="350" x2="620" y2="350" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="620,350 610,346 610,354" fill="#2D3748"/>
  <text x="350" y="395" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748">Hoeveelheid ijsjes</text>

  <text x="72" y="365" text-anchor="end" font-family="Arial" font-size="14" fill="#2D3748">0</text>

  <!-- Plot: origin (80,350), px_per_Q=45, px_per_P=49
       P range 0..6, Q range 0..12
       P ticks: 1..5 at y=301,252,203,154,105
       Q ticks: 2,4,6,8,10 at x=170,260,350,440,530

       Daan: Qd = -2P + 10. P=0,Q=10 -> (530,350); P=5,Q=0 -> (80,105)
       Sanne: Qd = -P + 4.  P=0,Q=4  -> (260,350); P=4,Q=0 -> (80,154)

       At P=2 (y=252): Daan Q=6 (350,252), Sanne Q=2 (170,252)
  -->

  <!-- P tick marks -->
  <line x1="75" y1="301" x2="85" y2="301" stroke="#2D3748" stroke-width="1"/>
  <text x="70" y="306" text-anchor="end" font-family="Arial" font-size="14" fill="#2D3748">&#8364;1</text>
  <line x1="75" y1="252" x2="85" y2="252" stroke="#2D3748" stroke-width="1"/>
  <text x="70" y="257" text-anchor="end" font-family="Arial" font-size="14" fill="#2D3748">&#8364;2</text>
  <line x1="75" y1="203" x2="85" y2="203" stroke="#2D3748" stroke-width="1"/>
  <text x="70" y="208" text-anchor="end" font-family="Arial" font-size="14" fill="#2D3748">&#8364;3</text>
  <line x1="75" y1="154" x2="85" y2="154" stroke="#2D3748" stroke-width="1"/>
  <text x="70" y="159" text-anchor="end" font-family="Arial" font-size="14" fill="#2D3748">&#8364;4</text>
  <line x1="75" y1="105" x2="85" y2="105" stroke="#2D3748" stroke-width="1"/>
  <text x="70" y="110" text-anchor="end" font-family="Arial" font-size="14" fill="#2D3748">&#8364;5</text>

  <!-- Q tick marks -->
  <line x1="170" y1="345" x2="170" y2="355" stroke="#2D3748" stroke-width="1"/>
  <text x="170" y="370" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">2</text>
  <line x1="260" y1="345" x2="260" y2="355" stroke="#2D3748" stroke-width="1"/>
  <text x="260" y="370" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">4</text>
  <line x1="350" y1="345" x2="350" y2="355" stroke="#2D3748" stroke-width="1"/>
  <text x="350" y="370" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">6</text>
  <line x1="440" y1="345" x2="440" y2="355" stroke="#2D3748" stroke-width="1"/>
  <text x="440" y="370" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">8</text>
  <line x1="530" y1="345" x2="530" y2="355" stroke="#2D3748" stroke-width="1"/>
  <text x="530" y="370" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">10</text>

  <!-- V_Daan: Q = -2P + 10. Line from (530,350) to (80,105) -->
  <line x1="80" y1="105" x2="530" y2="350" stroke="#1A5276" stroke-width="2.5"/>
  <text x="540" y="348" font-family="Arial" font-size="15" font-weight="bold" fill="#1A5276">V_Daan</text>

  <!-- V_Sanne: Q = -P + 4. Line from (260,350) to (80,154) -->
  <line x1="80" y1="154" x2="260" y2="350" stroke="#27AE60" stroke-width="2.5"/>
  <text x="268" y="348" font-family="Arial" font-size="15" font-weight="bold" fill="#27AE60">V_Sanne</text>

  <!-- Dashed line at P=2 (y=252) -->
  <line x1="80" y1="252" x2="355" y2="252" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Sample dots at P=2 -->
  <circle cx="170" cy="252" r="5" fill="#27AE60"/>
  <circle cx="350" cy="252" r="5" fill="#1A5276"/>

  <!-- Quantity labels at P=2 -->
  <text x="170" y="240" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#27AE60">2</text>
  <text x="350" y="240" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1A5276">6</text>
</svg>
