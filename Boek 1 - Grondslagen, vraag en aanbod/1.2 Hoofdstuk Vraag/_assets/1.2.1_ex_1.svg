<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="400" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2D3748">Emma's betalingsbereidheid voor boeken</text>

  <!-- Y-axis -->
  <line x1="80" y1="345" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>
  <text x="18" y="200" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748" transform="rotate(-90,18,200)">Prijs (€)</text>

  <!-- X-axis -->
  <line x1="80" y1="345" x2="680" y2="345" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="680,345 670,341 670,349" fill="#2D3748"/>
  <text x="380" y="390" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748">Aantal boeken</text>

  <!-- Origin -->
  <text x="72" y="360" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">0</text>

  <!-- Y-axis ticks (€0 to €8, each €1 = 37.5px) -->
  <line x1="75" y1="307" x2="80" y2="307" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="311" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€1</text>
  <line x1="75" y1="270" x2="80" y2="270" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="274" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€2</text>
  <line x1="75" y1="232" x2="80" y2="232" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="236" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€3</text>
  <line x1="75" y1="195" x2="80" y2="195" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="199" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€4</text>
  <line x1="75" y1="157" x2="80" y2="157" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="161" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€5</text>
  <line x1="75" y1="120" x2="80" y2="120" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="124" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€6</text>
  <line x1="75" y1="82" x2="80" y2="82" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="86" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€7</text>
  <line x1="75" y1="45" x2="80" y2="45" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="49" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€8</text>

  <!-- X-axis ticks -->
  <line x1="200" y1="345" x2="200" y2="350" stroke="#2D3748" stroke-width="1"/>
  <text x="200" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">1</text>
  <line x1="320" y1="345" x2="320" y2="350" stroke="#2D3748" stroke-width="1"/>
  <text x="320" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">2</text>
  <line x1="440" y1="345" x2="440" y2="350" stroke="#2D3748" stroke-width="1"/>
  <text x="440" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">3</text>
  <line x1="560" y1="345" x2="560" y2="350" stroke="#2D3748" stroke-width="1"/>
  <text x="560" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">4</text>

  <!-- Step function: Emma €7, €5, €3, €1 -->
  <polyline points="80,82 200,82 200,157 320,157 320,232 440,232 440,307 560,307"
            fill="none" stroke="#1A5276" stroke-width="2.5"/>

  <!-- Points -->
  <circle cx="80" cy="82" r="4" fill="#1A5276"/>
  <circle cx="200" cy="82" r="4" fill="#1A5276"/>
  <circle cx="200" cy="157" r="4" fill="#1A5276"/>
  <circle cx="320" cy="157" r="4" fill="#1A5276"/>
  <circle cx="320" cy="232" r="4" fill="#1A5276"/>
  <circle cx="440" cy="232" r="4" fill="#1A5276"/>
  <circle cx="440" cy="307" r="4" fill="#1A5276"/>
  <circle cx="560" cy="307" r="4" fill="#1A5276"/>

  <!-- Dashed lines to axes -->
  <line x1="80" y1="82" x2="80" y2="82" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="80" y1="157" x2="200" y2="157" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="200" y1="157" x2="200" y2="345" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="80" y1="232" x2="320" y2="232" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="320" y1="232" x2="320" y2="345" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="80" y1="307" x2="440" y2="307" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="440" y1="307" x2="440" y2="345" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Label "V" -->
  <text x="575" y="302" font-family="Arial" font-size="18" font-weight="bold" fill="#1A5276">V</text>
</svg>