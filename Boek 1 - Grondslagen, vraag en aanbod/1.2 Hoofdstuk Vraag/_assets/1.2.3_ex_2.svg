<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="360" rx="8" fill="#F7FAFC"/>
  <text x="360" y="25" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2D3748">Markt voor broodjes — twee consumenten</text>

  <line x1="80" y1="310" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>
  <text x="15" y="180" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748" transform="rotate(-90, 15, 180)">Prijs (€)</text>

  <line x1="80" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="680,310 670,306 670,314" fill="#2D3748"/>
  <text x="380" y="350" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748">Hoeveelheid broodjes</text>

  <text x="72" y="325" text-anchor="end" font-family="Arial" font-size="14" fill="#2D3748">0</text>

  <!-- Scale: P 0..6, 1P=44px; Q 0..15, 1Q=40px
       Lara: Qd = -P + 5. P=0,Q=5 -> x=280,y=310; P=5,Q=0 -> x=80,y=90
       Mo: Qd = -P + 3. P=0,Q=3 -> x=200,y=310; P=3,Q=0 -> x=80,y=178
  -->
  <line x1="80" y1="90" x2="280" y2="310" stroke="#1A5276" stroke-width="2.8"/>
  <text x="285" y="310" font-family="Arial" font-size="14" font-weight="bold" fill="#1A5276">V_Lara</text>

  <line x1="80" y1="178" x2="200" y2="310" stroke="#27AE60" stroke-width="2.8"/>
  <text x="205" y="310" font-family="Arial" font-size="14" font-weight="bold" fill="#27AE60">V_Mo</text>

  <!-- Some price reference labels -->
  <text x="72" y="222" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€2</text>
  <line x1="78" y1="222" x2="82" y2="222" stroke="#2D3748" stroke-width="1.5"/>
  <text x="72" y="178" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€3</text>
  <line x1="78" y1="178" x2="82" y2="178" stroke="#2D3748" stroke-width="1.5"/>
  <text x="72" y="134" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€4</text>
  <line x1="78" y1="134" x2="82" y2="134" stroke="#2D3748" stroke-width="1.5"/>

  <!-- Quantity gridlines -->
  <text x="120" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">1</text>
  <text x="160" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">2</text>
  <text x="200" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">3</text>
  <text x="240" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">4</text>
  <text x="280" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">5</text>
  <text x="320" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">6</text>
  <text x="360" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">7</text>
  <text x="400" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">8</text>
</svg>
