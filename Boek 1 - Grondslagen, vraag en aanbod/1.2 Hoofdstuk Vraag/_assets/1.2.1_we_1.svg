<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="400" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2D3748">Karin's ijsjes — koopbeslissing bij P = €2,50</text>

  <!-- Y-axis -->
  <line x1="80" y1="345" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>
  <text x="18" y="200" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748" transform="rotate(-90,18,200)">Prijs (€)</text>

  <!-- X-axis -->
  <line x1="80" y1="345" x2="680" y2="345" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="680,345 670,341 670,349" fill="#2D3748"/>
  <text x="380" y="390" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748">Aantal ijsjes</text>

  <!-- Origin -->
  <text x="72" y="360" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">0</text>

  <!-- Y-axis ticks (€0 to €5, each €0.50 = 60px) — scale: 1€ = 60px, range 0-5 -->
  <line x1="75" y1="285" x2="80" y2="285" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="289" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€1</text>
  <line x1="75" y1="225" x2="80" y2="225" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="229" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€2</text>
  <line x1="75" y1="165" x2="80" y2="165" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="169" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€3</text>
  <line x1="75" y1="105" x2="80" y2="105" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="109" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€4</text>
  <line x1="75" y1="45" x2="80" y2="45" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="49" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€5</text>

  <!-- X-axis ticks -->
  <line x1="200" y1="345" x2="200" y2="350" stroke="#2D3748" stroke-width="1"/>
  <text x="200" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">1</text>
  <line x1="320" y1="345" x2="320" y2="350" stroke="#2D3748" stroke-width="1"/>
  <text x="320" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">2</text>
  <line x1="440" y1="345" x2="440" y2="350" stroke="#2D3748" stroke-width="1"/>
  <text x="440" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">3</text>
  <line x1="560" y1="345" x2="560" y2="350" stroke="#2D3748" stroke-width="1"/>
  <text x="560" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">4</text>

  <!-- CS shading -->
  <!-- Ijsje 1: €4 - €2.50 = €1.50 surplus -->
  <rect x="80" y="105" width="120" height="90" fill="#3498DB" opacity="0.20"/>
  <!-- Ijsje 2: €3 - €2.50 = €0.50 surplus -->
  <rect x="200" y="165" width="120" height="30" fill="#3498DB" opacity="0.20"/>

  <!-- Step function: €4, €3, €2, €0.50 -->
  <!-- P=4→y=105, P=3→y=165, P=2→y=225, P=0.50→y=315 -->
  <polyline points="80,105 200,105 200,165 320,165 320,225 440,225 440,315 560,315"
            fill="none" stroke="#1A5276" stroke-width="2.5"/>

  <!-- Market price line at €2.50 (y = 195) -->
  <line x1="80" y1="195" x2="640" y2="195" stroke="#E74C3C" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="645" y="190" font-family="Arial" font-size="14" font-weight="bold" fill="#E74C3C">P = €2,50</text>

  <!-- CS labels -->
  <text x="140" y="155" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2980B9">€1,50</text>
  <text x="260" y="183" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2980B9">€0,50</text>

  <!-- Check/cross marks -->
  <text x="140" y="260" text-anchor="middle" font-family="Arial" font-size="18" fill="#27AE60">✓</text>
  <text x="260" y="260" text-anchor="middle" font-family="Arial" font-size="18" fill="#27AE60">✓</text>
  <text x="380" y="290" text-anchor="middle" font-family="Arial" font-size="18" fill="#999">✗</text>
  <text x="500" y="340" text-anchor="middle" font-family="Arial" font-size="18" fill="#999">✗</text>

  <!-- Label "V" -->
  <text x="575" y="310" font-family="Arial" font-size="18" font-weight="bold" fill="#1A5276">V</text>

  <!-- CS total -->
  <rect x="80" y="55" width="340" height="28" rx="4" fill="#EBF5FB" stroke="#3498DB" stroke-width="1"/>
  <text x="90" y="74" font-family="Arial" font-size="12" fill="#2D3748">CS = €1,50 + €0,50 = <tspan font-weight="bold">€2</tspan>  |  Karin koopt <tspan font-weight="bold">2 ijsjes</tspan></text>
</svg>