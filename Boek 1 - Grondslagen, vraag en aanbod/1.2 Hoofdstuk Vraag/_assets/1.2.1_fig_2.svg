<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="400" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2D3748">Tom's individuele vraaglijn (trapfunctie)</text>

  <!-- Y-axis -->
  <line x1="80" y1="345" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>
  <text x="18" y="200" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748" transform="rotate(-90,18,200)">Prijs (€)</text>

  <!-- X-axis -->
  <line x1="80" y1="345" x2="680" y2="345" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="680,345 670,341 670,349" fill="#2D3748"/>
  <text x="380" y="390" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748">Aantal kaartjes</text>

  <!-- Origin -->
  <text x="72" y="360" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">0</text>

  <!-- Y-axis ticks -->
  <line x1="75" y1="305" x2="80" y2="305" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="309" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€2</text>
  <line x1="75" y1="265" x2="80" y2="265" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="269" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€4</text>
  <line x1="75" y1="225" x2="80" y2="225" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="229" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€6</text>
  <line x1="75" y1="185" x2="80" y2="185" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="189" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€8</text>
  <line x1="75" y1="145" x2="80" y2="145" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="149" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€10</text>
  <line x1="75" y1="105" x2="80" y2="105" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="109" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€12</text>
  <line x1="75" y1="65" x2="80" y2="65" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="69" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€14</text>

  <!-- X-axis ticks -->
  <line x1="200" y1="345" x2="200" y2="350" stroke="#2D3748" stroke-width="1"/>
  <text x="200" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">1</text>
  <line x1="320" y1="345" x2="320" y2="350" stroke="#2D3748" stroke-width="1"/>
  <text x="320" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">2</text>
  <line x1="440" y1="345" x2="440" y2="350" stroke="#2D3748" stroke-width="1"/>
  <text x="440" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">3</text>
  <line x1="560" y1="345" x2="560" y2="350" stroke="#2D3748" stroke-width="1"/>
  <text x="560" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">4</text>

  <!-- Step function (trapfunctie) -->
  <polyline points="80,105 200,105 200,165 320,165 320,245 440,245 440,305 560,305"
            fill="none" stroke="#1A5276" stroke-width="2.5"/>

  <!-- Points at each step -->
  <circle cx="80" cy="105" r="4" fill="#1A5276"/>
  <circle cx="200" cy="105" r="4" fill="#1A5276"/>
  <circle cx="200" cy="165" r="4" fill="#1A5276"/>
  <circle cx="320" cy="165" r="4" fill="#1A5276"/>
  <circle cx="320" cy="245" r="4" fill="#1A5276"/>
  <circle cx="440" cy="245" r="4" fill="#1A5276"/>
  <circle cx="440" cy="305" r="4" fill="#1A5276"/>
  <circle cx="560" cy="305" r="4" fill="#1A5276"/>

  <!-- Dashed lines to axes for key points -->
  <line x1="80" y1="105" x2="80" y2="105" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="200" y1="165" x2="200" y2="345" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="80" y1="165" x2="200" y2="165" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="320" y1="245" x2="320" y2="345" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="80" y1="245" x2="320" y2="245" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="440" y1="305" x2="440" y2="345" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="80" y1="305" x2="440" y2="305" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Label "V" for vraaglijn -->
  <text x="575" y="300" font-family="Arial" font-size="18" font-weight="bold" fill="#1A5276">V</text>

  <!-- Annotations -->
  <text x="140" y="96" text-anchor="middle" font-family="Arial" font-size="12" fill="#1A5276">€12</text>
  <text x="260" y="156" text-anchor="middle" font-family="Arial" font-size="12" fill="#1A5276">€9</text>
  <text x="380" y="236" text-anchor="middle" font-family="Arial" font-size="12" fill="#1A5276">€5</text>
  <text x="500" y="296" text-anchor="middle" font-family="Arial" font-size="12" fill="#1A5276">€2</text>
</svg>