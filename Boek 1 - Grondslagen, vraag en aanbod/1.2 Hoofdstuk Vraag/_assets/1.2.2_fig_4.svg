<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="420" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2D3748">Beweging langs vs. verschuiving van de vraaglijn</text>

  <!-- Marker arrowheads -->
  <defs>
    <marker id="ar4Blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#1A5276"/>
    </marker>
    <marker id="ar4Grn" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#27AE60"/>
    </marker>
    <marker id="ar4Rd" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#E74C3C"/>
    </marker>
  </defs>

  <!-- ====== LEFT PANEL: Beweging langs ====== -->
  <text x="180" y="55" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#1A5276">Beweging langs de vraaglijn</text>

  <rect x="40" y="65" width="280" height="280" rx="4" fill="white" stroke="#CBD5E0" stroke-width="1"/>

  <line x1="70" y1="325" x2="70" y2="80" stroke="#2D3748" stroke-width="1.4"/>
  <polygon points="70,80 67,88 73,88" fill="#2D3748"/>
  <text x="58" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#2D3748" transform="rotate(-90, 58, 200)">P</text>

  <line x1="70" y1="325" x2="310" y2="325" stroke="#2D3748" stroke-width="1.4"/>
  <polygon points="310,325 302,322 302,328" fill="#2D3748"/>
  <text x="190" y="350" text-anchor="middle" font-family="Arial" font-size="12" fill="#2D3748">Q</text>
  <text x="64" y="338" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">0</text>

  <!-- Demand line V -->
  <line x1="70" y1="100" x2="310" y2="320" stroke="#1A5276" stroke-width="2.8"/>
  <text x="312" y="320" font-family="Arial" font-size="14" font-weight="bold" fill="#1A5276">V</text>

  <!-- Two points on the curve -->
  <circle cx="140" cy="165" r="5" fill="#1A5276"/>
  <text x="120" y="160" font-family="Arial" font-size="12" font-weight="bold" fill="#1A5276">A</text>
  <circle cx="220" cy="240" r="5" fill="#1A5276"/>
  <text x="225" y="237" font-family="Arial" font-size="12" font-weight="bold" fill="#1A5276">B</text>

  <!-- Movement arrow A -> B -->
  <path d="M144,170 C170,190 195,215 217,235" stroke="#1A5276" stroke-width="2.5" fill="none" marker-end="url(#ar4Blue)"/>

  <!-- ===== RULE LABEL FOR LEFT PANEL ===== -->
  <rect x="50" y="365" width="260" height="44" rx="4" fill="#EBF2F8" stroke="#1A5276" stroke-width="1.2"/>
  <text x="180" y="383" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1A5276">Eigen prijs verandert</text>
  <text x="180" y="400" text-anchor="middle" font-family="Arial" font-size="12" fill="#1A5276">→ beweging LANGS de lijn</text>

  <!-- ====== RIGHT PANEL: Verschuiving ====== -->
  <text x="540" y="55" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#27AE60">Verschuiving van de vraaglijn</text>

  <rect x="400" y="65" width="280" height="280" rx="4" fill="white" stroke="#CBD5E0" stroke-width="1"/>

  <line x1="430" y1="325" x2="430" y2="80" stroke="#2D3748" stroke-width="1.4"/>
  <polygon points="430,80 427,88 433,88" fill="#2D3748"/>
  <text x="418" y="200" text-anchor="middle" font-family="Arial" font-size="12" fill="#2D3748" transform="rotate(-90, 418, 200)">P</text>

  <line x1="430" y1="325" x2="670" y2="325" stroke="#2D3748" stroke-width="1.4"/>
  <polygon points="670,325 662,322 662,328" fill="#2D3748"/>
  <text x="550" y="350" text-anchor="middle" font-family="Arial" font-size="12" fill="#2D3748">Q</text>
  <text x="424" y="338" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">0</text>

  <!-- Original V₁ in middle -->
  <line x1="430" y1="120" x2="630" y2="320" stroke="#1A5276" stroke-width="2.8"/>
  <text x="632" y="318" font-family="Arial" font-size="14" font-weight="bold" fill="#1A5276">V₁</text>

  <!-- V₂ shifted RIGHT (parallel) -->
  <line x1="475" y1="120" x2="670" y2="315" stroke="#27AE60" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="672" y="310" font-family="Arial" font-size="13" font-weight="bold" fill="#27AE60">V₂</text>

  <!-- V₃ shifted LEFT (parallel) -->
  <line x1="430" y1="165" x2="585" y2="320" stroke="#E74C3C" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="585" y="335" font-family="Arial" font-size="13" font-weight="bold" fill="#E74C3C">V₃</text>

  <!-- Shift arrows at a mid-price level (y=200) -->
  <!-- right shift: from V₁ to V₂ -->
  <line x1="510" y1="200" x2="565" y2="200" stroke="#27AE60" stroke-width="2.5" marker-end="url(#ar4Grn)"/>
  <!-- left shift: from V₁ to V₃ -->
  <line x1="500" y1="240" x2="445" y2="240" stroke="#E74C3C" stroke-width="2.5" marker-end="url(#ar4Rd)"/>

  <!-- ===== RULE LABEL FOR RIGHT PANEL ===== -->
  <rect x="410" y="365" width="260" height="44" rx="4" fill="#EAF5EF" stroke="#27AE60" stroke-width="1.2"/>
  <text x="540" y="383" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1F7A3E">Andere factor verandert</text>
  <text x="540" y="400" text-anchor="middle" font-family="Arial" font-size="12" fill="#1F7A3E">→ verschuiving VAN de lijn</text>
</svg>
