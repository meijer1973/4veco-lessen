<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="420" rx="8" fill="#F7FAFC"/>
  <text x="360" y="25" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2D3748">Markt voor ijsjes — twee consumenten, één markt</text>

  <line x1="80" y1="350" x2="80" y2="55" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,55 76,65 84,65" fill="#2D3748"/>
  <text x="15" y="200" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748" transform="rotate(-90, 15, 200)">Prijs (€)</text>

  <line x1="80" y1="350" x2="680" y2="350" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="680,350 670,346 670,354" fill="#2D3748"/>
  <text x="380" y="385" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748">Hoeveelheid ijsjes</text>

  <text x="72" y="365" text-anchor="end" font-family="Arial" font-size="14" fill="#2D3748">0</text>

  <!-- Plot area: x 80..680 (600px), y 55..350 (295px)
       P range 0..5 -> 1P=59px;  Q range 0..15 -> 1Q=40px
       Sara (red): Qd = -P + 4. P=0,Q=4 -> x=240,y=350; P=4,Q=0 -> x=80,y=114
       Tim (orange): Qd = -P + 6. P=0,Q=6 -> x=320,y=350; P=6 → cap at P=5 (already off chart)
                  Use P=5,Q=1 -> x=120,y=55
       V_coll = -2P + 10 (for P<=4); P=4 (kink), then = -P+6
       P=0,Q=10 -> x=480,y=350; P=4,Q=2 -> x=160,y=114; then to (P=5,Q=1) x=120,y=55
  -->

  <!-- Sara: Qd = -P + 4, valid 0<=P<=4. (80,114) to (240,350) -->
  <line x1="80" y1="114" x2="240" y2="350" stroke="#1A5276" stroke-width="2.5"/>
  <text x="245" y="350" font-family="Arial" font-size="14" font-weight="bold" fill="#1A5276">V_Sara</text>

  <!-- Tim: Qd = -P + 6, valid 0<=P<=6. Cutoff (P=6) is OFF the visible plot (y range stops at P=5).
       Line endpoints (only the visible portion):
         Top of plot at y=55 → P=5, Q_Tim=1, x=80+1*40=120
         Bottom of plot at y=350 → P=0, Q_Tim=6, x=80+6*40=320
       Verify line passes through Tim's P=2 dot at (240,232): slope=295/200=1.475;
         y at x=240 = 55 + (240-120)*1.475 = 55 + 177 = 232 ✓
       Verify line passes through kink at (160,114): y at x=160 = 55 + (160-120)*1.475 = 114 ✓ -->
  <line x1="120" y1="55" x2="320" y2="350" stroke="#27AE60" stroke-width="2.5"/>
  <text x="325" y="350" font-family="Arial" font-size="14" font-weight="bold" fill="#27AE60">V_Tim</text>

  <!-- V_coll: only the segment BELOW the kink (where both buy), to avoid visual overlap with V_Tim above the kink.
       Below kink (0<=P<4): Q_coll = -2P + 10 → from (P=0,Q=10) to (P=4,Q=2)
         (P=0,Q=10): x=80+10*40=480, y=350
         (P=4,Q=2): x=80+2*40=160, y=350-4*59=114
       Above the kink V_coll lies exactly on V_Tim — a small text label notes this. -->
  <polyline points="160,114 480,350" stroke="#9B59B6" stroke-width="3.5" fill="none"/>
  <text x="485" y="350" font-family="Arial" font-size="14" font-weight="bold" fill="#9B59B6">V_coll</text>

  <!-- Mark the kink point -->
  <circle cx="160" cy="114" r="5" fill="#9B59B6"/>
  <text x="165" y="105" font-family="Arial" font-size="13" font-style="italic" fill="#9B59B6">knik (P=€4)</text>

  <!-- Note that above the kink V_coll falls on V_Tim -->
  <text x="50" y="78" font-family="Arial" font-size="13" font-style="italic" fill="#9B59B6">Boven €4: V_coll = V_Tim</text>

  <!-- At P=2 (y=350-2*59=232), Sara Q=2 (x=160), Tim Q=4 (x=240), V_coll Q=6 (x=320) -->
  <line x1="80" y1="232" x2="320" y2="232" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="160" cy="232" r="5" fill="#1A5276"/>
  <circle cx="240" cy="232" r="5" fill="#27AE60"/>
  <circle cx="320" cy="232" r="6" fill="#9B59B6"/>

  <text x="72" y="236" text-anchor="end" font-family="Arial" font-size="14" fill="#2D3748">€2</text>
  <text x="160" y="220" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1A5276">2</text>
  <text x="240" y="220" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#27AE60">4</text>
  <text x="320" y="220" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#9B59B6">6</text>

  <!-- Arrow from Tim's point to V_coll point -->
  <defs>
    <marker id="arrEx1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#9B59B6"/>
    </marker>
  </defs>
  <line x1="245" y1="246" x2="315" y2="246" stroke="#9B59B6" stroke-width="1.5" marker-end="url(#arrEx1)"/>
  <text x="280" y="262" text-anchor="middle" font-family="Arial" font-size="13" font-style="italic" fill="#9B59B6">+ 2</text>

  <!-- ===== RULE LABEL UNDER FIGURE ===== -->
  <rect x="160" y="395" width="400" height="20" rx="4" fill="#F1E5F8" stroke="#9B59B6" stroke-width="1"/>
  <text x="360" y="410" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#7D3C98">Bij elke prijs: tel de individuele Q's op om V_coll te krijgen</text>
</svg>
