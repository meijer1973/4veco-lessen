<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="400" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2D3748">Teken hier de vraaglijn</text>

  <!-- Y-axis -->
  <line x1="80" y1="345" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>
  <text x="18" y="200" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748" transform="rotate(-90,18,200)">Prijs (€)</text>

  <!-- X-axis -->
  <line x1="80" y1="345" x2="680" y2="345" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="680,345 670,341 670,349" fill="#2D3748"/>
  <text x="380" y="390" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748">Aantal stuks</text>

  <!-- Origin -->
  <text x="72" y="360" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">0</text>

  <!-- Y-axis ticks (€0 to €12, each €2 = 50px) -->
  <line x1="75" y1="295" x2="80" y2="295" stroke="#CCC" stroke-width="1"/>
  <text x="72" y="299" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€2</text>
  <line x1="75" y1="245" x2="80" y2="245" stroke="#CCC" stroke-width="1"/>
  <text x="72" y="249" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€4</text>
  <line x1="75" y1="195" x2="80" y2="195" stroke="#CCC" stroke-width="1"/>
  <text x="72" y="199" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€6</text>
  <line x1="75" y1="145" x2="80" y2="145" stroke="#CCC" stroke-width="1"/>
  <text x="72" y="149" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€8</text>
  <line x1="75" y1="95" x2="80" y2="95" stroke="#CCC" stroke-width="1"/>
  <text x="72" y="99" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€10</text>
  <line x1="75" y1="45" x2="80" y2="45" stroke="#CCC" stroke-width="1"/>
  <text x="72" y="49" text-anchor="end" font-family="Arial" font-size="13" fill="#2D3748">€12</text>

  <!-- X-axis ticks -->
  <line x1="200" y1="345" x2="200" y2="350" stroke="#CCC" stroke-width="1"/>
  <text x="200" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">1</text>
  <line x1="320" y1="345" x2="320" y2="350" stroke="#CCC" stroke-width="1"/>
  <text x="320" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">2</text>
  <line x1="440" y1="345" x2="440" y2="350" stroke="#CCC" stroke-width="1"/>
  <text x="440" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">3</text>
  <line x1="560" y1="345" x2="560" y2="350" stroke="#CCC" stroke-width="1"/>
  <text x="560" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">4</text>
  <line x1="680" y1="345" x2="680" y2="350" stroke="#CCC" stroke-width="1"/>
  <text x="680" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#2D3748">5</text>

  <!-- Grid lines (light, for student drawing) -->
  <line x1="80" y1="295" x2="680" y2="295" stroke="#EEE" stroke-width="0.5"/>
  <line x1="80" y1="245" x2="680" y2="245" stroke="#EEE" stroke-width="0.5"/>
  <line x1="80" y1="195" x2="680" y2="195" stroke="#EEE" stroke-width="0.5"/>
  <line x1="80" y1="145" x2="680" y2="145" stroke="#EEE" stroke-width="0.5"/>
  <line x1="80" y1="95" x2="680" y2="95" stroke="#EEE" stroke-width="0.5"/>
  <line x1="80" y1="45" x2="680" y2="45" stroke="#EEE" stroke-width="0.5"/>
  <line x1="200" y1="45" x2="200" y2="345" stroke="#EEE" stroke-width="0.5"/>
  <line x1="320" y1="45" x2="320" y2="345" stroke="#EEE" stroke-width="0.5"/>
  <line x1="440" y1="45" x2="440" y2="345" stroke="#EEE" stroke-width="0.5"/>
  <line x1="560" y1="45" x2="560" y2="345" stroke="#EEE" stroke-width="0.5"/>
  <line x1="680" y1="45" x2="680" y2="345" stroke="#EEE" stroke-width="0.5"/>
</svg>