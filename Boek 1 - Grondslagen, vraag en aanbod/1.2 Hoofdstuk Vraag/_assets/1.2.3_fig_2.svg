<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="360" rx="8" fill="#F7FAFC"/>
  <text x="360" y="25" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2D3748">Ben's individuele vraaglijn naar limonade</text>

  <line x1="80" y1="310" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>
  <text x="15" y="180" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748" transform="rotate(-90, 15, 180)">Prijs (€)</text>

  <line x1="80" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="680,310 670,306 670,314" fill="#2D3748"/>
  <text x="380" y="350" text-anchor="middle" font-family="Arial" font-size="15" fill="#2D3748">Hoeveelheid bekers per week</text>

  <text x="72" y="325" text-anchor="end" font-family="Arial" font-size="14" fill="#2D3748">0</text>

  <!-- Ben: Qd = -3P + 11
       P=0 -> Q=11; P=1 -> Q=8; P=2 -> Q=5; P=3 -> Q=2; P=4 -> Q=-1 (cut at P=11/3≈3.67)
       Use only P=0..3.67 (above that Q<0, line stops)
       Q=11, P=0 -> x=80+11*24=344, y=310
       Q=0, P=3.67 -> x=80, y=310-3.67*53=116
  -->
  <line x1="80" y1="116" x2="344" y2="310" stroke="#27AE60" stroke-width="2.8"/>
  <text x="349" y="310" font-family="Arial" font-size="16" font-weight="bold" fill="#27AE60">V_Ben</text>

  <!-- Sample points: P=1,Q=8 P=2,Q=5 P=3,Q=2 -->
  <circle cx="272" cy="257" r="4" fill="#27AE60"/>
  <circle cx="200" cy="204" r="4" fill="#27AE60"/>
  <circle cx="128" cy="151" r="4" fill="#27AE60"/>

  <text x="72" y="155" text-anchor="end" font-family="Arial" font-size="14" fill="#2D3748">€3</text>
  <text x="72" y="208" text-anchor="end" font-family="Arial" font-size="14" fill="#2D3748">€2</text>
  <text x="72" y="261" text-anchor="end" font-family="Arial" font-size="14" fill="#2D3748">€1</text>

  <text x="128" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">2</text>
  <text x="200" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">5</text>
  <text x="272" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">8</text>
  <text x="344" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#2D3748">11</text>

  <line x1="80" y1="208" x2="200" y2="208" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="200" y1="208" x2="200" y2="310" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
