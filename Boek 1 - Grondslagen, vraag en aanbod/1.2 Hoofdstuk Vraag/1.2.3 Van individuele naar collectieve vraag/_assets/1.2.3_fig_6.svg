<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="400" rx="8" fill="#F7FAFC"/>
  <text x="360" y="28" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2D3748">Twee methodes om de collectieve vraag te bepalen</text>

  <!-- ===== METHOD 1: TABLE ===== -->
  <text x="180" y="60" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#1A5276">Methode 1: tabel</text>

  <rect x="40" y="75" width="280" height="290" rx="6" fill="white" stroke="#1A5276" stroke-width="1.5"/>

  <text x="55" y="100" font-family="Arial" font-size="14" font-weight="bold" fill="#2D3748">Stap 1: tabel met individuele vraag</text>
  <!-- Mini table -->
  <line x1="55" y1="110" x2="305" y2="110" stroke="#CBD5E0"/>
  <text x="65"  y="125" font-family="Arial" font-size="13" fill="#2D3748">P</text>
  <text x="135" y="125" font-family="Arial" font-size="13" fill="#2D3748">Q_Anna</text>
  <text x="220" y="125" font-family="Arial" font-size="13" fill="#2D3748">Q_Ben</text>
  <line x1="55" y1="130" x2="305" y2="130" stroke="#CBD5E0"/>
  <text x="65"  y="145" font-family="Arial" font-size="13" fill="#2D3748">€1</text>
  <text x="135" y="145" font-family="Arial" font-size="13" fill="#2D3748">5</text>
  <text x="220" y="145" font-family="Arial" font-size="13" fill="#2D3748">8</text>
  <text x="65"  y="160" font-family="Arial" font-size="13" fill="#2D3748">€2</text>
  <text x="135" y="160" font-family="Arial" font-size="13" fill="#2D3748">3</text>
  <text x="220" y="160" font-family="Arial" font-size="13" fill="#2D3748">5</text>
  <text x="65"  y="175" font-family="Arial" font-size="13" fill="#2D3748">€3</text>
  <text x="135" y="175" font-family="Arial" font-size="13" fill="#2D3748">1</text>
  <text x="220" y="175" font-family="Arial" font-size="13" fill="#2D3748">2</text>

  <text x="55" y="205" font-family="Arial" font-size="14" font-weight="bold" fill="#2D3748">Stap 2: tel per rij op</text>
  <line x1="55" y1="215" x2="305" y2="215" stroke="#CBD5E0"/>
  <text x="65"  y="230" font-family="Arial" font-size="13" fill="#2D3748">P</text>
  <text x="160" y="230" font-family="Arial" font-size="13" font-weight="bold" fill="#9B59B6">Q_collectief</text>
  <line x1="55" y1="235" x2="305" y2="235" stroke="#CBD5E0"/>
  <text x="65"  y="250" font-family="Arial" font-size="13" fill="#2D3748">€1</text>
  <text x="160" y="250" font-family="Arial" font-size="13" font-weight="bold" fill="#9B59B6">5 + 8 = 13</text>
  <text x="65"  y="265" font-family="Arial" font-size="13" fill="#2D3748">€2</text>
  <text x="160" y="265" font-family="Arial" font-size="13" font-weight="bold" fill="#9B59B6">3 + 5 = 8</text>
  <text x="65"  y="280" font-family="Arial" font-size="13" fill="#2D3748">€3</text>
  <text x="160" y="280" font-family="Arial" font-size="13" font-weight="bold" fill="#9B59B6">1 + 2 = 3</text>

  <text x="180" y="320" text-anchor="middle" font-family="Arial" font-size="13" font-style="italic" fill="#4A5568">Werkt altijd, ook als de</text>
  <text x="180" y="335" text-anchor="middle" font-family="Arial" font-size="13" font-style="italic" fill="#4A5568">vraagfunctie niet lineair is</text>

  <!-- ===== METHOD 2: ALGEBRA ===== -->
  <text x="540" y="60" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#27AE60">Methode 2: algebra</text>

  <rect x="400" y="75" width="280" height="290" rx="6" fill="white" stroke="#27AE60" stroke-width="1.5"/>

  <text x="415" y="100" font-family="Arial" font-size="14" font-weight="bold" fill="#2D3748">Stap 1: schrijf elke vraagfunctie op</text>
  <text x="415" y="125" font-family="Consolas, monospace" font-size="13" fill="#1A5276">Q_Anna = -2P + 7</text>
  <text x="415" y="148" font-family="Consolas, monospace" font-size="13" fill="#27AE60">Q_Ben  = -3P + 11</text>

  <text x="415" y="180" font-family="Arial" font-size="14" font-weight="bold" fill="#2D3748">Stap 2: tel de Q's op (bij dezelfde P)</text>
  <text x="415" y="205" font-family="Consolas, monospace" font-size="14" fill="#2D3748">Q_coll = Q_Anna + Q_Ben</text>
  <text x="415" y="225" font-family="Consolas, monospace" font-size="14" fill="#2D3748">       = (-2P+7) + (-3P+11)</text>
  <text x="415" y="245" font-family="Consolas, monospace" font-size="14" fill="#2D3748">       = -5P + 18</text>

  <text x="415" y="278" font-family="Arial" font-size="14" font-weight="bold" fill="#2D3748">Stap 3: check met een prijs</text>
  <text x="415" y="298" font-family="Consolas, monospace" font-size="13" fill="#2D3748">P=2: Q_coll = -10 + 18 = 8 ✓</text>

  <text x="540" y="335" text-anchor="middle" font-family="Arial" font-size="13" font-style="italic" fill="#4A5568">Sneller en exact, maar alleen</text>
  <text x="540" y="349" text-anchor="middle" font-family="Arial" font-size="13" font-style="italic" fill="#4A5568">voor lineaire vraagfuncties</text>

  <!-- Bottom rule -->
  <text x="360" y="392" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#9B59B6">Allebei: tel hoeveelheden op bij dezelfde prijs</text>
</svg>
