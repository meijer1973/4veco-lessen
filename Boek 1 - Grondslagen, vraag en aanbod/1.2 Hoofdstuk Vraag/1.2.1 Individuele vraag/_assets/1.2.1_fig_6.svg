<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="400" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2D3748">Individuele vraag — overzicht</text>

  <!-- Central concept -->
  <rect x="260" y="160" width="200" height="50" rx="10" fill="#1A5276"/>
  <text x="360" y="190" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="white">Individuele vraag</text>

  <!-- Concept 1: Betalingsbereidheid (top-left) -->
  <rect x="50" y="55" width="210" height="60" rx="8" fill="#EBF5FB" stroke="#1A5276" stroke-width="1.5"/>
  <text x="155" y="78" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1A5276">Betalingsbereidheid</text>
  <text x="155" y="100" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Maximale prijs per eenheid</text>
  <line x1="260" y1="115" x2="310" y2="160" stroke="#1A5276" stroke-width="1.5"/>

  <!-- Concept 2: Wet van de vraag (top-right) -->
  <rect x="460" y="55" width="210" height="60" rx="8" fill="#EBF5FB" stroke="#1A5276" stroke-width="1.5"/>
  <text x="565" y="78" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1A5276">Wet van de vraag</text>
  <text x="565" y="100" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Hogere prijs → minder vraag</text>
  <line x1="460" y1="115" x2="410" y2="160" stroke="#1A5276" stroke-width="1.5"/>

  <!-- Concept 3: Vraaglijn (left) -->
  <rect x="30" y="250" width="200" height="60" rx="8" fill="#EBF5FB" stroke="#1A5276" stroke-width="1.5"/>
  <text x="130" y="273" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1A5276">Vraaglijn (V)</text>
  <text x="130" y="295" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Dalend van LB naar RO</text>
  <line x1="230" y1="270" x2="290" y2="210" stroke="#1A5276" stroke-width="1.5"/>

  <!-- Concept 4: Koopbeslissing (bottom-center) -->
  <rect x="255" y="310" width="210" height="60" rx="8" fill="#E8F5E9" stroke="#27AE60" stroke-width="1.5"/>
  <text x="360" y="333" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#27AE60">Koopbeslissing</text>
  <text x="360" y="355" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Koop als BB ≥ marktprijs</text>
  <line x1="360" y1="210" x2="360" y2="310" stroke="#27AE60" stroke-width="1.5"/>

  <!-- Concept 5: Consumentensurplus (right) -->
  <rect x="490" y="250" width="200" height="60" rx="8" fill="#EBF5FB" stroke="#3498DB" stroke-width="1.5"/>
  <text x="590" y="273" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#3498DB">Consumentensurplus</text>
  <text x="590" y="295" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">BB − marktprijs (per eenheid)</text>
  <line x1="490" y1="270" x2="430" y2="210" stroke="#3498DB" stroke-width="1.5"/>

  <!-- Concept 6: Ceteris paribus (bottom-right) -->
  <rect x="500" y="345" width="195" height="48" rx="8" fill="#FFF3E0" stroke="#E67E22" stroke-width="1.5"/>
  <text x="598" y="367" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#E67E22">Ceteris paribus</text>
  <text x="598" y="384" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Alle andere factoren gelijk</text>
  <line x1="500" y1="360" x2="460" y2="210" stroke="#E67E22" stroke-width="1" stroke-dasharray="4,3"/>
</svg>