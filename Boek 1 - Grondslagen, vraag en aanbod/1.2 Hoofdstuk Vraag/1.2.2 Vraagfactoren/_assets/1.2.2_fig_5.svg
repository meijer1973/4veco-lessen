<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="400" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#2D3748">De vijf vraagfactoren — wat verschuift de vraaglijn?</text>

  <!-- Center: vraaglijn box -->
  <rect x="280" y="170" width="160" height="80" rx="6" fill="#1A5276" stroke="#0F3D5C" stroke-width="2"/>
  <text x="360" y="200" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">VRAAGLIJN</text>
  <text x="360" y="220" text-anchor="middle" font-family="Arial" font-size="13" fill="#D5E3EF">positie + richting</text>
  <text x="360" y="237" text-anchor="middle" font-family="Arial" font-size="13" fill="#D5E3EF">van verschuiving</text>

  <!-- Five factor boxes around the center -->
  <!-- Marker arrowheads -->
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#1A5276"/>
    </marker>
  </defs>

  <!-- 1. Inkomen — top left -->
  <rect x="60"  y="70" width="180" height="60" rx="6" fill="white" stroke="#1A5276" stroke-width="1.5"/>
  <text x="150" y="93"  text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1A5276">1. Inkomen</text>
  <text x="150" y="113" text-anchor="middle" font-family="Arial" font-size="12" fill="#2D3748">↑ inkomen → vraag ↑</text>
  <line x1="240" y1="100" x2="290" y2="180" stroke="#1A5276" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 2. Voorkeuren — top right -->
  <rect x="480" y="70" width="180" height="60" rx="6" fill="white" stroke="#1A5276" stroke-width="1.5"/>
  <text x="570" y="93"  text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1A5276">2. Voorkeuren</text>
  <text x="570" y="113" text-anchor="middle" font-family="Arial" font-size="12" fill="#2D3748">trend / reclame / hype</text>
  <line x1="480" y1="100" x2="430" y2="180" stroke="#1A5276" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 3. Prijs substituten — middle left -->
  <rect x="20"  y="190" width="200" height="60" rx="6" fill="white" stroke="#1A5276" stroke-width="1.5"/>
  <text x="120" y="213" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1A5276">3. Prijs substituten</text>
  <text x="120" y="233" text-anchor="middle" font-family="Arial" font-size="12" fill="#2D3748">bv. boter ↔ margarine</text>
  <line x1="220" y1="220" x2="278" y2="210" stroke="#1A5276" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 4. Prijs complementen — middle right -->
  <rect x="500" y="190" width="200" height="60" rx="6" fill="white" stroke="#1A5276" stroke-width="1.5"/>
  <text x="600" y="213" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1A5276">4. Prijs complementen</text>
  <text x="600" y="233" text-anchor="middle" font-family="Arial" font-size="12" fill="#2D3748">bv. brood ↔ boter</text>
  <line x1="500" y1="210" x2="442" y2="210" stroke="#1A5276" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 5. Verwachtingen — bottom center -->
  <rect x="270" y="310" width="180" height="60" rx="6" fill="white" stroke="#1A5276" stroke-width="1.5"/>
  <text x="360" y="333" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1A5276">5. Verwachtingen</text>
  <text x="360" y="353" text-anchor="middle" font-family="Arial" font-size="12" fill="#2D3748">prijs morgen ↑ → koop nu</text>
  <line x1="360" y1="310" x2="360" y2="255" stroke="#1A5276" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
