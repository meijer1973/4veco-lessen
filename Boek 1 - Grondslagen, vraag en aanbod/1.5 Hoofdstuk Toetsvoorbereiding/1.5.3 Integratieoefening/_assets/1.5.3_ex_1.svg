<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="Arial">
  <!-- Background -->
  <rect width="560" height="440" fill="#F7FAFC" rx="8"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Markt voor koffie: aanbodverschuiving</text>

  <!-- Axes -->
  <line x1="80" y1="380" x2="510" y2="380" stroke="#2D3748" stroke-width="2"/>
  <line x1="80" y1="380" x2="80" y2="50" stroke="#2D3748" stroke-width="2"/>
  <!-- Arrowheads -->
  <polygon points="510,380 502,376 502,384" fill="#2D3748"/>
  <polygon points="80,50 76,58 84,58" fill="#2D3748"/>

  <!-- Axis labels -->
  <text x="25" y="220" text-anchor="middle" font-size="12" fill="#718096" transform="rotate(-90, 25, 220)">Prijs (P) in euro</text>
  <text x="295" y="418" text-anchor="middle" font-size="12" fill="#718096">Hoeveelheid (Q) in zakken</text>
  <text x="72" y="395" text-anchor="end" font-size="10" fill="#718096">0</text>

  <!--
    Pixel mapping:
    Q: 0..300 => x: 80..500 (1.4 px per unit Q)
    P: 0..16 => y: 380..60 (20 px per unit P)

    V: Qv = -40P + 580. P = 14.5 - Q/40.
       Q=0,P=14.5 => (80, 90). Q=300,P=7.0 => (500, 240).

    A1: Qa = 20P - 20. P = (Q+20)/20.
        Q=0,P=1 => (80, 360). Q=270,P=14.5 => (458, 90).

    A2: Qa' = 20P - 60. P = (Q+60)/20.
        Q=0,P=3 => (80, 320). Q=230,P=14.5 => (402, 90).

    E:  P=10, Q=180 => x=332, y=180.
    E': P=32/3≈10.67, Q=460/3≈153.3 => x=295, y=167.
  -->

  <!-- Price scale markers -->
  <line x1="75" y1="360" x2="80" y2="360" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="364" text-anchor="end" font-size="10" fill="#718096">1</text>
  <line x1="75" y1="320" x2="80" y2="320" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="324" text-anchor="end" font-size="10" fill="#718096">3</text>
  <line x1="75" y1="280" x2="80" y2="280" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="284" text-anchor="end" font-size="10" fill="#718096">5</text>
  <line x1="75" y1="180" x2="80" y2="180" stroke="#2D3748" stroke-width="1"/>
  <text x="72" y="184" text-anchor="end" font-size="10" fill="#718096">10</text>
  <line x1="75" y1="167" x2="80" y2="167" stroke="#2D3748" stroke-width="1"/>
  <text x="62" y="171" text-anchor="end" font-size="10" fill="#E74C3C">10,67</text>

  <!-- Q scale markers -->
  <line x1="220" y1="380" x2="220" y2="385" stroke="#2D3748" stroke-width="1"/>
  <text x="220" y="398" text-anchor="middle" font-size="10" fill="#718096">100</text>
  <line x1="360" y1="380" x2="360" y2="385" stroke="#2D3748" stroke-width="1"/>
  <text x="360" y="398" text-anchor="middle" font-size="10" fill="#718096">200</text>

  <!-- Demand line V: (80,90) to (500,240) -->
  <line x1="80" y1="90" x2="500" y2="240" stroke="#1A5276" stroke-width="2.5"/>
  <text x="505" y="244" font-size="13" font-weight="bold" fill="#1A5276">V</text>

  <!-- Original supply A1: (80,360) to (458,90) -->
  <line x1="80" y1="360" x2="458" y2="90" stroke="#27AE60" stroke-width="2.5"/>
  <text x="463" y="86" font-size="12" fill="#27AE60">A&#x2081;</text>

  <!-- New supply A2 (shifted left): (80,320) to (402,90) -->
  <line x1="80" y1="320" x2="402" y2="90" stroke="#27AE60" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="407" y="86" font-size="12" fill="#27AE60">A&#x2082;</text>

  <!-- Old equilibrium E at (332, 180) -->
  <circle cx="332" cy="180" r="5" fill="#2D3748"/>
  <text x="342" y="173" font-size="11" font-weight="bold" fill="#2D3748">E</text>
  <line x1="332" y1="180" x2="332" y2="380" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="332" y1="180" x2="80" y2="180" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="332" y="398" text-anchor="middle" font-size="10" fill="#2D3748">180</text>

  <!-- New equilibrium E' at (295, 167) -->
  <circle cx="295" cy="167" r="5" fill="#E74C3C"/>
  <text x="275" y="160" font-size="11" font-weight="bold" fill="#E74C3C">E'</text>
  <line x1="295" y1="167" x2="295" y2="380" stroke="#E74C3C" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="295" y1="167" x2="80" y2="167" stroke="#E74C3C" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="295" y="398" text-anchor="middle" font-size="10" fill="#E74C3C">153</text>

  <!-- Shift arrow from A1 to A2 -->
  <defs>
    <marker id="arrowShift" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#C0392B"/>
    </marker>
  </defs>
  <line x1="370" y1="150" x2="318" y2="150" stroke="#C0392B" stroke-width="2" marker-end="url(#arrowShift)"/>
  <text x="344" y="142" text-anchor="middle" font-size="10" fill="#C0392B">verschuiving</text>

  <!-- Legend -->
  <rect x="360" y="270" width="175" height="95" rx="4" fill="#ffffff" fill-opacity="0.9" stroke="#CBD5E0" stroke-width="1"/>
  <text x="370" y="288" font-size="10" font-weight="bold" fill="#2D3748">Legenda</text>
  <line x1="370" y1="304" x2="400" y2="304" stroke="#27AE60" stroke-width="2"/>
  <text x="408" y="308" font-size="10" fill="#2D3748">A&#x2081; (oud aanbod)</text>
  <line x1="370" y1="322" x2="400" y2="322" stroke="#27AE60" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="408" y="326" font-size="10" fill="#2D3748">A&#x2082; (nieuw aanbod)</text>
  <circle cx="385" cy="340" r="3" fill="#2D3748"/>
  <text x="408" y="344" font-size="10" fill="#2D3748">E (oud evenwicht)</text>
  <circle cx="385" cy="356" r="3" fill="#E74C3C"/>
  <text x="408" y="360" font-size="10" fill="#2D3748">E' (nieuw evenwicht)</text>
</svg>