<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial">
  <!-- Background -->
  <rect width="720" height="360" fill="#F7FAFC" rx="8"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Schaarste, keuzes en rekenhulpmiddelen</text>

  <!-- Flow: Schaarste -> Keuze -> Alternatieve kosten -->
  <!-- Box 1: Behoeften > Middelen -->
  <rect x="30" y="50" width="180" height="50" rx="6" fill="#1A5276" fill-opacity="0.15" stroke="#1A5276" stroke-width="1.5"/>
  <text x="120" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5276">Behoeften &gt; Middelen</text>
  <text x="120" y="89" text-anchor="middle" font-size="10" fill="#2D3748">= Schaarste</text>

  <!-- Arrow 1 -->
  <line x1="210" y1="75" x2="250" y2="75" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: Keuzes maken -->
  <rect x="250" y="50" width="150" height="50" rx="6" fill="#E67E22" fill-opacity="0.15" stroke="#E67E22" stroke-width="1.5"/>
  <text x="325" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#E67E22">Keuzes maken</text>
  <text x="325" y="89" text-anchor="middle" font-size="10" fill="#2D3748">je kunt niet alles</text>

  <!-- Arrow 2 -->
  <line x1="400" y1="75" x2="440" y2="75" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: Alternatieve kosten -->
  <rect x="440" y="50" width="250" height="50" rx="6" fill="#1E8449" fill-opacity="0.15" stroke="#1E8449" stroke-width="1.5"/>
  <text x="565" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E8449">Alternatieve kosten</text>
  <text x="565" y="89" text-anchor="middle" font-size="10" fill="#2D3748">opbrengst beste niet-gekozen alternatief</text>

  <!-- Divider -->
  <line x1="30" y1="120" x2="690" y2="120" stroke="#CBD5E0" stroke-width="1"/>

  <!-- Formule-overzicht titel -->
  <text x="360" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2761">Formule-overzicht</text>

  <!-- Formula box 1: Procentuele verandering -->
  <rect x="30" y="165" width="320" height="80" rx="6" fill="#ffffff" stroke="#1A5276" stroke-width="1.5"/>
  <text x="190" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5276">Procentuele verandering</text>
  <text x="190" y="210" text-anchor="middle" font-size="12" fill="#2D3748">(nieuw - oud)</text>
  <line x1="120" y1="215" x2="260" y2="215" stroke="#2D3748" stroke-width="1"/>
  <text x="190" y="232" text-anchor="middle" font-size="12" fill="#2D3748">oud</text>
  <text x="280" y="222" text-anchor="start" font-size="12" fill="#2D3748">x 100%</text>

  <!-- Formula box 2: Indexcijfer -->
  <rect x="370" y="165" width="320" height="80" rx="6" fill="#ffffff" stroke="#1E8449" stroke-width="1.5"/>
  <text x="530" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E8449">Indexcijfer</text>
  <text x="530" y="210" text-anchor="middle" font-size="12" fill="#2D3748">waarde</text>
  <line x1="465" y1="215" x2="595" y2="215" stroke="#2D3748" stroke-width="1"/>
  <text x="530" y="232" text-anchor="middle" font-size="12" fill="#2D3748">basiswaarde</text>
  <text x="610" y="222" text-anchor="start" font-size="12" fill="#2D3748">x 100</text>

  <!-- Warning box -->
  <rect x="30" y="265" width="660" height="70" rx="6" fill="#F1948A" fill-opacity="0.2" stroke="#D9534F" stroke-width="1.5"/>
  <text x="50" y="290" font-size="11" font-weight="bold" fill="#D9534F">Let op: indexpunten =/= procenten!</text>
  <text x="50" y="310" font-size="10.5" fill="#2D3748">Indexcijfer stijgt van 120 naar 132 = 12 indexpunten, maar (132 - 120) / 120 x 100% = 10% stijging.</text>
  <text x="50" y="326" font-size="10.5" fill="#2D3748">Deel altijd door het OUDE indexcijfer, niet door 100.</text>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#718096"/>
    </marker>
  </defs>
</svg>