<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial">
  <!-- Background -->
  <rect width="720" height="360" fill="#F7FAFC" rx="8"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Marktevenwicht en verschuiving van het aanbod</text>

  <!-- Axes -->
  <line x1="80" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="2"/>
  <line x1="80" y1="310" x2="80" y2="45" stroke="#2D3748" stroke-width="2"/>
  <polygon points="680,310 672,306 672,314" fill="#2D3748"/>
  <polygon points="80,45 76,53 84,53" fill="#2D3748"/>

  <!-- Axis labels -->
  <text x="15" y="180" text-anchor="middle" font-size="12" fill="#718096" transform="rotate(-90, 15, 180)">Prijs (P)</text>
  <text x="72" y="325" text-anchor="end" font-size="10" fill="#718096">0</text>

  <!-- Schriftenmarkt: Qv = -2P + 100, Qa = 3P - 25 -->
  <!-- Evenwicht: -2P+100 = 3P-25 => 5P=125 => P*=25, Q*=50 -->
  <!-- Pixel mapping: P 0..60 -> y 310..60; Q 0..120 -> x 80..680 -->
  <!-- Scale: 1P = (310-60)/60 = 4.167 px; 1Q = (680-80)/120 = 5 px -->
  <!-- f(P) = 310 - P*4.167; g(Q) = 80 + Q*5 -->

  <!-- Demand V: Qv = -2P+100 -->
  <!-- At P=0: Q=100, x=580, y=310 => (580,310) -->
  <!-- At P=50: Q=0, x=80, y=310-208.3=101.7 => (80,102) -->
  <line x1="80" y1="102" x2="580" y2="310" stroke="#1A5276" stroke-width="2.5"/>
  <text x="586" y="306" font-size="12" font-weight="bold" fill="#1A5276">V</text>

  <!-- Supply A1: Qa = 3P - 25 -->
  <!-- At P=8.33: Q=0, x=80, y=310-34.7=275.3 => (80,275) -->
  <!-- At P=55: Q=140, x=780 — clip to plot area. At Q=120: P=48.33, y=310-201.4=108.6 => (680,109) -->
  <line x1="80" y1="275" x2="680" y2="109" stroke="#1E8449" stroke-width="2.5"/>
  <text x="685" y="113" font-size="12" font-weight="bold" fill="#1E8449">A</text>

  <!-- Equilibrium: P*=25, Q*=50 -->
  <!-- x = 80 + 50*5 = 330; y = 310 - 25*4.167 = 310-104.2 = 205.8 -->
  <circle cx="330" cy="206" r="5" fill="#E74C3C"/>
  <line x1="330" y1="206" x2="330" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="330" y1="206" x2="80" y2="206" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="72" y="210" text-anchor="end" font-size="10" fill="#2D3748">P* = 25</text>
  <text x="330" y="325" text-anchor="middle" font-size="10" fill="#2D3748">Q* = 50</text>

  <!-- Shifted supply A': Qa' = 3P - 25 + 30 = 3P + 5 (shift right by 30 units) -->
  <!-- At P=0: Q=5, x=105, y=310 — but Qa must be >=0 -->
  <!-- At Q=0: P=-5/3 — negative, so starts at (80+5, 310) => use P=0 at Q=5 -->
  <!-- Better: At P=0: Q=5 => x=80+25=105, y=310 => (105,310) -->
  <!-- At Q=120: P=(120-5)/3=38.33, y=310-159.7=150.3 => (680,150) -->
  <line x1="105" y1="310" x2="680" y2="150" stroke="#1E8449" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="685" y="154" font-size="12" font-weight="bold" fill="#1E8449">A'</text>

  <!-- New equilibrium: -2P+100 = 3P+5 => 5P=95 => P*=19, Q*=62 -->
  <!-- x = 80 + 62*5 = 390; y = 310 - 19*4.167 = 310-79.2 = 230.8 -->
  <circle cx="390" cy="231" r="5" fill="#E74C3C" fill-opacity="0.6"/>
  <line x1="390" y1="231" x2="390" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="390" y1="231" x2="80" y2="231" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="72" y="235" text-anchor="end" font-size="9" fill="#718096">P' = 19</text>
  <text x="390" y="340" text-anchor="middle" font-size="9" fill="#718096">Q' = 62</text>

  <!-- Shift arrow (horizontal, between A and A' at y=230) -->
  <!-- At y=230: A is at x≈243, A' is at x≈393. Arrow between them. -->
  <line x1="260" y1="230" x2="370" y2="230" stroke="#1E8449" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Vuistregel box -->
  <rect x="450" y="250" width="220" height="50" rx="4" fill="#ffffff" fill-opacity="0.9" stroke="#CBD5E0" stroke-width="1"/>
  <text x="560" y="268" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E8449">Vuistregel:</text>
  <text x="560" y="284" text-anchor="middle" font-size="10" fill="#2D3748">A naar rechts: P daalt, Q stijgt</text>

  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1E8449"/>
    </marker>
  </defs>
</svg>