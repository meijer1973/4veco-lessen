<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial">
  <!-- Background -->
  <rect width="720" height="360" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2761">Markt voor hardloopschoenen — na vraagverschuiving</text>

  <!-- Y-axis -->
  <line x1="80" y1="310" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>
  <text x="15" y="180" text-anchor="middle" font-size="12" fill="#718096" transform="rotate(-90, 15, 180)">Prijs (€)</text>

  <!-- X-axis -->
  <line x1="80" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="680,310 670,306 670,314" fill="#2D3748"/>
  <text x="380" y="350" text-anchor="middle" font-size="12" fill="#718096">Hoeveelheid (Q)</text>

  <!-- Origin -->
  <text x="72" y="325" text-anchor="end" font-size="11" fill="#718096">0</text>

  <!--
    Same mapping: x = 80 + Q*6, y = 310 - P*3.25

    Original V: Qv = -P+80 → P=0:Q=80, P=80:Q=0
      (80,50) to (560,310)

    New V': Qv' = -P+100 → P=0:Q=100, P=100:Q=0
      At P=0: Q=100 → x=680, y=310
      At P=80: Q=20 → x=200, y=50 (clip at top of plot)

    Supply A: Qa = 2P-40 → P=20:Q=0, P=70:Q=100
      (80,245) to (680,83)

    Old equilibrium E: P*=40, Q*=40 → (320, 180)

    New equilibrium E': -P+100 = 2P-40 → 140=3P → P*'=46.67, Q*'=53.33
      x = 80 + 53.33*6 = 400, y = 310 - 46.67*3.25 = 158.3
  -->

  <!-- Original demand V (dashed - old) -->
  <line x1="80" y1="50" x2="560" y2="310" stroke="#1A5276" stroke-width="2" stroke-dasharray="8,5" opacity="0.5"/>
  <text x="565" y="305" font-size="11" fill="#1A5276" opacity="0.6">V</text>

  <!-- New demand V' (solid) -->
  <line x1="200" y1="50" x2="680" y2="310" stroke="#1A5276" stroke-width="2.5"/>
  <text x="685" y="305" font-size="12" font-weight="bold" fill="#1A5276">V'</text>

  <!-- Supply A (solid) -->
  <line x1="80" y1="245" x2="680" y2="83" stroke="#1E8449" stroke-width="2.5"/>
  <text x="685" y="83" font-size="12" font-weight="bold" fill="#1E8449">A</text>

  <!-- Old equilibrium E at (320, 180) -->
  <circle cx="320" cy="180" r="4" fill="#E74C3C" opacity="0.5"/>
  <line x1="320" y1="180" x2="320" y2="310" stroke="#E74C3C" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="320" y1="180" x2="80" y2="180" stroke="#E74C3C" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <text x="308" y="172" font-size="10" fill="#E74C3C" opacity="0.6">E</text>

  <!-- New equilibrium E' at (400, 158) -->
  <circle cx="400" cy="158" r="4.5" fill="#E74C3C"/>
  <line x1="400" y1="158" x2="400" y2="310" stroke="#E74C3C" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="400" y1="158" x2="80" y2="158" stroke="#E74C3C" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="412" y="152" font-size="11" font-weight="bold" fill="#E74C3C">E'</text>

  <!-- Axis labels for old equilibrium -->
  <text x="72" y="184" text-anchor="end" font-size="10" fill="#718096">40</text>
  <text x="320" y="325" text-anchor="middle" font-size="10" fill="#718096">40</text>

  <!-- Axis labels for new equilibrium -->
  <text x="72" y="162" text-anchor="end" font-size="11" fill="#2D3748">46⅔</text>
  <text x="400" y="325" text-anchor="middle" font-size="11" fill="#2D3748">53⅓</text>

  <!-- Tick marks -->
  <line x1="76" y1="180" x2="84" y2="180" stroke="#2D3748" stroke-width="1"/>
  <line x1="76" y1="158" x2="84" y2="158" stroke="#2D3748" stroke-width="1"/>
  <line x1="320" y1="306" x2="320" y2="314" stroke="#2D3748" stroke-width="1"/>
  <line x1="400" y1="306" x2="400" y2="314" stroke="#2D3748" stroke-width="1"/>

  <!-- Shift arrow: horizontal, at ~1/3 from top of V line -->
  <line x1="155" y1="130" x2="210" y2="130" stroke="#1A5276" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#1A5276"/>
    </marker>
  </defs>
</svg>
