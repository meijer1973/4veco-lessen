<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial">
  <rect width="720" height="360" fill="#F7FAFC" rx="8"/>
  <text x="360" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2761">Figuur 4: Overzicht — verschuiving van A versus verschuiving van V</text>

  <!-- LEFT PANEL: Supply shift -->
  <rect x="20" y="38" width="330" height="250" fill="none" stroke="#CBD5E0" stroke-width="1" rx="4"/>
  <text x="185" y="55" text-anchor="middle" font-size="11" font-weight="bold" fill="#27AE60">Aanbodverschuiving</text>

  <!-- Mini axes left -->
  <line x1="55" y1="65" x2="55" y2="260" stroke="#2D3748" stroke-width="1"/>
  <polygon points="55,61 52,67 58,67" fill="#2D3748"/>
  <line x1="55" y1="260" x2="330" y2="260" stroke="#2D3748" stroke-width="1"/>
  <polygon points="334,260 328,257 328,263" fill="#2D3748"/>
  <text x="30" y="165" text-anchor="middle" font-size="9" fill="#718096" transform="rotate(-90,30,165)">P</text>
  <text x="195" y="275" text-anchor="middle" font-size="9" fill="#718096">Q</text>

  <!-- V line (blue) -->
  <line x1="55" y1="80" x2="280" y2="260" stroke="#1A5276" stroke-width="1.5"/>
  <text x="284" y="255" font-size="10" font-weight="bold" fill="#1A5276">V</text>

  <!-- A old (dashed orange) -->
  <line x1="55" y1="220" x2="280" y2="80" stroke="#E67E22" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="284" y="76" font-size="9" fill="#E67E22">A</text>

  <!-- A new (solid green) — shifted right -->
  <line x1="55" y1="240" x2="310" y2="80" stroke="#27AE60" stroke-width="1.5"/>
  <text x="314" y="76" font-size="10" font-weight="bold" fill="#27AE60">A'</text>

  <!-- Old E dot -->
  <circle cx="155" cy="175" r="3" fill="#CBD5E0"/>
  <!-- New E' dot (lower price, more Q) -->
  <circle cx="185" cy="190" r="3.5" fill="#2D3748"/>
  <text x="193" y="186" font-size="9" font-weight="bold" fill="#2D3748">E'</text>

  <!-- Arrow between old and new E -->
  <line x1="158" y1="177" x2="180" y2="188" stroke="#2D3748" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Shift arrow on A -->
  <line x1="210" y1="120" x2="245" y2="120" stroke="#27AE60" stroke-width="1.5"/>
  <polygon points="249,120 243,117 243,123" fill="#27AE60"/>

  <!-- RIGHT PANEL: Demand shift -->
  <rect x="370" y="38" width="330" height="250" fill="none" stroke="#CBD5E0" stroke-width="1" rx="4"/>
  <text x="535" y="55" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5276">Vraagverschuiving</text>

  <!-- Mini axes right -->
  <line x1="405" y1="65" x2="405" y2="260" stroke="#2D3748" stroke-width="1"/>
  <polygon points="405,61 402,67 408,67" fill="#2D3748"/>
  <line x1="405" y1="260" x2="680" y2="260" stroke="#2D3748" stroke-width="1"/>
  <polygon points="684,260 678,257 678,263" fill="#2D3748"/>
  <text x="380" y="165" text-anchor="middle" font-size="9" fill="#718096" transform="rotate(-90,380,165)">P</text>
  <text x="545" y="275" text-anchor="middle" font-size="9" fill="#718096">Q</text>

  <!-- A line (green) -->
  <line x1="405" y1="220" x2="630" y2="80" stroke="#27AE60" stroke-width="1.5"/>
  <text x="634" y="76" font-size="10" font-weight="bold" fill="#27AE60">A</text>

  <!-- V old (dashed orange) -->
  <line x1="405" y1="80" x2="600" y2="260" stroke="#E67E22" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="604" y="255" font-size="9" fill="#E67E22">V</text>

  <!-- V new (solid blue) — shifted right -->
  <line x1="405" y1="65" x2="650" y2="260" stroke="#1A5276" stroke-width="1.5"/>
  <text x="654" y="255" font-size="10" font-weight="bold" fill="#1A5276">V'</text>

  <!-- Old E dot -->
  <circle cx="495" cy="175" r="3" fill="#CBD5E0"/>
  <!-- New E' dot (higher price, more Q) -->
  <circle cx="535" cy="160" r="3.5" fill="#2D3748"/>
  <text x="543" y="156" font-size="9" font-weight="bold" fill="#2D3748">E'</text>

  <!-- Arrow between old and new E -->
  <line x1="498" y1="173" x2="530" y2="162" stroke="#2D3748" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Shift arrow on V -->
  <line x1="530" y1="210" x2="565" y2="210" stroke="#1A5276" stroke-width="1.5"/>
  <polygon points="569,210 563,207 563,213" fill="#1A5276"/>

  <!-- RULE BOXES below panels -->
  <rect x="20" y="295" width="330" height="50" fill="#E8F8F5" stroke="#27AE60" stroke-width="1.5" rx="4"/>
  <text x="185" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#27AE60">Aanbod neemt toe (A → rechts)</text>
  <text x="185" y="328" text-anchor="middle" font-size="9.5" fill="#2D3748">→ prijs daalt, hoeveelheid stijgt</text>
  <text x="185" y="340" text-anchor="middle" font-size="8.5" fill="#718096">(nieuw aanbod: lagere drempel, meer aanbod bij elke prijs)</text>

  <rect x="370" y="295" width="330" height="50" fill="#EBF5FB" stroke="#1A5276" stroke-width="1.5" rx="4"/>
  <text x="535" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A5276">Vraag neemt toe (V → rechts)</text>
  <text x="535" y="328" text-anchor="middle" font-size="9.5" fill="#2D3748">→ prijs stijgt, hoeveelheid stijgt</text>
  <text x="535" y="340" text-anchor="middle" font-size="8.5" fill="#718096">(meer kopers: hogere bereidheid, meer vraag bij elke prijs)</text>
</svg>