<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="400" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">De vijf aanbodfactoren</text>

  <!-- Center box: Aanbodfactoren -->
  <rect x="270" y="160" width="180" height="50" rx="8" fill="#1E8449" stroke="#1E8449" stroke-width="1.5"/>
  <text x="360" y="190" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF">Aanbodfactoren</text>

  <!-- Spoke 1: Inputprijzen (top-left) -->
  <rect x="60" y="55" width="160" height="40" rx="6" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.5"/>
  <text x="140" y="80" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1E8449">Inputprijzen</text>
  <line x1="220" y1="85" x2="280" y2="165" stroke="#1E8449" stroke-width="1.5"/>

  <!-- Spoke 2: Technologie (top-right) -->
  <rect x="500" y="55" width="160" height="40" rx="6" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.5"/>
  <text x="580" y="80" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1E8449">Technologie</text>
  <line x1="500" y1="85" x2="440" y2="165" stroke="#1E8449" stroke-width="1.5"/>

  <!-- Spoke 3: Aantal aanbieders (middle-left) -->
  <rect x="30" y="165" width="170" height="40" rx="6" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.5"/>
  <text x="115" y="190" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1E8449">Aantal aanbieders</text>
  <line x1="200" y1="185" x2="270" y2="185" stroke="#1E8449" stroke-width="1.5"/>

  <!-- Spoke 4: Verwachtingen (bottom-left) -->
  <rect x="60" y="280" width="160" height="40" rx="6" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.5"/>
  <text x="140" y="305" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1E8449">Verwachtingen</text>
  <line x1="220" y1="290" x2="280" y2="210" stroke="#1E8449" stroke-width="1.5"/>

  <!-- Spoke 5: Overheidsbeleid (bottom-right) -->
  <rect x="500" y="280" width="170" height="40" rx="6" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.5"/>
  <text x="585" y="305" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1E8449">Overheidsbeleid</text>
  <line x1="500" y1="290" x2="440" y2="210" stroke="#1E8449" stroke-width="1.5"/>

  <!-- Spoke 5b: Technologie (middle-right) — already placed, this is the right-side spoke -->
  <!-- Actually, we already have 5 spokes above. Let me verify:
       1. Inputprijzen (top-left)
       2. Technologie (top-right)
       3. Aantal aanbieders (middle-left)
       4. Verwachtingen (bottom-left)
       5. Overheidsbeleid (bottom-right)
  -->

  <!-- Subtitle -->
  <text x="360" y="375" text-anchor="middle" font-family="Arial" font-size="11" fill="#718096">Een verandering van een aanbodfactor verschuift de hele aanbodlijn</text>
</svg>