<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="720" height="360" rx="8" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1E2761">Beweging langs de aanbodlijn</text>

  <!-- Y-axis -->
  <line x1="80" y1="310" x2="80" y2="45" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="80,45 76,55 84,55" fill="#2D3748"/>
  <text x="15" y="180" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096" transform="rotate(-90, 15, 180)">Prijs (P)</text>

  <!-- X-axis -->
  <line x1="80" y1="310" x2="680" y2="310" stroke="#2D3748" stroke-width="1.5"/>
  <polygon points="680,310 670,306 670,314" fill="#2D3748"/>
  <text x="380" y="350" text-anchor="middle" font-family="Arial" font-size="12" fill="#718096">Hoeveelheid (panelen per maand)</text>

  <!-- Origin -->
  <text x="72" y="325" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">0</text>

  <!-- Supply curve A: Q=2P, from (80,310) to (680,45) -->
  <line x1="80" y1="310" x2="680" y2="45" stroke="#1E8449" stroke-width="2.5"/>
  <text x="685" y="50" font-family="Arial" font-size="12" font-weight="bold" fill="#1E8449">A</text>

  <!-- Dashed reference lines for point A: P=200, Q=400 → (320, 204) -->
  <line x1="80" y1="204" x2="320" y2="204" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="320" y1="204" x2="320" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Dashed reference lines for point B: P=400, Q=800 → (560, 98) -->
  <line x1="80" y1="98" x2="560" y2="98" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="560" y1="98" x2="560" y2="310" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Point A at (320, 204) -->
  <circle cx="320" cy="204" r="5" fill="#1E8449"/>
  <text x="305" y="220" text-anchor="end" font-family="Arial" font-size="12" font-weight="bold" fill="#1E8449">A</text>

  <!-- Point B at (560, 98) -->
  <circle cx="560" cy="98" r="5" fill="#1E8449"/>
  <text x="575" y="90" font-family="Arial" font-size="12" font-weight="bold" fill="#1E8449">B</text>

  <!-- Arrow along the curve from A to B -->
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#E67E22"/>
    </marker>
  </defs>
  <!-- Arrow path along the supply line from A toward B -->
  <line x1="335" y1="198" x2="540" y2="105" stroke="#E67E22" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Price labels -->
  <text x="72" y="208" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">200</text>
  <text x="72" y="102" text-anchor="end" font-family="Arial" font-size="11" fill="#2D3748">400</text>

  <!-- Quantity labels -->
  <text x="320" y="325" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">400</text>
  <text x="560" y="325" text-anchor="middle" font-family="Arial" font-size="11" fill="#2D3748">800</text>
</svg>
