<svg xmlns="http://www.w3.org/2000/svg" width="720" height="315" viewBox="0 0 720 315" role="img"><title>Schematische lokale omzetregel; beide prijsrichtingen en voorwaardelijke grens</title><rect width="720" height="315" fill="white"/><text x="24" y="31" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#182b3a">LOKAAL: rond één uitgangsprijs</text><text x="24" y="64" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#182b3a">Voldoende kleine verandering; andere omstandigheden gelijk.</text><line x1="360" y1="83" x2="360" y2="216" stroke="#182b3a" stroke-width="2"/><text x="24" y="109" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#182b3a">Prijsinelastisch</text><text x="24" y="157" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#182b3a">P ↑  →  TO ↑</text><text x="24" y="200" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#182b3a">P ↓  →  TO ↓</text><text x="389" y="109" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#182b3a">Prijselastisch</text><text x="389" y="157" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#182b3a">P ↑  →  TO ↓</text><text x="389" y="200" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#182b3a">P ↓  →  TO ↑</text><line x1="24" y1="221" x2="696" y2="221" stroke="#182b3a" stroke-width="2"/><text x="24" y="256" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#182b3a">Lokale regel; bij gegeven oude/nieuwe P en Q:</text><text x="24" y="291" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#182b3a">bereken TO vóór en na.</text></svg>
