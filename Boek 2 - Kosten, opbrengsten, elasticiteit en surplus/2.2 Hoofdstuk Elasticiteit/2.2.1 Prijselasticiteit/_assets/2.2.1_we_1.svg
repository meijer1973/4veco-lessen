<svg xmlns="http://www.w3.org/2000/svg" width="720" height="511" viewBox="0 0 720 511" role="img"><title>De berekende Bowlpleinreactie en de gegeven klimhalratio, zonder verzonnen percentages</title><defs><pattern id="quantity" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#182b3a"/><path d="M0 8L8 0" stroke="white" stroke-width="1.5"/></pattern></defs><rect width="720" height="511" fill="white"/><text x="24" y="32" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#182b3a">A. Bowlplein: berekende reactie</text><line x1="280" y1="62" x2="280" y2="153" stroke="#182b3a" stroke-width="2"/><text x="24" y="95" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#182b3a">Prijs</text><rect x="280" y="73" width="200" height="25" fill="#1A5276" stroke="#182b3a" stroke-width="2" data-value="25" data-scale="8" data-zero="280"/><text x="558" y="95" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#182b3a">+25%</text><text x="24" y="139" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#182b3a">Hoeveelheid</text><rect x="200" y="117" width="80" height="25" fill="url(#quantity)" stroke="#182b3a" stroke-width="2" data-value="-10" data-scale="8" data-zero="280"/><text x="558" y="139" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#182b3a">−10%</text><line x1="200" y1="166" x2="480" y2="166" stroke="#182b3a" stroke-width="2"/><line x1="200" y1="161" x2="200" y2="171" stroke="#182b3a" stroke-width="2"/><text x="200" y="199" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#182b3a">−10</text><line x1="280" y1="161" x2="280" y2="171" stroke="#182b3a" stroke-width="2"/><text x="280" y="199" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#182b3a">0</text><line x1="480" y1="161" x2="480" y2="171" stroke="#182b3a" stroke-width="2"/><text x="480" y="199" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#182b3a">+25</text><text x="538" y="199" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#182b3a">%</text><text x="24" y="240" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#182b3a">Ev = −10% / +25% = −0,4</text><line x1="24" y1="259" x2="696" y2="259" stroke="#182b3a" stroke-width="2"/><text x="24" y="291" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#182b3a">B. Vergelijk de absolute waarden</text><text x="24" y="332" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#182b3a">Bowlplein</text><rect x="330" y="310" width="72" height="25" fill="#1A5276" stroke="#182b3a" stroke-width="2" data-value="0.4" data-scale="180" data-zero="330"/><text x="180" y="332" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#182b3a">Ev = −0,4</text><text x="24" y="397" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#182b3a">Klimhal</text><rect x="330" y="375" width="270" height="25" fill="#1A5276" stroke="#182b3a" stroke-width="2" data-value="1.5" data-scale="180" data-zero="330"/><text x="180" y="397" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#182b3a">Ev = −1,5</text><line x1="330" y1="419" x2="600" y2="419" stroke="#182b3a" stroke-width="2"/><line x1="330" y1="414" x2="330" y2="424" stroke="#182b3a" stroke-width="2"/><text x="330" y="452" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#182b3a">0</text><line x1="510" y1="414" x2="510" y2="424" stroke="#182b3a" stroke-width="2"/><text x="510" y="452" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#182b3a">1</text><line x1="600.0" y1="414" x2="600.0" y2="424" stroke="#182b3a" stroke-width="2"/><text x="600.0" y="452" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#182b3a">1,5</text><line x1="510" y1="305" x2="510" y2="419" stroke="#182b3a" stroke-width="2" stroke-dasharray="8 5"/><text x="646" y="424" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#182b3a">|Ev|</text><text x="24" y="489" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#182b3a">Klimhal: alleen Ev gegeven, geen losse percentages.</text></svg>
