<svg xmlns="http://www.w3.org/2000/svg" width="760" height="780" viewBox="0 0 760 780" role="img" aria-labelledby="title desc">
  <title id="title">Beslis met de absolute waarde van Ev</title>
  <desc id="desc">Beslisregel voor prijselasticiteit: kleiner dan 1 is inelastisch, groter dan 1 is elastisch, gelijk aan 1 is unitair.</desc>
  <rect width="760" height="780" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="45" y="70" font-size="40" font-weight="700" fill="#1A5276">Beslis met de absolute waarde van Ev</text>
    <text x="47" y="116" font-size="32" font-weight="700" fill="#333333">Kijk naar de grootte van het getal.</text>
    <text x="47" y="154" font-size="32" font-weight="700" fill="#333333">Het minteken telt hier niet mee.</text>

    <rect x="65" y="205" width="285" height="135" rx="22" fill="#F4F7FA" stroke="#1A5276" stroke-width="5"/>
    <text x="105" y="260" font-size="34" font-weight="700" fill="#1f1f1f">|Ev| &lt; 1</text>
    <text x="105" y="306" font-size="34" font-weight="700" fill="#1f1f1f">inelastisch</text>

    <rect x="410" y="205" width="285" height="135" rx="22" fill="#F4F7FA" stroke="#1A5276" stroke-width="5"/>
    <text x="450" y="260" font-size="34" font-weight="700" fill="#1f1f1f">|Ev| &gt; 1</text>
    <text x="450" y="306" font-size="34" font-weight="700" fill="#1f1f1f">elastisch</text>

    <line x1="95" y1="420" x2="665" y2="420" stroke="#1A5276" stroke-width="9"/>
    <circle cx="380" cy="420" r="26" fill="#1A5276"/>
    <text x="88" y="482" font-size="34" font-weight="700" fill="#1A5276">0</text>
    <text x="370" y="482" font-size="34" font-weight="700" fill="#1A5276">1</text>
    <text x="595" y="482" font-size="34" font-weight="700" fill="#1A5276">groter</text>

    <rect x="205" y="535" width="350" height="95" rx="22" fill="#FFF4CF" stroke="#C8A100" stroke-width="5"/>
    <text x="265" y="592" font-size="34" font-weight="700" fill="#1f1f1f">|Ev| = 1: unitair</text>

    <rect x="60" y="675" width="640" height="70" rx="18" fill="#F4F7FA" stroke="#1A5276" stroke-width="4"/>
    <text x="90" y="720" font-size="30" font-weight="700" fill="#1f1f1f">Voorbeeld: Ev = -0,8 -> |Ev| = 0,8 -> inelastisch.</text>
  </g>
</svg>
