<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="667" viewBox="0 0 1000 667" role="img"><title>Drie functionele scenario&#x27;s: begin, alleen inkomen, reset en alleen andere prijs</title><defs><pattern id="quantity" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#182b3a"/><path d="M0 8L8 0" stroke="white" stroke-width="1.5"/></pattern></defs><rect width="1000" height="667" fill="white"/><text x="24" y="42" font-family="Arial, DejaVu Sans, sans-serif" font-size="35" font-weight="700" text-anchor="start" fill="#182b3a">Eén input wijzigen; steeds terug naar hetzelfde begin</text><rect x="24" y="65" width="952" height="142" fill="#eef4f7" stroke="#182b3a"/><text x="48" y="103" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#182b3a">Begin</text><text x="48" y="148" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Px = 20</text><text x="48" y="188" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#182b3a"></text><text x="263" y="148" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Pz = 10</text><text x="263" y="188" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#182b3a"></text><text x="478" y="148" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Y = 30.000</text><text x="478" y="188" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#182b3a"></text><text x="760" y="148" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Qx = 200</text><text x="760" y="188" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#182b3a"></text><rect x="24" y="226" width="952" height="142" fill="#eef4f7" stroke="#182b3a"/><text x="48" y="264" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#182b3a">Alleen het inkomen stijgt</text><text x="48" y="309" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Px = 20</text><text x="48" y="349" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#182b3a">gelijk</text><text x="263" y="309" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Pz = 10</text><text x="263" y="349" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#182b3a">gelijk</text><text x="478" y="309" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Y = 36.000</text><text x="478" y="349" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#182b3a">verandert</text><text x="760" y="309" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Qx = 230</text><text x="760" y="349" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#182b3a">uitkomst</text><rect x="24" y="387" width="952" height="142" fill="#eef4f7" stroke="#182b3a"/><text x="48" y="425" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#182b3a">Terug naar begin; alleen de andere prijs stijgt</text><text x="48" y="470" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Px = 20</text><text x="48" y="510" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#182b3a">gelijk</text><text x="263" y="470" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Pz = 14</text><text x="263" y="510" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#182b3a">verandert</text><text x="478" y="470" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Y = 30.000</text><text x="478" y="510" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#182b3a">weer begin</text><text x="760" y="470" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Qx = 204</text><text x="760" y="510" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#182b3a">uitkomst</text><text x="24" y="590" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Px en Pz: € per maand. Y: € per jaar.</text><text x="24" y="638" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Qx: abonnementen per maand. Overige omstandigheden gelijk.</text></svg>
