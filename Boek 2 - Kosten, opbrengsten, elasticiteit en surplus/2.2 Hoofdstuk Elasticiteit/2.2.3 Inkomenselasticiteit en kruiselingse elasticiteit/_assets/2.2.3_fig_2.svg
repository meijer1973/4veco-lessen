<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" role="img"><title>Getekende Ei-schaal met open grenspunten nul en één zonder categorie</title><defs><pattern id="quantity" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#182b3a"/><path d="M0 8L8 0" stroke="white" stroke-width="1.5"/></pattern></defs><rect width="1000" height="465" fill="white"/><text x="24" y="42" font-family="Arial, DejaVu Sans, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#182b3a">Ei: behoud het teken en controleer de grenzen</text><line x1="95" y1="160" x2="905" y2="160" stroke="#182b3a" stroke-width="3"/><line x1="95" y1="152" x2="95" y2="168" stroke="#182b3a" stroke-width="3"/><text x="95" y="209" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#182b3a">−1</text><line x1="365" y1="152" x2="365" y2="168" stroke="#182b3a" stroke-width="3"/><text x="365" y="209" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#182b3a">0</text><line x1="635" y1="152" x2="635" y2="168" stroke="#182b3a" stroke-width="3"/><text x="635" y="209" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#182b3a">1</text><line x1="905" y1="152" x2="905" y2="168" stroke="#182b3a" stroke-width="3"/><text x="905" y="209" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#182b3a">2</text><circle cx="230.0" cy="160" r="8" fill="#182b3a"/><text x="230.0" y="120" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#182b3a">−0,5</text><circle cx="500.0" cy="160" r="8" fill="#182b3a"/><text x="500.0" y="120" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#182b3a">0,5</text><circle cx="770.0" cy="160" r="8" fill="#182b3a"/><text x="770.0" y="120" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#182b3a">1,5</text><circle cx="365" cy="160" r="8" fill="white" stroke="#182b3a" stroke-width="3"/><line x1="365" y1="232" x2="365" y2="340" stroke="#182b3a" stroke-width="3" stroke-dasharray="8 5"/><circle cx="635" cy="160" r="8" fill="white" stroke="#182b3a" stroke-width="3"/><line x1="635" y1="232" x2="635" y2="340" stroke="#182b3a" stroke-width="3" stroke-dasharray="8 5"/><text x="90" y="277" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#182b3a">Inferieur</text><text x="90" y="324" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Ei &lt; 0</text><text x="393" y="277" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#182b3a">Normaal</text><text x="393" y="324" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">0 &lt; Ei &lt; 1</text><text x="702" y="277" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#182b3a">Luxe</text><text x="702" y="324" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Ei &gt; 1</text><text x="24" y="390" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Bij Ei = 0 en Ei = 1: hier geen categorie.</text><text x="24" y="438" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Ei heeft geen eenheid. Dit is géén |Ev|-schaal.</text></svg>
