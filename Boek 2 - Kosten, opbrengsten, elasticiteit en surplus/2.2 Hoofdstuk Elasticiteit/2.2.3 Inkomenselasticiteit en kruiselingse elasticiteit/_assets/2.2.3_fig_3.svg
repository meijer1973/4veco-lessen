<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img"><title>Twee benoemde kruislingse verhoudingen bij dezelfde filmschijfhuurprijsstijging</title><defs><pattern id="quantity" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#182b3a"/><path d="M0 8L8 0" stroke="white" stroke-width="1.5"/></pattern></defs><rect width="1000" height="730" fill="white"/><text x="24" y="42" font-family="Arial, DejaVu Sans, sans-serif" font-size="35" font-weight="700" text-anchor="start" fill="#182b3a">Ek: boven een hoeveelheid, onder een andere prijs</text><rect x="24" y="74" width="952" height="249" fill="#eef4f7" stroke="#182b3a"/><text x="50" y="122" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Teller: %ΔQ digitale filmhuur = +10%</text><line x1="50" y1="143" x2="950" y2="143" stroke="#182b3a" stroke-width="3"/><text x="50" y="188" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Noemer: %ΔP filmschijfhuur = +20%</text><text x="50" y="244" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#182b3a">Ek = +10% / +20% = +0,5</text><text x="50" y="294" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#182b3a">Substituten: twee manieren om een film te huren.</text><rect x="24" y="353" width="952" height="249" fill="#eef4f7" stroke="#182b3a"/><text x="50" y="401" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Teller: %ΔQ passende beschermhoezen = −4%</text><line x1="50" y1="422" x2="950" y2="422" stroke="#182b3a" stroke-width="3"/><text x="50" y="467" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Noemer: %ΔP filmschijfhuur = +20%</text><text x="50" y="523" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#182b3a">Ek = −4% / +20% = −0,2</text><text x="50" y="573" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#182b3a">Complementen: filmschijf en passende hoes.</text><text x="24" y="654" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">De eigen prijzen van digitale huur en hoezen blijven gelijk.</text><text x="24" y="702" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182b3a">Ook de overige omstandigheden blijven gelijk.</text></svg>
