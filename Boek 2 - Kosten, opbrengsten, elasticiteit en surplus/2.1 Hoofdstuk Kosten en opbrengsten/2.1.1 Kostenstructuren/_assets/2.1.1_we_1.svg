xt><text x="625" y="197" font-size="22" fill="#182b3a" text-anchor="middle" font-weight="700">4</text><text x="60" y="258" font-size="22" fill="#182b3a" text-anchor="middle" font-weight="700">200</text><text x="185" y="258" font-size="22" fill="#182b3a" text-anchor="middle" font-weight="400">totaal</text><text x="345" y="258" font-size="22" fill="#182b3a" text-anchor="middle" font-weight="700">200</text><text x="480" y="258" font-size="22" fill="#182b3a" text-anchor="middle" font-weight="700">400</text><text x="625" y="258" font-size="22" fill="#182b3a" text-anchor="middle" font-weight="700">600</text><text x="60" y="302" font-size="22" fill="#182b3a" text-anchor="middle" font-weight="700"></text><text x="185" y="302" font-size="22" fill="#182b3a" text-anchor="middle" font-weight="400">gemiddeld</text><text x="345" y="302" font-size="22" fill="#182b3a" text-anchor="middle" font-weight="700">1</text><text x="480" y="302" font-size="22" fill="#182b3a" text-anchor="middle" font-weight="700">2</text><text x="625" y="302" font-size="22" fill="#182b3a" text-anchor="middle" font-weight="700">3</text><line x1="24" y1="120" x2="696" y2="120" stroke="#94a5ad" stroke-width="2" stroke-dasharray=""/><line x1="24" y1="222" x2="696" y2="222" stroke="#94a5ad" stroke-width="2" stroke-dasharray=""/><text x="24" y="346" font-size="21" fill="#182b3a" text-anchor="start" font-weight="400">Totalen: euro/maand. Gemiddelden: euro/reparatie.</text><text x="24" y="377" font-size="21" fill="#1A5276" text-anchor="start" font-weight="400">Deel ieder totaal door de Q van diezelfde maand.</text></g></svg>
