<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-labelledby="title"><title id="title">GCK halveert, GVK blijft gelijk, GTK halveert niet</title><rect width="720" height="372" rx="8" fill="#F7FAFC"/><g font-family="Arial,DejaVu Sans,sans-serif"><text x="24" y="32" font-size="27" fill="#182b3a" text-anchor="start" font-weight="700">Wat gebeurt er per poster?</text><text x="305" y="79" font-size="22" fill="#182b3a" text-anchor="middle" font-weight="700">Q = 40</text><text x="580" y="79" font-size="22" fill="#182b3a" text-anchor="middle" font-weight="700">Q = 80</text><text x="30" y="117" font-size="26" fill="#182b3a" text-anchor="start" font-weight="700">GCK</text><text x="305" y="117" font-size="26" fill="#182b3a" text-anchor="middle" font-weight="400">€ 3,00</text><text x="442" y="117" font-size="28" fill="#182b3a" text-anchor="middle" font-weight="400">→</text><text x="580" y="117" font-size="26" fill="#182b3a" text-anchor="middle" font-weight="400">€ 1,50</text><text x="305" y="147" font-size="20" fill="#182b3a" text-anchor="start" font-weight="400">dezelfde TCK / tweemaal Q</text><text x="30" y="197" font-size="26" fill="#1A5276" text-anchor="start" font-weight="700">GVK</text><text x="305" y="197" font-size="26" fill="#182b3a" text-anchor="middle" font-weight="400">€ 2,00</text><text x="442" y="197" font-size="28" fill="#182b3a" text-anchor="middle" font-weight="400">→</text><text x="580" y="197" font-size="26" fill="#182b3a" text-anchor="middle" font-weight="400">€ 2,00</text><text x="305" y="227" font-size="20" fill="#1A5276" text-anchor="start" font-weight="400">hetzelfde bedrag per poster</text><text x="30" y="277" font-size="26" fill="#8E44AD" text-anchor="start" font-weight="700">GTK</text><text x="305" y="277" font-size="26" fill="#182b3a" text-anchor="middle" font-weight="400">€ 5,00</text><text x="442" y="277" font-size="28" fill="#182b3a" text-anchor="middle" font-weight="400">→</text><text x="580" y="277" font-size="26" fill="#182b3a" text-anchor="middle" font-weight="400">€ 3,50</text><text x="305" y="307" font-size="20" fill="#8E44AD" text-anchor="start" font-weight="400">GCK + GVK</text><text x="24" y="352" font-size="20" fill="#182b3a" text-anchor="start" font-weight="400">Alle bedragen: euro per poster; één maand, zelfde capaciteit.</text></g></svg>
