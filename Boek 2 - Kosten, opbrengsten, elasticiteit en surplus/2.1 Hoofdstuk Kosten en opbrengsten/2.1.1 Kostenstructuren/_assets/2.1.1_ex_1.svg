<svg xmlns="http://www.w3.org/2000/svg" width="720" height="279" viewBox="0 0 720 279" role="img" aria-labelledby="title"><title id="title">Huur classificeren en totalen onderscheiden van kosten per badge</title><rect width="720" height="279" rx="8" fill="#F7FAFC"/><g font-family="Arial,DejaVu Sans,sans-serif"><text x="24" y="35" font-size="26" fill="#182b3a" text-anchor="start" font-weight="700">Voorgedaan: huur € 120 per maand</text><text x="24" y="80" font-size="26" fill="#182b3a" text-anchor="start" font-weight="700">CONSTANT</text><text x="24" y="117" font-size="22" fill="#182b3a" text-anchor="start" font-weight="400">Meer badges? Het totale huurbedrag blijft € 120.</text><line x1="24" y1="141" x2="696" y2="141" stroke="#94a5ad" stroke-width="2" stroke-dasharray=""/><text x="24" y="180" font-size="23" fill="#182b3a" text-anchor="start" font-weight="700">Maandbedrag → totaal</text><text x="24" y="217" font-size="23" fill="#182b3a" text-anchor="start" font-weight="400">Totaal / aantal badges → bedrag per badge</text><text x="24" y="255" font-size="21" fill="#182b3a" text-anchor="start" font-weight="400">Deze maand, Q = 50–100, dezelfde capaciteit.</text></g></svg>
