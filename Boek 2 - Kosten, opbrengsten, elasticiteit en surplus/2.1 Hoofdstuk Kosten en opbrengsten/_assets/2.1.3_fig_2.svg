<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <style>
      .title{font-family:Arial,DejaVu Sans,sans-serif;font-size:36px;font-weight:700;fill:#1A5276}
      .sub{font-family:Arial,DejaVu Sans,sans-serif;font-size:25px;fill:#333}
      .panel{fill:#FFFFFF;stroke:#8A8A8A;stroke-width:2;rx:20}
      .pblue{fill:#EAF3FA;stroke:#1A5276;stroke-width:3;rx:18}
      .pgreen{fill:#EEF7EE;stroke:#3B7A3B;stroke-width:3;rx:18}
      .porange{fill:#FFF8E6;stroke:#B7791F;stroke-width:3;rx:18}
      .head{font-family:Arial,DejaVu Sans,sans-serif;font-size:30px;font-weight:700;fill:#1A5276}
      .head2{font-family:Arial,DejaVu Sans,sans-serif;font-size:30px;font-weight:700;fill:#3B7A3B}
      .text{font-family:Arial,DejaVu Sans,sans-serif;font-size:24px;fill:#1a1a1a}
      .small{font-family:Arial,DejaVu Sans,sans-serif;font-size:21px;fill:#333}
      .code{font-family:Arial,DejaVu Sans,sans-serif;font-size:27px;font-weight:700;fill:#1a1a1a}
      .arrow{stroke:#555;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .tick{stroke:#999;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#555"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="760" fill="#fff"/>
  <text x="70" y="62" class="title">Figuur 2 - Het patroon van MK hangt af van de kostenfunctie</text>
  <text x="70" y="104" class="sub">Gebruik steeds dezelfde regel: verschil tussen rijen delen door de stapgrootte.</text>

  <g transform="translate(70,145)">
    <rect x="0" y="0" width="600" height="520" class="pblue"/>
    <text x="35" y="58" class="head">Lineaire kosten</text>
    <text x="35" y="104" class="code">TK = 200 + 3Q</text>
    <text x="35" y="148" class="text">Bij elk extra product komt er €3 bij.</text>
    <text x="35" y="195" class="text">Daarom blijft MK constant:</text>
    <g transform="translate(35,235)">
      <rect x="0" y="0" width="520" height="68" fill="#fff" stroke="#9bbbd4" stroke-width="2" rx="12"/>
      <text x="25" y="43" class="code">MK = 3</text>
      <text x="180" y="43" class="text">in elke stap</text>
    </g>
    <g transform="translate(35,340)">
      <line x1="0" y1="45" x2="520" y2="45" stroke="#1A5276" stroke-width="5"/>
      <line x1="0" y1="25" x2="0" y2="65" class="tick"/>
      <line x1="130" y1="25" x2="130" y2="65" class="tick"/>
      <line x1="260" y1="25" x2="260" y2="65" class="tick"/>
      <line x1="390" y1="25" x2="390" y2="65" class="tick"/>
      <line x1="520" y1="25" x2="520" y2="65" class="tick"/>
      <text x="0" y="105" text-anchor="middle" class="small">0</text>
      <text x="130" y="105" text-anchor="middle" class="small">10</text>
      <text x="260" y="105" text-anchor="middle" class="small">20</text>
      <text x="390" y="105" text-anchor="middle" class="small">30</text>
      <text x="520" y="105" text-anchor="middle" class="small">40</text>
      <text x="260" y="145" text-anchor="middle" class="small">gelijke Q-stappen, zelfde MK</text>
    </g>
  </g>

  <g transform="translate(730,145)">
    <rect x="0" y="0" width="600" height="520" class="pgreen"/>
    <text x="35" y="58" class="head2">Stijgende kosten</text>
    <text x="35" y="104" class="code">TK = 100 + Q²</text>
    <text x="35" y="148" class="text">De extra kosten worden steeds groter.</text>
    <text x="35" y="195" class="text">Bij stappen van 5 producten:</text>
    <g transform="translate(35,235)">
      <rect x="0" y="0" width="120" height="82" class="porange"/>
      <text x="60" y="32" text-anchor="middle" class="small">0-5</text>
      <text x="60" y="63" text-anchor="middle" class="code">MK 5</text>
      <rect x="132" y="0" width="120" height="82" class="porange"/>
      <text x="192" y="32" text-anchor="middle" class="small">5-10</text>
      <text x="192" y="63" text-anchor="middle" class="code">MK 15</text>
      <rect x="264" y="0" width="120" height="82" class="porange"/>
      <text x="324" y="32" text-anchor="middle" class="small">10-15</text>
      <text x="324" y="63" text-anchor="middle" class="code">MK 25</text>
      <rect x="396" y="0" width="120" height="82" class="porange"/>
      <text x="456" y="32" text-anchor="middle" class="small">15-20</text>
      <text x="456" y="63" text-anchor="middle" class="code">MK 35</text>
    </g>
    <g transform="translate(35,350)">
      <rect x="0" y="0" width="520" height="68" fill="#fff" stroke="#9BC69B" stroke-width="2" rx="12"/>
      <text x="260" y="43" text-anchor="middle" class="code">MK stijgt: 5 &lt; 15 &lt; 25 &lt; 35</text>
    </g>
    <text x="35" y="462" class="text">Als de prijs vast is, blijft MO gelijk aan de prijs.</text>
  </g>
</svg>