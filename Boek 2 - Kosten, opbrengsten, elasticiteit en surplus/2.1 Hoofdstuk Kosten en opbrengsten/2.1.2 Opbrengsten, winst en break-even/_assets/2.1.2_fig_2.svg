<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
<title>Break-even grafiek met TK en TO</title>
<desc>Grafiek met productie Q op de horizontale as en euro's op de verticale as. TO = 1,50Q snijdt TK = 500 + 0,80Q bij Q ongeveer 714. Bij Q = 1000 is de verticale afstand tussen TO en TK gelijk aan 200 euro winst.</desc>
<style>
  .title{font-family:Arial,DejaVu Sans,sans-serif;font-size:24px;font-weight:700;fill:#1A5276}
  .sub{font-family:Arial,DejaVu Sans,sans-serif;font-size:17px;fill:#333}
  .axis{stroke:#222;stroke-width:2.5}
  .grid{stroke:#D7DDE3;stroke-width:1.3}
  .tick{stroke:#222;stroke-width:2}
  .label{font-family:Arial,DejaVu Sans,sans-serif;font-size:17px;fill:#222}
  .small{font-family:Arial,DejaVu Sans,sans-serif;font-size:16px;fill:#444}
  .lineTO{stroke:#1A5276;stroke-width:4;fill:none}
  .lineTK{stroke:#9A3412;stroke-width:4;fill:none}
  .dash{stroke:#555;stroke-width:2;stroke-dasharray:7 6;fill:none}
  .profit{fill:#DFF2E3;stroke:#267A3E;stroke-width:2}
  .point{fill:#111}
  .callout{fill:white;stroke:#777;stroke-width:1.8;rx:8;ry:8}
</style>
<rect width="720" height="480" fill="white"/>
<text x="35" y="38" class="title">Break-even: TO en TK kruisen elkaar</text>
<text x="35" y="64" class="sub">Winst bij één Q = verticale afstand tussen TO en TK.</text>

<!-- plot x 80..665, y 380..90 ; Q 0..1200, euro 0..1800 -->
<line x1="80" y1="380" x2="665" y2="380" class="grid"/>
<line x1="80" y1="299.4" x2="665" y2="299.4" class="grid"/>
<line x1="80" y1="218.9" x2="665" y2="218.9" class="grid"/>
<line x1="80" y1="138.3" x2="665" y2="138.3" class="grid"/>
<line x1="80" y1="380" x2="80" y2="90" class="grid"/>
<line x1="323.8" y1="380" x2="323.8" y2="90" class="grid"/>
<line x1="567.5" y1="380" x2="567.5" y2="90" class="grid"/>

<!-- profit gap at Q=1000: x=567.5, TO y=138.3, TK y=170.6 -->
<rect x="554" y="138.3" width="27" height="32.3" class="profit"/>
<line x1="567.5" y1="380" x2="567.5" y2="90" class="dash"/>

<!-- break-even Q=714.3 x=428.2 y=207.4 -->
<line x1="428.2" y1="380" x2="428.2" y2="207.4" class="dash"/>
<line x1="80" y1="207.4" x2="428.2" y2="207.4" class="dash"/>

<line x1="80" y1="380" x2="680" y2="380" class="axis"/>
<line x1="80" y1="380" x2="80" y2="78" class="axis"/>

<path d="M80 380 L665 90" class="lineTO"/>
<path d="M80 299.4 L665 143.3" class="lineTK"/>

<circle cx="428.2" cy="207.4" r="5" class="point"/>
<circle cx="567.5" cy="138.3" r="4.5" fill="#1A5276"/>
<circle cx="567.5" cy="170.6" r="4.5" fill="#9A3412"/>

<text x="590" y="115" class="label">TO = 1,50Q</text>
<text x="555" y="210" class="label">TK = 500 + 0,80Q</text>
<rect x="250" y="144" width="175" height="50" class="callout"/>
<text x="262" y="166" class="label">break-even</text>
<text x="262" y="187" class="small">TO = TK, Q ≈ 714</text>
<rect x="438" y="105" width="170" height="50" class="callout"/>
<text x="450" y="127" class="label">Q=1000: winst €200</text>
<text x="450" y="148" class="small">verticale afstand</text>

<line x1="80" y1="380" x2="80" y2="387" class="tick"/>
<line x1="323.8" y1="380" x2="323.8" y2="387" class="tick"/>
<line x1="567.5" y1="380" x2="567.5" y2="387" class="tick"/>
<text x="62" y="412" class="label">Q=0</text>
<text x="288" y="412" class="label">Q=500</text>
<text x="520" y="412" class="label">Q=1000</text>
<text x="568" y="450" class="label">aantal broden</text>

<line x1="73" y1="299.4" x2="80" y2="299.4" class="tick"/>
<line x1="73" y1="218.9" x2="80" y2="218.9" class="tick"/>
<line x1="73" y1="138.3" x2="80" y2="138.3" class="tick"/>
<text x="22" y="305" class="label">€500</text>
<text x="13" y="225" class="label">€1000</text>
<text x="13" y="144" class="label">€1500</text>
<text x="55" y="84" class="label">euro</text>
</svg>