<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="615" viewBox="0 0 1200 615" role="img" aria-labelledby="title"><title id="title">MO in dezelfde hoeveelheidstabel; vaste prijs per fotohouder</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 Z" fill="#2D3748"/></marker></defs><rect width="1200" height="615" fill="#F7FAFC"/><g font-family="Arial,DejaVu Sans,sans-serif" text-rendering="geometricPrecision"><text x="40" y="50" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">Fotohouders: dezelfde werkdag</text><text x="40" y="130" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">Q</text><text x="350" y="130" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">0</text><text x="700" y="130" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">10</text><text x="1050" y="130" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">20</text><text x="40" y="210" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">TK (€)</text><text x="350" y="210" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">20</text><text x="700" y="210" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">50</text><text x="1050" y="210" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">100</text><text x="40" y="290" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">TO (€)</text><text x="350" y="290" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">0</text><text x="700" y="290" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">80</text><text x="1050" y="290" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">160</text><line x1="260" y1="395" x2="700" y2="330" stroke="#2D3748" stroke-width="4" marker-end="url(#arrow)"/><text x="40" y="450" font-size="30pt" fill="#1A5276" font-weight="400" text-anchor="start">ΔTO = 80; ΔQ = 10</text><text x="40" y="510" font-size="30pt" fill="#1A5276" font-weight="700" text-anchor="start">MO = 80/10 = 8</text><line x1="860" y1="395" x2="1050" y2="330" stroke="#2D3748" stroke-width="4" marker-end="url(#arrow)"/><text x="640" y="450" font-size="30pt" fill="#1A5276" font-weight="400" text-anchor="start">ΔTO = 80; ΔQ = 10</text><text x="640" y="510" font-size="30pt" fill="#1A5276" font-weight="700" text-anchor="start">MO = 80/10 = 8</text><text x="40" y="580" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">Vaste prijs € 8: MO = € 8 per extra fotohouder</text></g></svg>
