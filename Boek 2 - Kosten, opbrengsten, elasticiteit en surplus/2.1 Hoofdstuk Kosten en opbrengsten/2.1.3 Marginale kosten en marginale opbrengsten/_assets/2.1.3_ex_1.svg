<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title"><title id="title">Eerste interval volledig gesteund; tweede interval met lege breuken en cellen</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 Z" fill="#2D3748"/></marker></defs><rect width="1200" height="540" fill="#F7FAFC"/><g font-family="Arial,DejaVu Sans,sans-serif" text-rendering="geometricPrecision"><text x="40" y="45" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">Patches: van 0 naar 3, dan van 3 naar 6</text><text x="40" y="95" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">Eerste MK = (15 − 9)/(3 − 0) = 2</text><text x="40" y="145" font-size="30pt" fill="#1A5276" font-weight="400" text-anchor="start">Eerste MO = (15 − 0)/(3 − 0) = 5</text><line x1="100" y1="163" x2="100" y2="212" stroke="#2D3748" stroke-width="4" marker-end="url(#arrow)"/><text x="140" y="210" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">Rij Q = 3: MK 2; MO 5; winst 15 − 15 = 0</text><line x1="40" y1="240" x2="1160" y2="240" stroke="#2D3748" stroke-width="4"/><text x="40" y="290" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">Nu interval 3–6: vul zelf in</text><text x="40" y="345" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">MK = (… − …)/(… − …) = …</text><text x="40" y="400" font-size="30pt" fill="#1A5276" font-weight="400" text-anchor="start">MO = (… − …)/(… − …) = …</text><text x="40" y="450" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">Rij Q = 6: MK …; MO …; winst …</text><text x="40" y="510" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">MK en MO: € per extra patch binnen het interval</text></g></svg>
