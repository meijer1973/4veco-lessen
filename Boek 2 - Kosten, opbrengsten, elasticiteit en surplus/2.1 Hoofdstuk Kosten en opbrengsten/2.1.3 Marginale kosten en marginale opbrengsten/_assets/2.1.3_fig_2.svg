<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title"><title id="title">MK berekend en geplaatst bij het rechter eindpunt; eerste en tweede interval</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 Z" fill="#2D3748"/></marker></defs><rect width="1200" height="600" fill="#F7FAFC"/><g font-family="Arial,DejaVu Sans,sans-serif" text-rendering="geometricPrecision"><text x="40" y="50" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">Fotohouders: dezelfde werkdag</text><text x="40" y="130" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">Q</text><text x="350" y="130" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">0</text><text x="700" y="130" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">10</text><text x="1050" y="130" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">20</text><text x="40" y="210" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">TK (€)</text><text x="350" y="210" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">20</text><text x="700" y="210" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">50</text><text x="1050" y="210" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">100</text><line x1="260" y1="330" x2="700" y2="245" stroke="#2D3748" stroke-width="4" marker-end="url(#arrow)"/><text x="40" y="385" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">ΔTK = 30; ΔQ = 10</text><text x="40" y="445" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">MK = 30/10 = 3</text><text x="40" y="505" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">bij Q = 10</text><line x1="860" y1="330" x2="1050" y2="245" stroke="#2D3748" stroke-width="4" marker-end="url(#arrow)"/><text x="640" y="385" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">ΔTK = 50; ΔQ = 10</text><text x="640" y="445" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">MK = 50/10 = 5</text><text x="640" y="505" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">bij Q = 20</text><text x="40" y="565" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">MK: € per extra fotohouder binnen het interval</text></g></svg>
