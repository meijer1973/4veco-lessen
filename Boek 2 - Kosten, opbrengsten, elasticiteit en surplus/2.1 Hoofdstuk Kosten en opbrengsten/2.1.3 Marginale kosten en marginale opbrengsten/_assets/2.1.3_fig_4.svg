<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625" role="img" aria-labelledby="title"><title id="title">Totale winst en gemiddelde winsttoename zijn verschillende grootheden</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 Z" fill="#2D3748"/></marker></defs><rect width="1200" height="625" fill="#F7FAFC"/><g font-family="Arial,DejaVu Sans,sans-serif" text-rendering="geometricPrecision"><text x="40" y="50" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">Interval 0–10: ΔQ = 10</text><text x="40" y="110" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">Totale winst: −20 → 30 euro per dag</text><text x="40" y="170" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">Δwinst = ΔTO − ΔTK = 80 − 30 = 50 euro</text><text x="40" y="230" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">Δwinst/ΔQ = 50/10 = 8 − 3 = 5</text><text x="40" y="285" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">Dus € 5 winsttoename per extra fotohouder</text><text x="40" y="360" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">Interval 10–20: ΔQ = 10</text><text x="40" y="420" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">Totale winst: 30 → 60 euro per dag</text><text x="40" y="480" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">Δwinst = ΔTO − ΔTK = 80 − 50 = 30 euro</text><text x="40" y="540" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">Δwinst/ΔQ = 30/10 = 8 − 5 = 3</text><text x="40" y="595" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">Dus € 3 winsttoename per extra fotohouder</text><line x1="40" y1="307" x2="1160" y2="307" stroke="#2D3748" stroke-width="4"/></g></svg>
