<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title"><title id="title">Twee intervallen in de kostentabel; Q in fotohouders per dag, TK in euro per dag</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 Z" fill="#2D3748"/></marker></defs><rect width="1200" height="380" fill="#F7FAFC"/><g font-family="Arial,DejaVu Sans,sans-serif" text-rendering="geometricPrecision"><text x="40" y="50" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">Fotohouders: dezelfde werkdag</text><text x="40" y="130" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">Q</text><text x="350" y="130" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">0</text><text x="700" y="130" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">10</text><text x="1050" y="130" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">20</text><text x="40" y="210" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">TK (€)</text><text x="350" y="210" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">20</text><text x="700" y="210" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">50</text><text x="1050" y="210" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">100</text><line x1="350" y1="255" x2="700" y2="255" stroke="#2D3748" stroke-width="4" marker-end="url(#arrow)"/><line x1="700" y1="295" x2="1050" y2="295" stroke="#2D3748" stroke-width="4" marker-end="url(#arrow)"/><text x="525" y="310" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">0–10</text><text x="875" y="350" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="middle">10–20</text></g></svg>
