<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="765" viewBox="0 0 1200 765" role="img" aria-labelledby="title"><title id="title">Drie eindpuntrijen van Lus en Bout; constante en stijgende MK</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 Z" fill="#2D3748"/></marker></defs><rect width="1200" height="765" fill="#F7FAFC"/><g font-family="Arial,DejaVu Sans,sans-serif" text-rendering="geometricPrecision"><text x="40" y="48" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">Lus: Q = 0 / 2 / 4 / 6 per dag</text><text x="40" y="103" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">TK (€): 12 / 16 / 20 / 24</text><text x="40" y="155" font-size="30pt" fill="#1A5276" font-weight="400" text-anchor="start">TO (€): 0 / 12 / 24 / 36</text><text x="40" y="207" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">Eerste MK = (16 − 12)/(2 − 0) = 2</text><text x="40" y="259" font-size="30pt" fill="#1A5276" font-weight="400" text-anchor="start">Eerste MO = (12 − 0)/(2 − 0) = 6</text><text x="40" y="313" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">Bij Q = 2 / 4 / 6: MK 2 / 2 / 2; MO steeds 6</text><text x="40" y="408" font-size="30pt" fill="#1F2937" font-weight="700" text-anchor="start">Bout: Q = 0 / 2 / 4 / 6 per dag</text><text x="40" y="463" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">TK (€): 8 / 12 / 24 / 44</text><text x="40" y="515" font-size="30pt" fill="#1A5276" font-weight="400" text-anchor="start">TO (€): 0 / 24 / 48 / 72</text><text x="40" y="567" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">Eerste MK = (12 − 8)/(2 − 0) = 2</text><text x="40" y="619" font-size="30pt" fill="#1A5276" font-weight="400" text-anchor="start">Eerste MO = (24 − 0)/(2 − 0) = 12</text><text x="40" y="673" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">Bij Q = 2 / 4 / 6: MK 2 / 6 / 10; MO steeds 12</text><line x1="40" y1="348" x2="1160" y2="348" stroke="#2D3748" stroke-width="4"/><text x="40" y="735" font-size="30pt" fill="#1F2937" font-weight="400" text-anchor="start">MK en MO: € per extra sleutelhanger in het interval</text></g></svg>
