<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Samenhang van CS, PS en TS en de grens van een verdelingsuitspraak.</title><desc id="desc">Per transactie valt de prijs weg uit CS plus PS: het totale voordeel is betalingsbereidheid min marginale kosten. Een totaal is geen eerlijkheidsoordeel.</desc>
<defs><pattern id="cs-hatch" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M-6,6 L6,-6 M0,24 L24,0 M18,30 L30,18" stroke="#2D3748" stroke-width="2"/></pattern><pattern id="ps-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="2.5" fill="#2D3748"/></pattern></defs>
<rect width="1200" height="900" fill="#F7FAFC"/>
<text id="scene" x="600" y="68" text-anchor="middle" font-family="Arial" font-size="40" font-weight="400" fill="#2D3748">Voordeel per transactie</text><rect id="group-0" x="100" y="160" width="1000" height="170" fill="none" stroke="#2D3748" stroke-width="4"/><text id="group-title-0" x="180" y="225" text-anchor="start" font-family="Arial" font-size="40" font-weight="400" fill="#2D3748">CS per gekochte eenheid</text><text id="group-rule-0" x="180" y="280" text-anchor="start" font-family="Arial" font-size="40" font-weight="400" fill="#2D3748">WTP − P</text><rect id="group-1" x="100" y="380" width="1000" height="170" fill="none" stroke="#2D3748" stroke-width="4"/><text id="group-title-1" x="180" y="445" text-anchor="start" font-family="Arial" font-size="40" font-weight="400" fill="#2D3748">PS per verkochte eenheid</text><text id="group-rule-1" x="180" y="500" text-anchor="start" font-family="Arial" font-size="40" font-weight="400" fill="#2D3748">P − MK</text><rect id="group-2" x="100" y="600" width="1000" height="170" fill="none" stroke="#2D3748" stroke-width="4"/><text id="group-title-2" x="180" y="665" text-anchor="start" font-family="Arial" font-size="40" font-weight="400" fill="#2D3748">TS per transactie</text><text id="group-rule-2" x="180" y="720" text-anchor="start" font-family="Arial" font-size="40" font-weight="400" fill="#2D3748">WTP − MK = CS + PS</text>
</svg>
