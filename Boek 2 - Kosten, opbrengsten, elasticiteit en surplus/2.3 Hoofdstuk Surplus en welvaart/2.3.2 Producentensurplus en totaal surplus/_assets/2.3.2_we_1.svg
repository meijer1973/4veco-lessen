<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Uitgewerkt surplusmodel voor sporthanddoeken.</title><desc id="desc">De markt voor sporthanddoeken heeft evenwicht 12 stuks bij 18 euro. CS en PS zijn elk 72 euro; TS is 144 euro.</desc>
