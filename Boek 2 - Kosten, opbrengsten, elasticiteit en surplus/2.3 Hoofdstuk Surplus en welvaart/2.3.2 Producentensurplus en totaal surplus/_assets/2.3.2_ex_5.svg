<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Oplossing van de surplusmarkeringen bij kaarsen.</title><desc id="desc">Bij kaarsen ligt het evenwicht op 24 stuks en 14 euro; CS is 144 euro, PS 72 euro en TS 216 euro.</desc>
