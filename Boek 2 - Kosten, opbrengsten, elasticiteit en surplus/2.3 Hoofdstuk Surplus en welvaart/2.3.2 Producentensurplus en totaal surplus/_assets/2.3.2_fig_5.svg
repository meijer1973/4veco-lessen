<title id="title">Consumenten- en producentensurplus bij tulpenbossen.</title><desc id="desc">PS ligt onder 14 euro en boven de aanbodlijn, van 0 tot 32 bossen. PS is 128 euro; samen met CS is TS 384 euro.</desc>
