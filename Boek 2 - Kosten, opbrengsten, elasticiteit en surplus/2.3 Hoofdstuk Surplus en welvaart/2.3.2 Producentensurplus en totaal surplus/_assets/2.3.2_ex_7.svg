<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Oplossing van het evenwicht en de surplusgebieden bij concertkaartjes.</title><desc id="desc">Bij concertkaartjes ligt het evenwicht op 60 kaartjes en 20 euro; CS is 900 euro, PS 450 euro en TS 1.350 euro.</desc>
