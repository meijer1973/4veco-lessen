<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Surplus van koper en reparateur bij één paraplureparatie.</title><desc id="desc">Eén paraplureparatie: de klant wint 8 euro en de reparateur 3 euro ten opzichte van betalingsbereidheid en marginale kosten. Samen is dat 11 euro.</desc>
<defs><pattern id="cs-hatch" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M-6,6 L6,-6 M0,24 L24,0 M18,30 L30,18" stroke="#2D3748" stroke-width="2"/></pattern><pattern id="ps-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="2.5" fill="#2D3748"/></pattern></defs>
<rect width="1200" height="900" fill="#F7FAFC"/>
<text id="scene" x="600" y="68" text-anchor="middle" font-family="Arial" font-size="40" font-weight="400" fill="#2D3748">Eén paraplureparatie</text><rect id="buyer-band" x="220" y="240" width="390" height="240" fill="#85C1E9" fill-opacity="0.45"/><rect x="220" y="240" width="390" height="240" fill="url(#cs-hatch)"/><rect id="seller-band" x="220" y="480" width="390" height="90" fill="#82E0AA" fill-opacity="0.45"/><rect x="220" y="480" width="390" height="90" fill="url(#ps-dots)"/><line id="wtp" x1="220" y1="240" x2="610" y2="240" stroke="#2D3748" stroke-width="4"/><line id="price" x1="220" y1="480" x2="610" y2="480" stroke="#2D3748" stroke-width="4"/><line id="mc" x1="220" y1="570" x2="610" y2="570" stroke="#2D3748" stroke-width="4"/><text id="wtp-label" x="650" y="255" text-anchor="start" font-family="Arial" font-size="40" font-weight="400" fill="#2D3748">WTP: € 18</text><text id="price-label" x="650" y="495" text-anchor="start" font-family="Arial" font-size="40" font-weight="400" fill="#2D3748">Prijs: € 10</text><text id="mc-label" x="650" y="585" text-anchor="start" font-family="Arial" font-size="40" font-weight="400" fill="#2D3748">MK: € 7</text><rect id="cs-label-background" x="310" y="321" width="180" height="60" fill="#F7FAFC"/><rect id="ps-label-background" x="310" y="496" width="180" height="60" fill="#F7FAFC"/><text id="cs-label" x="400" y="365" text-anchor="middle" font-family="Arial" font-size="40" font-weight="400" fill="#2D3748">CS: € 8</text><text id="ps-label" x="400" y="540" text-anchor="middle" font-family="Arial" font-size="40" font-weight="400" fill="#2D3748">PS: € 3</text><text id="ts-label" x="650" y="380" text-anchor="start" font-family="Arial" font-size="40" font-weight="400" fill="#2D3748">TS: € 11</text><text id="meaning" x="600" y="710" text-anchor="middle" font-family="Arial" font-size="40" font-weight="400" fill="#2D3748">Eén werkelijke transactie</text>
</svg>
