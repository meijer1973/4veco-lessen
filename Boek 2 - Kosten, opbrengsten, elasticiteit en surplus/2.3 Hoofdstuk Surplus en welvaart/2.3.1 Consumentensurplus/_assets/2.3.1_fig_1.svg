<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Betalingsbereidheid en consumentensurplus van vier workshopdeelnemers</title><desc id="desc">Afzonderlijke personen met betalingsbereidheid 18, 14, 10 en 6 euro. Bij prijs 10 kopen de eerste drie; hun surplus is 8, 4 en 0 euro, samen 12. De vierde koopt niet.</desc>
