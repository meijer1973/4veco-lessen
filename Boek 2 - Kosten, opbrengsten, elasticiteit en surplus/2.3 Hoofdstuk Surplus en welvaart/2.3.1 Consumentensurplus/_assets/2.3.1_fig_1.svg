D3748" stroke-width="3.5"/><line id="category-axis" x1="160" y1="650" x2="1040" y2="650" stroke="#2D3748" stroke-width="3.5"/><rect id="wtp-1" x="230" y="245" width="100" height="405" fill="#CBD5E0" stroke="#1A5276" stroke-width="3"/><rect id="gap-1" x="230" y="245" width="100" height="180" fill="#85C1E9" fill-opacity="0.45"/><rect x="230" y="245" width="100" height="180" fill="url(#hatch)"/><text x="280" y="233" text-anchor="middle" font-family="Arial" font-size="30pt" font-weight="400" fill="#2D3748">18</text><text x="280" y="715" text-anchor="middle" font-family="Arial" font-size="30pt" font-weight="400" fill="#2D3748">1</text><rect id="wtp-2" x="430" y="335" width="100" height="315" fill="#CBD5E0" stroke="#1A5276" stroke-width="3"/><rect id="gap-2" x="430" y="335" width="100" height="90" fill="#85C1E9" fill-opacity="0.45"/><rect x="430" y="335" width="100" height="90" fill="url(#hatch)"/><text x="480" y="323" text-anchor="middle" font-family="Arial" font-size="30pt" font-weight="400" fill="#2D3748">14</text><text x="480" y="715" text-anchor="middle" font-family="Arial" font-size="30pt" font-weight="400" fill="#2D3748">2</text><rect id="wtp-3" x="630" y="425" width="100" height="225" fill="#CBD5E0" stroke="#1A5276" stroke-width="3"/><text x="680" y="413" text-anchor="middle" font-family="Arial" font-size="30pt" font-weight="400" fill="#2D3748">10</text><text x="680" y="715" text-anchor="middle" font-family="Arial" font-size="30pt" font-weight="400" fill="#2D3748">3</text><rect id="wtp-4" x="830" y="515" width="100" height="135" fill="#CBD5E0" stroke="#1A5276" stroke-width="3"/><text x="880" y="503" text-anchor="middle" font-family="Arial" font-size="30pt" font-weight="400" fill="#2D3748">6</text><text x="880" y="715" text-anchor="middle" font-family="Arial" font-size="30pt" font-weight="400" fill="#2D3748">4</text><line id="price" x1="160" y1="425" x2="1040" y2="425" stroke="#2D3748" stroke-width="3.5" stroke-dasharray="16 10"/><text x="1060" y="439" text-anchor=