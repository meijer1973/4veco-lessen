<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Tuintour — consumentensurplus met basis en hoogte</title><desc id="desc">Tuintour: P = 30 − 0.5Q; gegeven P = 10, Qd = 40. CS is het gebied boven de prijs en onder de vraaglijn. Geen berekend marktevenwicht.</desc>
