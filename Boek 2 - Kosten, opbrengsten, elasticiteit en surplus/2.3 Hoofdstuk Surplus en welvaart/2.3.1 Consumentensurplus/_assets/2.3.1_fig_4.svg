<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Boekenbeurs — consumentensurplus en betaling</title><desc id="desc">Boekenbeurs: P = 40 − 0.5Q; gegeven P = 10, Qd = 60. CS is het gebied boven de prijs en onder de vraaglijn. Geen berekend marktevenwicht.</desc>
