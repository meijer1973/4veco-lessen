<text x="61.45824" y="409.14075" font-family="Lato" font-size="9.99976" font-weight="700" fill="#ffffff">2</text>
<text x="83.85827" y="409.09515" font-family="Lato" font-size="12.29956" font-weight="700" fill="#183e51">Reken eerst de vermenigvuldigingen uit</text>
<text x="65.85827" y="441.83728" font-family="Lato" font-size="11.09985" font-weight="700" fill="#183e51">Eigen prijs</text>
<text x="65.85827" y="461.7995" font-family="Lato" font-size="12.09961" font-weight="700" fill="#007da2">−5 × 10 = −50</text>
<text x="65.85827" y="480.448" font-family="Lato" font-size="10.19971" font-weight="400" fill="#183e51">Hogere Px → lagere Qx.</text>
<text x="230.04462" y="441.83728" font-family="Lato" font-size="11.09985" font-weight="700" fill="#183e51">Prijs van Z</text>
<text x="230.04462" y="461.7995" font-family="Lato" font-size="12.09961" font-weight="700" fill="#b76518">+2 × 15 = +30</text>
<text x="230.04462" y="480.448" font-family="Lato" font-size="10.19971" font-weight="400" fill="#183e51">Hogere Pz → hogere Qx.</text>
<text x="394.23096" y="441.83728" font-family="Lato" font-size="11.09985" font-weight="700" fill="#183e51">Inkomen</text>
<text x="394.23096" y="461.7995" font-family="Lato" font-size="12.09961" font-weight="700" fill="#008779">+0,01 × 20.000</text>
<text x="394.23096" y="482.40848" font-family="Lato" font-size="12.09961" font-weight="700" fill="#008779">= +200</text>
<text x="394.23096" y="501.05701" font-family="Lato" font-size="10.19971" font-weight="400" fill="#183e51">Hoger Y → hogere Qx.</text>
