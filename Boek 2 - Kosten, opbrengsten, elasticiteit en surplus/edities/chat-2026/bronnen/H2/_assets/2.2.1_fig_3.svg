<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img"><title>De indeling gebruikt de absolute waarde</title><rect width="720" height="200" fill="white"/><text x="360.000" y="25.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold" >Kijk voor de indeling naar |Ev|</text><rect x="65.000" y="65.000" width="200.000" height="42.000" rx="0" fill="#eaf3f7" stroke="none"/><rect x="265.000" y="65.000" width="400.000" height="42.000" rx="0" fill="#eef5f0" stroke="none"/><line x1="65.000" y1="107.000" x2="675.000" y2="107.000" stroke="#183247" stroke-width="2"/><line x1="65.000" y1="101.000" x2="65.000" y2="115.000" stroke="#183247" stroke-width="2"/><text x="65.000" y="139.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="normal" >0</text><line x1="265.000" y1="101.000" x2="265.000" y2="115.000" stroke="#183247" stroke-width="2"/><text x="265.000" y="139.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="normal" >1</text><line x1="465.000" y1="101.000" x2="465.000" y2="115.000" stroke="#183247" stroke-width="2"/><text x="465.000" y="139.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="normal" >2</text><line x1="665.000" y1="101.000" x2="665.000" y2="115.000" stroke="#183247" stroke-width="2"/><text x="665.000" y="139.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="normal" >3</text><line x1="265.000" y1="55.000" x2="265.000" y2="116.000" stroke="#ad601b" stroke-width="2"/><text x="265.000" y="50.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" fill="#ad601b" text-anchor="middle" font-weight="bold" >grens 1</text><text x="165.000" y="92.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#17688f" text-anchor="middle" font-weight="bold" >inelastisch</text><text x="465.000" y="92.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#227064" text-anchor="middle" font-weight="bold" >elastisch</text><text x="165.000" y="171.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" fill="#183247" text-anchor="middle" font-weight="normal" >Ev = −0,5 → |Ev| = 0,5</text><text x="475.000" y="171.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" fill="#183247" text-anchor="middle" font-weight="normal" >Ev = −2 → |Ev| = 2</text></svg>