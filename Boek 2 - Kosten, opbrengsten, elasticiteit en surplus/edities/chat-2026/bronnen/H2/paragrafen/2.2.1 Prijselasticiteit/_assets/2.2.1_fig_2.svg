<svg xmlns="http://www.w3.org/2000/svg" width="720" height="237" viewBox="0 0 720 237" role="img"><title>Van twee veranderingen naar Ev</title><rect width="720" height="237" fill="white"/><rect x="5.000" y="8.000" width="335.000" height="112.000" rx="6" fill="#f2f6f8" stroke="none"/><text x="172.500" y="36.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#183247" text-anchor="middle" font-weight="bold" >Prijs: € 10 → € 11</text><text x="172.500" y="66.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="normal" >(11 − 10) / 10 × 100%</text><text x="172.500" y="101.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="24" fill="#17688f" text-anchor="middle" font-weight="bold" >+10%</text><rect x="380.000" y="8.000" width="335.000" height="112.000" rx="6" fill="#f2f6f8" stroke="none"/><text x="547.500" y="36.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#183247" text-anchor="middle" font-weight="bold" >Qv: 200 → 190</text><text x="547.500" y="66.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="normal" >(190 − 200) / 200 × 100%</text><text x="547.500" y="101.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="24" fill="#227064" text-anchor="middle" font-weight="bold" >−5%</text><line x1="175.000" y1="125.000" x2="303.000" y2="157.000" stroke="#536777" stroke-width="2"/><path d="M294.188,158.832 L303.000,157.000 L296.087,151.237" fill="none" stroke="#536777" stroke-width="2"/><line x1="546.000" y1="125.000" x2="417.000" y2="157.000" stroke="#536777" stroke-width="2"/><path d="M423.923,151.249 L417.000,157.000 L425.808,158.848" fill="none" stroke="#536777" stroke-width="2"/><rect x="115.000" y="164.000" width="490.000" height="56.000" rx="6" fill="#eaf3f7" stroke="none"/><text x="360.000" y="199.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="25" fill="#17688f" text-anchor="middl