<svg xmlns="http://www.w3.org/2000/svg" width="720" height="264" viewBox="0 0 720 264" role="img"><title>Elk gegeven gaat naar zijn eigen term</title><rect width="720" height="264" fill="white"/><text x="360.000" y="24.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="23" fill="#183247" text-anchor="middle" font-weight="bold" >Qx = 200 − 5Px + 2Pz + 0,01Y</text><rect x="5.000" y="53.000" width="220.000" height="97.000" rx="6" fill="#f2f6f8" stroke="none"/><text x="115.000" y="84.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" fill="#17688f" text-anchor="middle" font-weight="bold" >Px = 10</text><text x="115.000" y="121.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" fill="#183247" text-anchor="middle" font-weight="normal" >−5 × 10 = −50</text><line x1="115.000" y1="156.000" x2="360.000" y2="188.000" stroke="#17688f" stroke-width="1.8"/><path d="M351.457,190.832 L360.000,188.000 L352.471,183.069" fill="none" stroke="#17688f" stroke-width="1.8"/><rect x="250.000" y="53.000" width="220.000" height="97.000" rx="6" fill="#f2f6f8" stroke="none"/><text x="360.000" y="84.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" fill="#ad601b" text-anchor="middle" font-weight="bold" >Pz = 15</text><text x="360.000" y="121.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" fill="#183247" text-anchor="middle" font-weight="normal" >+2 × 15 = +30</text><line x1="360.000" y1="156.000" x2="360.000" y2="188.000" stroke="#ad601b" stroke-width="1.8"/><path d="M356.085,179.896 L360.000,188.000 L363.915,179.896" fill="none" stroke="#ad601b" stroke-width="1.8"/><rect x="495.000" y="53.000" width="220.000" height="97.000" rx="6" fill="#f2f6f8" stroke="none"/><text x="605.000" y="84.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" fill="#227064" text-anchor="middle" font-weight="bold" >Y = 20.000</text><text x="605.000" y="121.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" fill="#183247" text-anchor="middle" font-weight="normal" >+0,01 × 20.000 = +200</text><line x1="605.000" y1="156.000" x2="360.000" y2="188.000" stroke="#227064" stroke-width="1.8"/><path d="M367.529,183.069 L360.000,188.000 L368.543,190.832" fill="none" stroke="#227064" stroke-width="1.8"/><rect x="92.000" y="193.000" width="536.000" height="57.000" rx="6" fill="#eaf3f7" stroke="none"/><text x="360.000" y="228.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="24" fill="#17688f" text-anchor="middle" font-weight="bold" >200 − 50 + 30 + 200 = 380</text></svg>