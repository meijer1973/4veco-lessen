<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img"><rect width="720" height="250" fill="white"/><text x="360.00" y="25.00" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold" >Marginaal gaat over de extra producten</text><rect x="10" y="55" width="290" height="83" rx="5" fill="#f2f6f8" stroke="none"/><text x="155.00" y="85.00" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="bold" >Eerst</text><text x="155.00" y="115.00" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" fill="#183247" text-anchor="middle" font-weight="normal" >Q = 40; TK = € 260</text><rect x="420" y="55" width="290" height="83" rx="5" fill="#f2f6f8" stroke="none"/><text x="565.00" y="85.00" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="bold" >Daarna</text><text x="565.00" y="115.00" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" fill="#183247" text-anchor="middle" font-weight="normal" >Q = 50; TK = € 300</text><text x="360.00" y="107.00" font-family="Lato, DejaVu Sans, sans-serif" font-size="35" fill="#183247" text-anchor="middle" font-weight="normal" >→</text><text x="360.00" y="174.00" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#183247" text-anchor="middle" font-weight="normal" >10 extra producten kosten samen € 40 extra.</text><rect x="125" y="191" width="470" height="43" rx="5" fill="#f2f6f8" stroke="none"/><text x="360.00" y="220.00" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" fill="#227064" text-anchor="middle" font-weight="bold" >MK = € 40 ÷ 10 = € 4 per extra product</text></svg>