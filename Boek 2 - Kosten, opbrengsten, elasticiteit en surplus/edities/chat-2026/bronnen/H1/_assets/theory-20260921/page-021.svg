<text x="120.78944" y="461.30685" font-family="Lato" font-size="10.99951" font-weight="700" fill="#18364b">Eerst</text>
<text x="117.10133" y="478.29993" font-family="Lato" font-size="10.59961" font-weight="400" fill="#18364b">Q = 40</text>
<text x="107.19825" y="492.18594" font-family="Lato" font-size="10.59961" font-weight="400" fill="#18364b">TK = € 260</text>
<text x="207.95886" y="479.01462" font-family="Lato" font-size="16.99951" font-weight="400" fill="#506979">→</text>
<text x="281.99704" y="461.30685" font-family="Lato" font-size="10.99951" font-weight="700" fill="#18364b">Daarna</text>
<text x="283.45969" y="478.29993" font-family="Lato" font-size="10.59961" font-weight="400" fill="#18364b">Q = 50</text>
<text x="273.55661" y="492.18594" font-family="Lato" font-size="10.59961" font-weight="400" fill="#18364b">TK = € 300</text>
<text x="374.31723" y="479.01462" font-family="Lato" font-size="16.99951" font-weight="400" fill="#506979">→</text>
<text x="434.81552" y="461.30685" font-family="Lato" font-size="10.99951" font-weight="700" fill="#18364b">Nieuw − oud</text>
<text x="446.22482" y="478.29993" font-family="Lato" font-size="10.59961" font-weight="400" fill="#18364b">ΔQ = 10</text>
<text x="439.39572" y="492.18594" font-family="Lato" font-size="10.59961" font-weight="400" fill="#18364b">ΔTK = € 40</text>
<text x="142.23886" y="529.30139" font-family="Lato" font-size="11.2998" font-weight="400" fill="#18364b">€ 40 extra kosten ÷ 10 extra producten = </text>
<text x="348.52548" y="529.30139" font-family="Lato" font-size="11.2998" font-weight="700" fill="#18364b">€ 4 per extra product</text>
<text x="454.37" y="529.30139" font-family="Lato" font-size="11.2998" font-weight="400" fill="#18364b">.</text>
