<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img"><title>Eén transactie, twee voordelen</title><rect width="720" height="230" fill="white"/><text x="360.000" y="26.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="19" fill="#183247" text-anchor="middle" font-weight="700" >Een drinkfles: betalingsbereidheid € 50, prijs € 35, MK € 20</text><rect x="60" y="78" width="240" height="46" rx="0" fill="#e3e9ed" stroke="none"/><text x="180.000" y="108.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#183247" text-anchor="middle" font-weight="700" >kosten: € 20</text><rect x="300" y="78" width="180" height="46" rx="0" fill="#dceee4" stroke="none"/><text x="390.000" y="108.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#183247" text-anchor="middle" font-weight="700" >PS: € 15</text><rect x="480" y="78" width="180" height="46" rx="0" fill="#dcecf4" stroke="none"/><text x="570.000" y="108.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#183247" text-anchor="middle" font-weight="700" >CS: € 15</text><line x1="60.000" y1="68.000" x2="60.000" y2="133.000" stroke="#536777" stroke-width="1"/><text x="60.000" y="158.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="400" >€ 0</text><line x1="300.000" y1="68.000" x2="300.000" y2="133.000" stroke="#536777" stroke-width="1"/><text x="300.000" y="158.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="400" >€ 20</text><line x1="480.000" y1="68.000" x2="480.000" y2="133.000" stroke="#536777" stroke-width="1"/><text x="480.000" y="158.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="400" >€ 35</text><line x1="660.000" y1="68.000" x2="660.000" y2="133.000" stroke="#536777" stroke-width="1"/><text x="660.000" y="158.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="400" >€ 50</text><text x="360.000" y="203.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="22" fill="#183247" text-anchor="middle" font-weight="700" >Totaal voordeel = € 50 − € 20 = € 30</text></svg>