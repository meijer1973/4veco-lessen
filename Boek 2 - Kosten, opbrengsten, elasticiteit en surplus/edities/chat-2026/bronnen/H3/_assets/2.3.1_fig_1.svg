<svg xmlns="http://www.w3.org/2000/svg" width="720" height="214" viewBox="0 0 720 214" role="img"><title>Je betaalt minder dan je maximaal over hebt</title><rect width="720" height="214" fill="white"/><text x="360.000" y="24.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="700" >Een kaartje: bereid te betalen € 30, prijs € 20</text><rect x="80" y="73" width="360" height="45" rx="0" fill="#e3e9ed" stroke="none"/><rect x="440" y="73" width="180" height="45" rx="0" fill="#dcecf4" stroke="none"/><text x="260.000" y="101.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#183247" text-anchor="middle" font-weight="700" >betaald: € 20</text><text x="530.000" y="101.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#17688f" text-anchor="middle" font-weight="700" >CS: € 10</text><line x1="80.000" y1="65.000" x2="80.000" y2="127.000" stroke="#536777" stroke-width="1.3"/><text x="80.000" y="150.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="400" >€ 0</text><line x1="440.000" y1="65.000" x2="440.000" y2="127.000" stroke="#536777" stroke-width="1.3"/><text x="440.000" y="150.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="400" >€ 20</text><line x1="620.000" y1="65.000" x2="620.000" y2="127.000" stroke="#536777" stroke-width="1.3"/><text x="620.000" y="150.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="400" >€ 30</text><text x="360.000" y="190.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" fill="#17688f" text-anchor="middle" font-weight="700" >Voordeel voor de koper = € 30 − € 20 = € 10</text></svg>