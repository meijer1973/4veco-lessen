<text x="65.85827" y="302.94028" font-family="Lato" font-size="11.09985" font-weight="700" fill="#183e51">Nieuwe koper</text>
<text x="65.85827" y="322.9025" font-family="Lato" font-size="12.09961" font-weight="700" fill="#007da2">27 − 22 = € 5</text>
<text x="65.85827" y="341.55099" font-family="Lato" font-size="10.19971" font-weight="700" fill="#183e51">Voordeel:</text>
<text x="109.35899" y="341.55099" font-family="Lato" font-size="10.19971" font-weight="400" fill="#183e51"> betaalt minder dan zijn</text>
<text x="65.85827" y="354.70901" font-family="Lato" font-size="10.19971" font-weight="400" fill="#183e51">betalingsbereidheid.</text>
<text x="312.13779" y="302.94028" font-family="Lato" font-size="11.09985" font-weight="700" fill="#183e51">Nieuwe verkoper</text>
<text x="312.13779" y="322.9025" font-family="Lato" font-size="12.09961" font-weight="700" fill="#008779">22 − 16,50 = € 5,50</text>
<text x="312.13779" y="341.55099" font-family="Lato" font-size="10.19971" font-weight="700" fill="#183e51">Voordeel:</text>
<text x="355.63852" y="341.55099" font-family="Lato" font-size="10.19971" font-weight="400" fill="#183e51"> ontvangt meer dan de marginale</text>
<text x="312.13779" y="354.70901" font-family="Lato" font-size="10.19971" font-weight="400" fill="#183e51">kosten.</text>
