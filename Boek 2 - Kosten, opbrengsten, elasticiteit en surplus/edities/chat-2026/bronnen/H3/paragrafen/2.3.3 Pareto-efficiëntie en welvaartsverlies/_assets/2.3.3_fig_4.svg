<svg xmlns="http://www.w3.org/2000/svg" width="720" height="233" viewBox="0 0 720 233" role="img"><title>Een extra transactie zonder nadeel voor anderen</title><rect width="720" height="233" fill="white"/><text x="360.000" y="25.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="700" >De 13e poster kan nog worden verhandeld</text><rect x="8" y="48" width="332" height="96" rx="5" fill="#f2f6f8" stroke="none"/><text x="174.000" y="77.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#17688f" text-anchor="middle" font-weight="700" >Nieuwe koper</text><text x="174.000" y="116.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#183247" text-anchor="middle" font-weight="700" >€ 27 − € 22 = € 5</text><rect x="380" y="48" width="332" height="96" rx="5" fill="#f2f6f8" stroke="none"/><text x="546.000" y="77.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#227064" text-anchor="middle" font-weight="700" >Nieuwe verkoper</text><text x="546.000" y="116.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#183247" text-anchor="middle" font-weight="700" >€ 22 − € 16,50 = € 5,50</text><line x1="174.000" y1="150.000" x2="286.000" y2="177.000" stroke="#536777" stroke-width="2"/><path d="M278.27600532443927,179.08324416521668 L286,177 L280.07371834698114,171.62606421985788" stroke="#536777" stroke-width="2" fill="none"/><line x1="546.000" y1="150.000" x2="434.000" y2="177.000" stroke="#536777" stroke-width="2"/><path d="M439.92628165301886,171.62606421985788 L434,177 L441.72399467556073,179.08324416521668" stroke="#536777" stroke-width="2" fill="none"/><rect x="65" y="180" width="590" height="41" rx="5" fill="#eef5f0" stroke="none"/><text x="360.000" y="207.000" font-family="Lato, DejaVu Sans, sans-serif" font-size="21" fill="#227064" text-anchor="middle" font-weight="700" >Bestaande transacties blijven ongewijzigd</text></svg>